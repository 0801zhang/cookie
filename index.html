  // ===== 法律 =====
  {id:'m01',type:'choice',q:'我国《民法典》开始施行的日期是？',options:['2020年1月1日','2020年5月28日','2021年1月1日','2021年10月1日'],ans:2,tag:'法律',tip:'《民法典》2020年5月28日通过，2021年1月1日起施行。它是新中国第一部以"法典"命名的法律。'},
  {id:'m02',type:'choice',q:'我国公民具有完全民事行为能力的年龄是？',options:['16 周岁','18 周岁','20 周岁','14 周岁'],ans:1,tag:'法律',tip:'18 周岁以上为完全民事行为能力人；8 周岁以上不满 18 周岁为限制民事行为能力人；不满 8 周岁为无民事行为能力人。'},
  {id:'m03',type:'choice',q:'已满 14 周岁不满 16 周岁的人，对下列哪种行为不负刑事责任？',options:['故意杀人','抢劫','盗窃','贩卖毒品'],ans:2,tag:'法律',tip:'14~16 周岁只对八类严重犯罪负责：故意杀人、故意伤害致重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质。盗窃不在其中。'},
  {id:'m04',type:'choice',q:'向人民法院请求保护民事权利的普通诉讼时效期间是？',options:['1 年','2 年','3 年','5 年'],ans:2,tag:'法律',tip:'《民法典》规定普通诉讼时效为 3 年，自权利人知道或应当知道权利受损害及义务人之日起计算。'},
  {id:'m05',type:'choice',q:'我国的国家宪法日是？',options:['12 月 4 日','10 月 1 日','3 月 15 日','5 月 1 日'],ans:0,tag:'法律',tip:'12 月 4 日为国家宪法日，因为现行宪法于 1982 年 12 月 4 日通过。'},
  {id:'m06',type:'choice',q:'我国法定结婚年龄是？',options:['男 20 女 18','男 22 女 20','男 20 女 20','男 25 女 23'],ans:1,tag:'法律',tip:'男不得早于 22 周岁，女不得早于 20 周岁。注意与"晚婚晚育"提倡年龄区分，后者不是法定条件。'},
  {id:'m07',type:'choice',q:'劳动者在法定节假日加班的，用人单位应支付不低于工资的？',options:['150%','200%','300%','100%'],ans:2,tag:'法律',tip:'工作日加班 ≥150%，休息日加班且不能补休 ≥200%，法定节假日加班 ≥300%。三档要分清。'},
  {id:'m08',type:'choice',q:'劳动合同期限三个月以上不满一年的，试用期不得超过？',options:['15 天','1 个月','2 个月','6 个月'],ans:1,tag:'法律',tip:'3 个月~1 年：试用期 ≤1 个月；1~3 年：≤2 个月；3 年以上或无固定期限：≤6 个月。同一单位只能约定一次试用期。'},
  {id:'m09',type:'choice',q:'下列不属于我国法定继承第一顺序继承人的是？',options:['配偶','子女','父母','兄弟姐妹'],ans:3,tag:'法律',tip:'第一顺序：配偶、子女、父母；第二顺序：兄弟姐妹、祖父母、外祖父母。有第一顺序继承人的，第二顺序不参与继承。'},
  {id:'m10',type:'choice',q:'公民对行政机关的具体行政行为不服，可以提起行政诉讼的期限一般是？',options:['知道作出行政行为之日起 3 个月','6 个月','1 年','2 年'],ans:1,tag:'法律',tip:'直接起诉的期限为知道或应当知道作出行政行为之日起 6 个月内。复议后起诉为收到复议决定书之日起 15 日内。'},
  {id:'m11',type:'choice',q:'我国宪法规定，中华人民共和国的一切权力属于？',options:['人民','中国共产党','全国人民代表大会','国务院'],ans:0,tag:'法律',tip:'一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。'},
  {id:'m12',type:'choice',q:'下列哪一项属于用益物权？',options:['抵押权','质权','土地承包经营权','留置权'],ans:2,tag:'法律',tip:'用益物权：土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权。担保物权：抵押权、质权、留置权。'},
  {id:'m13',type:'choice',q:'已满 12 周岁不满 14 周岁的人，犯故意杀人、故意伤害罪，致人死亡或以特别残忍手段致人重伤造成严重残疾，情节恶劣，经哪一机关核准追诉的，应当负刑事责任？',options:['最高人民法院','最高人民检察院','公安部','全国人大常委会'],ans:1,tag:'法律',tip:'《刑法修正案（十一）》新增：12~14 周岁犯上述罪行，须经<b>最高人民检察院</b>核准追诉才负刑责。'},

  // ===== 科技与生活 =====
  {id:'m14',type:'choice',q:'干冰是哪种物质的固态？',options:['水','二氧化碳','氮气','氧气'],ans:1,tag:'科技生活',tip:'干冰是固态二氧化碳，升华时直接由固态变气态，不产生液体，因此常用于冷链运输和舞台烟雾。'},
  {id:'m15',type:'choice',q:'冬天用手摸铁块比摸木块感觉更凉，主要是因为？',options:['铁的初始温度更低','铁导热快，从手上带走热量更快','木头会发热','铁的比热容更小'],ans:1,tag:'科技生活',tip:'两者温度相同，但金属导热系数大，迅速把手上的热量导走，所以"感觉"更凉。考的是导热性，不是温度。'},
  {id:'m16',type:'choice',q:'我国首辆火星车"祝融号"所属的探测任务是？',options:['嫦娥工程','天问一号','北斗导航','悟空号'],ans:1,tag:'科技生活',tip:'天问一号是中国首次火星探测任务，2021 年着陆，"祝融号"为其火星车。嫦娥工程探月，北斗为导航系统，悟空号探测暗物质。'},
  {id:'m17',type:'choice',q:'"北斗"是我国自主研发的？',options:['气象卫星系统','全球卫星导航系统','深海探测器','空间站'],ans:1,tag:'科技生活',tip:'北斗三号全球卫星导航系统于 2020 年 7 月正式开通，是继美国 GPS、俄罗斯格洛纳斯、欧盟伽利略之后的第四大全球导航系统。'},
  {id:'m18',type:'choice',q:'彩虹的形成主要与什么光学现象有关？',options:['光的折射与色散','光的反射','光的衍射','光的偏振'],ans:0,tag:'科技生活',tip:'阳光进入水滴后发生折射、内反射、再折射，不同波长的光折射率不同而分离，形成七色光谱。'},
  {id:'m19',type:'choice',q:'下列关于声的说法，正确的是？',options:['声音在真空中传播最快','声音在固体中传播比在空气中快','声音在空气中传播速度约 3400 m/s','声音不能在水中传播'],ans:1,tag:'科技生活',tip:'声速：固体 > 液体 > 气体，空气中约 340 m/s，水中约 1500 m/s，钢铁中约 5000 m/s。真空不能传声。'},
  {id:'m20',type:'choice',q:'缺乏维生素 A 最可能导致？',options:['坏血病','夜盲症','脚气病','佝偻病'],ans:1,tag:'科技生活',tip:'维A—夜盲症；维B1—脚气病；维C—坏血病；维D—佝偻病；维K—凝血障碍。这是一组高频对应。'},
  {id:'m21',type:'choice',q:'使用灭火器扑救电气火灾时，首选？',options:['水','泡沫灭火器','二氧化碳灭火器','直接拍打'],ans:2,tag:'科技生活',tip:'二氧化碳灭火器不导电、无残留，适合电器和精密设备。水和泡沫导电，会造成触电和短路。'},
  {id:'m22',type:'choice',q:'雷雨天气在户外，下列做法最正确的是？',options:['躲在大树下','蹲下并双脚并拢，降低身体高度','举着金属雨伞快跑','站在高处观察'],ans:1,tag:'科技生活',tip:'雷击时最危险的是"跨步电压"和尖端物体。应远离树木、杆塔、金属物，双脚并拢下蹲，减小接触面。'},
  {id:'m23',type:'choice',q:'"光年"是什么单位？',options:['时间单位','距离单位','速度单位','亮度单位'],ans:1,tag:'科技生活',tip:'光年是光在真空中一年走过的距离，约 9.46 万亿公里，是<b>长度单位</b>。'},
  {id:'m24',type:'choice',q:'5G 相比 4G 最显著的优势不包括？',options:['传输速率更高','时延更低','连接密度更大','覆盖半径更大'],ans:3,tag:'科技生活',tip:'5G 三大特性是高速率、低时延、大连接。但因频率高，单基站<b>覆盖半径反而更小</b>，需要更密集的基站。'},
  {id:'m25',type:'choice',q:'疫苗发挥作用的原理是？',options:['直接杀死体内病原体','刺激机体产生特异性免疫记忆','补充人体所需营养','提高体温抑制病毒'],ans:1,tag:'科技生活',tip:'疫苗通过引入失活或减毒的抗原，让人体在不发病的情况下产生抗体和记忆细胞，再次遇到病原体时可快速应答。'},
  {id:'m26',type:'choice',q:'下列哪一项不属于我国"新四大发明"？',options:['高铁','移动支付','共享单车','核磁共振'],ans:3,tag:'科技生活',tip:'"新四大发明"指高铁、移动支付、共享单车、网购。这是民间说法，非官方定义。'},
  {id:'m27',type:'choice',q:'深海载人潜水器"奋斗者"号创造的中国载人深潜纪录超过？',options:['3000 米','5000 米','10000 米','20000 米'],ans:2,tag:'科技生活',tip:'2020 年"奋斗者"号在马里亚纳海沟坐底 10909 米，突破万米。此前"蛟龙"号纪录为 7062 米。'},

  // ===== 人文历史地理 =====
  {id:'m28',type:'choice',q:'我国古代"四大发明"不包括？',options:['造纸术','指南针','地动仪','火药'],ans:2,tag:'人文',tip:'四大发明为造纸术、印刷术、指南针、火药。地动仪是张衡的发明，不在此列。'},
  {id:'m29',type:'choice',q:'"二十四节气"中，标志着夏季开始的是？',options:['立夏','小满','芒种','夏至'],ans:0,tag:'人文',tip:'四立（立春、立夏、立秋、立冬）分别是四季之始；二至（夏至、冬至）是昼最长/最短；二分（春分、秋分）昼夜等长。'},
  {id:'m30',type:'choice',q:'下列朝代按时间先后排列正确的是？',options:['秦—汉—三国—晋—南北朝','秦—汉—晋—三国—南北朝','汉—秦—三国—晋—南北朝','秦—三国—汉—晋—南北朝'],ans:0,tag:'人文',tip:'口诀：夏商与西周，东周分两段；春秋和战国，一统秦两汉；三分魏蜀吴，二晋前后延；南北朝并立，隋唐五代传。'},
  {id:'m31',type:'choice',q:'"先天下之忧而忧，后天下之乐而乐"出自？',options:['《岳阳楼记》范仲淹','《醉翁亭记》欧阳修','《滕王阁序》王勃','《出师表》诸葛亮'],ans:0,tag:'人文',tip:'范仲淹《岳阳楼记》。同类高频：欧阳修《醉翁亭记》"醉翁之意不在酒"，王勃《滕王阁序》"落霞与孤鹜齐飞"。'},
  {id:'m32',type:'choice',q:'我国最长的河流是？',options:['黄河','长江','珠江','黑龙江'],ans:1,tag:'地理',tip:'长江全长约 6300 公里，中国第一、世界第三；黄河约 5464 公里，中国第二。含沙量最大的是黄河。'},
  {id:'m33',type:'choice',q:'北京时间采用的时区是？',options:['东八区','东九区','零时区','东七区'],ans:0,tag:'地理',tip:'北京时间即东八区区时，以东经 120° 经线的地方时为准。全国统一使用，尽管新疆等地实际日照偏晚。'},
  {id:'m34',type:'choice',q:'我国面积最大的省级行政区是？',options:['西藏','内蒙古','新疆','青海'],ans:2,tag:'地理',tip:'新疆约 166 万平方公里，居全国首位；西藏约 120 万，内蒙古约 118 万。'},
  {id:'m35',type:'choice',q:'下列世界文化遗产位于山西的是？',options:['平遥古城','丽江古城','宏村','开平碉楼'],ans:0,tag:'人文',tip:'平遥古城（山西）、丽江古城（云南）、宏村西递（安徽）、开平碉楼（广东）。'},
  {id:'m36',type:'choice',q:'"落霞与孤鹜齐飞，秋水共长天一色"描写的是哪座建筑？',options:['黄鹤楼','岳阳楼','滕王阁','鹳雀楼'],ans:2,tag:'人文',tip:'出自王勃《滕王阁序》。江南三大名楼：黄鹤楼（武汉）、岳阳楼（岳阳）、滕王阁（南昌）。'},

  // ===== 政治与经济 =====
  {id:'m37',type:'choice',q:'我国的根本政治制度是？',options:['人民代表大会制度','中国共产党领导的多党合作和政治协商制度','民族区域自治制度','基层群众自治制度'],ans:0,tag:'政治',tip:'人民代表大会制度是<b>根本政治制度</b>；后三项是基本政治制度。三者并列常被混淆。'},
  {id:'m38',type:'choice',q:'我国社会主义初级阶段的基本经济制度是？',options:['公有制为主体、多种所有制经济共同发展','按劳分配为主体','计划经济为主','市场完全自由调节'],ans:0,tag:'政治',tip:'基本经济制度包括三项：公有制为主体多种所有制共同发展、按劳分配为主体多种分配方式并存、社会主义市场经济体制。'},
  {id:'m39',type:'choice',q:'GDP 是指？',options:['国内生产总值','国民生产总值','居民消费价格指数','人均可支配收入'],ans:0,tag:'经济',tip:'GDP 按<b>地域</b>核算（国土内产出），GNP 按<b>国民</b>核算（本国国民产出）。CPI 是消费价格指数，反映通胀。'},
  {id:'m40',type:'choice',q:'衡量居民生活水平高低常用的指标是？',options:['基尼系数','恩格尔系数','CPI','PPI'],ans:1,tag:'经济',tip:'恩格尔系数 = 食品支出 ÷ 总消费支出，数值越低说明生活越富裕。基尼系数衡量收入分配差距，0~1 之间，越大越不平等。'},
  {id:'m41',type:'choice',q:'中央银行提高存款准备金率，通常会导致？',options:['市场货币供应量增加','市场货币供应量减少','商业银行放贷能力增强','利率下降'],ans:1,tag:'经济',tip:'提高准备金率属于<b>紧缩性货币政策</b>，商业银行可贷资金减少，货币供应量下降，通常伴随利率上升、抑制通胀。'},
  {id:'m42',type:'choice',q:'下列属于财政政策工具的是？',options:['调整存款准备金率','公开市场操作','增加政府支出','调整再贴现率'],ans:2,tag:'经济',tip:'财政政策靠"政府收支"：税收、政府支出、国债。货币政策靠"央行工具"：准备金率、利率、公开市场操作、再贴现。'},
  {id:'m43',type:'choice',q:'通货膨胀时期，一般不宜采取的措施是？',options:['提高利率','减少政府支出','增加货币供应','提高存款准备金率'],ans:2,tag:'经济',tip:'通胀时应对症下药是"收"：紧货币、紧财政。增加货币供应会火上浇油。'},
  {id:'m44',type:'choice',q:'人民币对美元汇率由 7.0 变为 6.8，意味着？',options:['人民币贬值','人民币升值','美元升值','汇率不变'],ans:1,tag:'经济',tip:'同样 1 美元兑换的人民币变少，说明人民币更值钱，即<b>人民币升值</b>。升值利于进口、不利于出口。'},
  {id:'m45',type:'choice',q:'"一带一路"倡议中的"一带"指的是？',options:['丝绸之路经济带','21 世纪海上丝绸之路','长江经济带','京津冀协同发展带'],ans:0,tag:'政治',tip:'"一带"=丝绸之路经济带（陆上），"一路"=21 世纪海上丝绸之路。"共商共建共享"是其核心理念。'}
  ,
  {id:'m46',type:'choice',q:'高原地区煮饭容易夹生，主要原因是？',options:['气温低','气压低导致水的沸点降低','水质偏硬','氧气不足'],ans:1,tag:'科技生活',tip:'海拔升高气压降低，水在低于 100℃ 时就沸腾，温度不够使米饭难以熟透。所以高原要用高压锅。'},
  {id:'m47',type:'choice',q:'高压锅能加快煮熟食物，原理是？',options:['增大火力','提高锅内气压，提升水的沸点','减少热量散失','增加食物受热面积'],ans:1,tag:'科技生活',tip:'气压升高，沸点随之升高（可超过 120℃），温度更高所以熟得更快。与高原夹生正好是一对反例。'},
  {id:'m48',type:'choice',q:'手机无线充电主要利用了？',options:['电磁感应','光电效应','热传导','超声波'],ans:0,tag:'科技生活',tip:'充电底座线圈通交变电流产生交变磁场，手机内线圈感应出电流，即电磁感应原理。'},
  {id:'m49',type:'choice',q:'人体最大的器官是？',options:['肝脏','皮肤','肺','大脑'],ans:1,tag:'科技生活',tip:'皮肤是人体面积最大、重量最重的器官，成人约 1.5~2 平方米。肝脏是最大的<b>内脏</b>器官，易混。'},
  {id:'m50',type:'choice',q:'绿色植物进行光合作用的主要场所是？',options:['线粒体','叶绿体','细胞核','液泡'],ans:1,tag:'科技生活',tip:'叶绿体是光合作用场所（把光能转为化学能）；线粒体是呼吸作用场所（"动力车间"）。'},
  {id:'m51',type:'choice',q:'下列做法中，符合食品安全常识的是？',options:['发芽的土豆削掉芽后照常食用','豆角焯水后再炒','用铝锅长时间存放酸性食物','反复油炸的油继续使用'],ans:1,tag:'科技生活',tip:'豆角含皂素和植物血凝素，必须彻底加热破坏。发芽土豆含龙葵素，削芽不能去除，应丢弃。'},
  {id:'m52',type:'choice',q:'锂电池着火时，最不适宜用哪种方式扑救？',options:['干粉灭火器','大量水直接冲','沙土覆盖','隔绝空气'],ans:1,tag:'科技生活',tip:'锂电池热失控会自行产氧，常规窒息法效果有限；大量水冲可能引发短路与飞溅。应使用干粉/沙土并尽快撤离。'},
  {id:'m53',type:'choice',q:'关于核能，下列说法正确的是？',options:['核电站利用核聚变发电','核裂变是目前商业核电站的主要方式','核能属于可再生能源','核废料无放射性'],ans:1,tag:'科技生活',tip:'商业核电站普遍采用铀-235 裂变；核聚变（如"人造太阳"EAST）仍在实验阶段。核燃料不可再生。'},

  {id:'m54',type:'choice',q:'消费者通过网络购物，享有"七日无理由退货"权，但下列哪类商品除外？',options:['服装','图书','消费者定作的商品','家电'],ans:2,tag:'法律',tip:'定作、鲜活易腐、在线下载或拆封的音像制品、交付的报纸期刊等不适用七日无理由退货。'},
  {id:'m55',type:'choice',q:'"定金"与"订金"的法律效果，下列说法正确的是？',options:['两者完全相同','定金具有担保效力，适用定金罚则','订金可以双倍返还','定金可以随意退还'],ans:1,tag:'法律',tip:'定金适用罚则：给付方违约无权要求返还，收受方违约应双倍返还。订金只是预付款，无担保效力。'},
  {id:'m56',type:'choice',q:'正当防卫与防卫过当的关键区别在于？',options:['是否发生在夜间','是否明显超过必要限度造成重大损害','是否报警','对方的身份'],ans:1,tag:'法律',tip:'正当防卫须针对正在进行的不法侵害，且不明显超过必要限度。对行凶、杀人、抢劫、强奸、绑架等严重危及人身安全的暴力犯罪，造成侵害人伤亡的不属于防卫过当。'},
  {id:'m57',type:'choice',q:'我国的国家结构形式是？',options:['联邦制','单一制','邦联制','复合制'],ans:1,tag:'政治',tip:'我国是单一制国家，地方权力由中央授予，特别行政区、民族自治地方均属中央统一领导下的地方行政区域。'},
  {id:'m58',type:'choice',q:'全国人民代表大会每届任期为？',options:['3 年','4 年','5 年','6 年'],ans:2,tag:'政治',tip:'全国人大、国务院、最高人民法院、最高人民检察院每届任期均为 5 年。'},
  {id:'m59',type:'choice',q:'新发展理念包括创新、协调、绿色、开放和？',options:['共享','改革','稳定','效率'],ans:0,tag:'政治',tip:'创新、协调、绿色、开放、共享五大发展理念，是"十四五"乃至更长时期的发展思路。'},
  {id:'m60',type:'choice',q:'下列不属于我国基本政治制度的是？',options:['民族区域自治制度','基层群众自治制度','中国共产党领导的多党合作和政治协商制度','人民代表大会制度'],ans:3,tag:'政治',tip:'人民代表大会制度是<b>根本</b>政治制度，其余三项是<b>基本</b>政治制度。这个区分每年都考。'},

  {id:'m61',type:'choice',q:'"沉没成本"在决策中应当？',options:['作为决策的主要依据','不予考虑','按比例分摊','优先挽回'],ans:1,tag:'经济',tip:'沉没成本是已发生且无法收回的支出，理性决策应只看边际收益与边际成本。为"不浪费"而继续投入，是典型的沉没成本谬误。'},
  {id:'m62',type:'choice',q:'某商品供不应求时，最可能出现的直接结果是？',options:['价格下降','价格上涨','需求减少','成本降低'],ans:1,tag:'经济',tip:'供不应求推高价格；供过于求压低价格。价格再反过来调节供求，这是市场机制的核心。'},
  {id:'m63',type:'choice',q:'"边际效用递减"指的是？',options:['消费越多总效用越低','随着消费量增加，每增加一单位带来的效用递减','效用与价格成反比','总效用恒为负'],ans:1,tag:'经济',tip:'总效用仍在增加，只是<b>增量</b>越来越小。喝第一杯水解渴，第十杯就没感觉了。'},
  {id:'m64',type:'choice',q:'CPI 持续下降、物价普遍下跌并伴随需求不足，通常称为？',options:['通货膨胀','通货紧缩','滞胀','经济过热'],ans:1,tag:'经济',tip:'通缩的危害往往更大：企业利润下降、投资收缩、失业上升，且货币政策容易陷入"流动性陷阱"。'},
  {id:'m65',type:'choice',q:'下列属于直接融资的是？',options:['企业向银行借款','企业发行股票','个人存入银行','购买国债基金'],ans:1,tag:'经济',tip:'直接融资：资金供需双方直接对接（股票、债券）。间接融资：经银行等中介（存款、贷款）。'},

  {id:'m66',type:'choice',q:'我国第一部纪传体通史是？',options:['《资治通鉴》','《史记》','《汉书》','《春秋》'],ans:1,tag:'人文',tip:'《史记》司马迁著，第一部纪传体通史；《资治通鉴》司马光著，第一部编年体通史；《春秋》为编年体史书。'},
  {id:'m67',type:'choice',q:'京剧行当中，"净"指的是？',options:['花脸','旦角','老生','丑角'],ans:0,tag:'人文',tip:'生（男性正面角色）、旦（女性）、净（花脸，性格鲜明）、丑（喜剧角色）。'},
  {id:'m68',type:'choice',q:'"五岳"中的"中岳"是？',options:['泰山','华山','嵩山','恒山'],ans:2,tag:'地理',tip:'东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山。中岳嵩山在河南登封，少林寺所在。'},
  {id:'m69',type:'choice',q:'我国最大的淡水湖是？',options:['洞庭湖','鄱阳湖','太湖','青海湖'],ans:1,tag:'地理',tip:'鄱阳湖（江西）为中国最大淡水湖；青海湖为最大湖泊但属咸水湖。'},
  {id:'m70',type:'choice',q:'世界最高峰珠穆朗玛峰位于哪两国交界？',options:['中国与印度','中国与尼泊尔','中国与不丹','中国与巴基斯坦'],ans:1,tag:'地理',tip:'珠穆朗玛峰位于中国西藏与尼泊尔边界，最新测定高程 8848.86 米（2020 年中尼共同公布）。'},
  {id:'m71',type:'choice',q:'我国季风气候显著，主要原因是？',options:['海陆热力性质差异','纬度跨度大','地形西高东低','洋流影响'],ans:0,tag:'地理',tip:'海陆比热容差异导致冬夏气压中心反转：冬季风从陆地吹向海洋（干冷），夏季风从海洋吹向陆地（暖湿）。'},
  {id:'m72',type:'choice',q:'下列不属于中国传统节日的是？',options:['寒食节','上巳节','感恩节','七夕节'],ans:2,tag:'人文',tip:'感恩节源于北美。寒食、上巳、七夕、重阳、腊八等均为中国传统节日。'},
  {id:'m73',type:'choice',q:'"天干"共有多少个？',options:['10 个','12 个','24 个','60 个'],ans:0,tag:'人文',tip:'十天干：甲乙丙丁戊己庚辛壬癸；十二地支：子丑寅卯辰巳午未申酉戌亥。二者相配成六十甲子。'},
  {id:'m74',type:'choice',q:'科举制度正式创立于哪个朝代？',options:['汉朝','隋朝','唐朝','宋朝'],ans:1,tag:'人文',tip:'隋炀帝设进士科，标志科举制正式创立；唐代完善，宋代糊名誊录，1905 年清末废除。'},
  {id:'m75',type:'choice',q:'"三顾茅庐"中被拜访的是？',options:['关羽','诸葛亮','周瑜','司马懿'],ans:1,tag:'人文',tip:'刘备三顾茅庐请诸葛亮出山，出自《三国志》；《三国演义》对此有艺术加工。'},

  {id:'m76',type:'choice',q:'下列关于垃圾分类的说法，正确的是？',options:['废电池属于可回收物','剩菜剩饭属于厨余垃圾','用过的纸巾属于可回收物','玻璃瓶属于有害垃圾'],ans:1,tag:'科技生活',tip:'废电池、灯管、药品属<b>有害垃圾</b>；纸巾、烟头因被污染不可回收；玻璃、塑料、纸张属可回收物。'},
  {id:'m77',type:'choice',q:'空气中含量最多的气体是？',options:['氧气','氮气','二氧化碳','氩气'],ans:1,tag:'科技生活',tip:'氮气约 78%，氧气约 21%，氩气约 0.93%，二氧化碳约 0.04%。'},
  {id:'m78',type:'choice',q:'体检报告中的"血压 120/80 mmHg"，其中 120 指的是？',options:['舒张压','收缩压','心率','血氧'],ans:1,tag:'科技生活',tip:'高值为收缩压（心脏收缩时动脉压力），低值为舒张压。正常范围约 90~120 / 60~80 mmHg。'},
  {id:'m79',type:'choice',q:'"碳中和"是指？',options:['完全不排放二氧化碳','排放量与吸收量相抵消','停止使用化石能源','只种树不减排'],ans:1,tag:'政治',tip:'碳中和指一定时期内二氧化碳排放与通过植树造林、碳捕集等方式的吸收相抵消，实现净零排放。我国目标为 2060 年前。'},
  {id:'m80',type:'choice',q:'我国载人航天工程的第三步是？',options:['载人飞船阶段','空间实验室阶段','建造空间站','载人登月'],ans:2,tag:'科技生活',tip:'三步走：载人飞船（神舟）→ 空间实验室（天宫一号/二号）→ 空间站（天和核心舱、问天、梦天）。'},
  {id:'m81',type:'choice',q:'"数字经济"的核心生产要素是？',options:['土地','数据','石油','劳动力数量'],ans:1,tag:'经济',tip:'数据已成为与土地、劳动力、资本、技术并列的第五大生产要素，这是数字经济的制度基础。'},
  {id:'m82',type:'choice',q:'下列情形中，构成不当得利的是？',options:['接受他人赠与','银行误将他人存款转入自己账户','按合同取得货款','继承遗产'],ans:1,tag:'法律',tip:'不当得利指没有法律依据取得利益并使他人受损，应返还。赠与、合同、继承均有合法依据。'},
  {id:'m83',type:'choice',q:'我国《个人信息保护法》确立了处理个人信息的基本原则，其中不包括？',options:['合法、正当、必要','诚信原则','公开原则','无限期保存原则'],ans:3,tag:'法律',tip:'处理个人信息应遵循合法、正当、必要和诚信原则，且保存期限应为实现目的所必需的<b>最短时间</b>。'},
  {id:'m84',type:'choice',q:'下列哪项不属于我国刑罚中的主刑？',options:['拘役','管制','罚金','有期徒刑'],ans:2,tag:'法律',tip:'主刑五种：管制、拘役、有期徒刑、无期徒刑、死刑。附加刑：罚金、剥夺政治权利、没收财产、驱逐出境。'},
  {id:'m85',type:'choice',q:'"刻舟求剑"的哲学寓意是？',options:['事物是静止不变的','否认了运动的绝对性，用静止观点看问题','强调实践的重要性','说明意识具有能动性'],ans:1,tag:'人文',tip:'寓言讽刺的是只承认静止、否认运动的形而上学观点。唯物辩证法认为运动是绝对的，静止是相对的。'},
  {id:'m86',type:'choice',q:'我国《民法典》规定的离婚冷静期是多久？',options:['15 天','30 天','60 天','90 天'],ans:1,tag:'法律',tip:'自婚姻登记机关收到离婚登记申请之日起 30 日内，任何一方不愿离婚的，可以撤回申请。仅适用于协议离婚，诉讼离婚没有冷静期。'},
  {id:'m87',type:'choice',q:'下列不属于行政处罚的是？',options:['罚款','行政拘留','吊销许可证','有期徒刑'],ans:3,tag:'法律',tip:'行政处罚包括警告、罚款、没收、暂扣或吊销证照、行政拘留等。有期徒刑是刑罚，由法院判决。'},
  {id:'m88',type:'choice',q:'我国未成年人保护法中的“未成年人”指？',options:['未满 16 周岁','未满 18 周岁','未满 20 周岁','未满 14 周岁'],ans:1,tag:'法律',tip:'未满 18 周岁的公民为未成年人。与民事行为能力年龄（8 岁、18 岁）分开记。'},
  {id:'m89',type:'choice',q:'下列哪种遗嘱形式不需要见证人？',options:['代书遗嘱','录音遗嘱','自书遗嘱','口头遗嘱'],ans:2,tag:'法律',tip:'自书遗嘱由遗嘱人亲笔书写、签名、注明年月日即可。代书、打印、录音录像、口头遗嘱都需要两个以上见证人。'},
  {id:'m90',type:'choice',q:'国家赔偿的责任主体是？',options:['具体办事的公务员个人','国家','该公务员所在单位','财政部门'],ans:1,tag:'法律',tip:'国家赔偿由国家承担，赔偿义务机关先行赔付，之后可向有故意或重大过失的工作人员追偿。'},

  {id:'m91',type:'choice',q:'可燃冰的主要成分是？',options:['甲烷水合物','乙醇','氢气','石油'],ans:0,tag:'科技生活',tip:'可燃冰是天然气水合物，主要成分是甲烷，外观像冰，遇火可燃。我国在南海神狐海域试采成功。'},
  {id:'m92',type:'choice',q:'量子计算相比经典计算的核心优势在于？',options:['主频更高','利用叠加与纠缠实现并行','存储容量更大','耗电更少'],ans:1,tag:'科技生活',tip:'量子比特可处于叠加态，n 个量子比特能同时表示 2ⁿ 种状态，在特定问题上实现指数级加速。'},
  {id:'m93',type:'choice',q:'人体血液中数量最多的细胞是？',options:['白细胞','血小板','红细胞','淋巴细胞'],ans:2,tag:'科技生活',tip:'红细胞约占血细胞总数的 99%，负责运输氧气；白细胞负责免疫；血小板负责凝血。'},
  {id:'m94',type:'choice',q:'发现有人触电，第一步应该？',options:['直接用手拉开','立即切断电源或用绝缘物挑开电线','先做人工呼吸','泼水降温'],ans:1,tag:'科技生活',tip:'必须先断电，否则施救者也会触电。断电后再判断意识和呼吸，必要时心肺复苏。'},
  {id:'m95',type:'choice',q:'下列属于可再生能源的是？',options:['煤炭','天然气','风能','核裂变燃料'],ans:2,tag:'科技生活',tip:'风能、太阳能、水能、生物质能可再生；煤、石油、天然气、铀矿不可再生。'},
  {id:'m96',type:'choice',q:'我国空间站的基本构型是？',options:['单舱段','T 字构型（三舱）','环形','球形'],ans:1,tag:'科技生活',tip:'由天和核心舱、问天实验舱、梦天实验舱组成 T 字基本构型，可支持长期驻留 3 人。'},

  {id:'m97',type:'choice',q:'“四大名著”中成书最早的是？',options:['《三国演义》','《水浒传》','《西游记》','《红楼梦》'],ans:0,tag:'人文',tip:'《三国演义》（元末明初，罗贯中）最早；《水浒传》同期稍晚；《西游记》明代中期；《红楼梦》清代。'},
  {id:'m98',type:'choice',q:'京剧“四大名旦”不包括？',options:['梅兰芳','程砚秋','尚小云','周信芳'],ans:3,tag:'人文',tip:'四大名旦：梅兰芳、程砚秋、尚小云、荀慧生。周信芳是“麒派”老生，不属于旦角。'},
  {id:'m99',type:'choice',q:'我国第一部农业百科全书是？',options:['《齐民要术》','《天工开物》','《本草纲目》','《农政全书》'],ans:0,tag:'人文',tip:'《齐民要术》北魏贾思勰著，我国现存最早最完整的农书；《天工开物》是工艺百科；《本草纲目》是药学著作。'},
  {id:'m100',type:'choice',q:'“但愿人长久，千里共婵娟”出自？',options:['苏轼《水调歌头》','李白《静夜思》','杜甫《月夜》','王维《九月九日忆山东兄弟》'],ans:0,tag:'人文',tip:'苏轼《水调歌头·明月几时有》，中秋怀人之作。“婵娟”指月亮。'},
  {id:'m101',type:'choice',q:'我国现存最早的一部完整法典是？',options:['《唐律疏议》','《大明律》','《大清律例》','《法经》'],ans:0,tag:'人文',tip:'《唐律疏议》是现存最早最完整的封建法典，也是中华法系的代表。《法经》更早但已失传。'},
  {id:'m102',type:'choice',q:'“二十四史”中的第一部是？',options:['《史记》','《汉书》','《后汉书》','《三国志》'],ans:0,tag:'人文',tip:'《史记》为二十四史之首，司马迁著，纪传体通史。'},

  {id:'m103',type:'choice',q:'我国地势呈三级阶梯，第一级阶梯的主体是？',options:['东北平原','青藏高原','黄土高原','长江中下游平原'],ans:1,tag:'地理',tip:'第一级：青藏高原（平均 4000 米以上）；第二级：内蒙古高原、黄土高原、云贵高原等；第三级：东部平原和丘陵。'},
  {id:'m104',type:'choice',q:'长江三峡自西向东依次是？',options:['瞿塘峡、巫峡、西陵峡','西陵峡、巫峡、瞿塘峡','巫峡、瞿塘峡、西陵峡','瞿塘峡、西陵峡、巫峡'],ans:0,tag:'地理',tip:'瞿塘峡—巫峡—西陵峡，西起重庆奉节，东至湖北宜昌。三峡工程在西陵峡段。'},
  {id:'m105',type:'choice',q:'我国面积最大的盆地是？',options:['四川盆地','塔里木盆地','准噶尔盆地','柴达木盆地'],ans:1,tag:'地理',tip:'塔里木盆地约 53 万平方公里，中国最大；柴达木盆地海拔最高，被称为“聚宝盆”。'},
  {id:'m106',type:'choice',q:'世界上流经国家最多的河流是？',options:['尼罗河','亚马逊河','多瑙河','长江'],ans:2,tag:'地理',tip:'多瑙河流经 10 个国家，是世界流经国家最多的河流。'},

  {id:'m107',type:'choice',q:'某商品价格上升后需求量明显下降，说明该商品？',options:['需求富有弹性','需求缺乏弹性','是必需品','是低档品'],ans:0,tag:'经济',tip:'需求价格弹性 = 需求量变动百分比 ÷ 价格变动百分比。弹性大于 1 为富有弹性（如奢侈品），小于 1 为缺乏弹性（如食盐）。'},
  {id:'m108',type:'choice',q:'财政赤字是指？',options:['财政收入大于支出','财政支出大于收入','国债余额','外汇储备减少'],ans:1,tag:'经济',tip:'支出大于收入即赤字，可通过发债弥补。赤字率 = 赤字 ÷ GDP，是衡量财政风险的重要指标。'},
  {id:'m109',type:'choice',q:'我国外汇储备的主要构成是？',options:['黄金','美元资产','特别提款权','欧元现金'],ans:1,tag:'经济',tip:'我国外汇储备以美元资产（主要是美国国债等）为主，规模长期居世界第一。'},
  {id:'m110',type:'choice',q:'按照三次产业划分，金融业属于？',options:['第一产业','第二产业','第三产业','不属于任何产业'],ans:2,tag:'经济',tip:'第一产业：农林牧渔；第二产业：采矿业、制造业、建筑业；第三产业：服务业，含金融、物流、教育、餐饮等。'},
  {id:'m111',type:'choice',q:'马克思主义哲学认为，世界的本原是？',options:['意识','物质','精神','理念'],ans:1,tag:'政治理论',tip:'物质第一性、意识第二性，物质决定意识，意识对物质有能动的反作用。这是唯物论的根本观点。'},
  {id:'m112',type:'choice',q:'“矛盾”在唯物辩证法中指的是？',options:['逻辑上的自相矛盾','事物内部对立又统一的关系','人与人之间的冲突','错误的想法'],ans:1,tag:'政治理论',tip:'辩证法中的矛盾是哲学范畴，指事物内部诸要素之间既对立又统一的关系，是事物发展的根本动力。'},
  {id:'m113',type:'choice',q:'“量变引起质变”说明？',options:['只要有量变就一定有质变','量变积累到一定程度必然引起质变','质变与量变无关','质变后不再有量变'],ans:1,tag:'政治理论',tip:'量变是质变的必要准备，质变是量变的必然结果，但需要积累到“度”。不是任何量变都立刻引起质变。'},
  {id:'m114',type:'choice',q:'实践在认识论中的地位是？',options:['认识的来源和检验真理的唯一标准','认识的障碍','与认识无关','只是认识的結果'],ans:0,tag:'政治理论',tip:'实践是认识的来源、动力、目的，也是检验认识真理性的唯一标准。'},
  {id:'m115',type:'choice',q:'我国社会的主要矛盾是？',options:['人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾','无产阶级和资产阶级的矛盾','先进的社会制度和落后的生产力之间的矛盾','城乡之间的矛盾'],ans:0,tag:'政治理论',tip:'这是新时代我国社会主要矛盾的表述。“不平衡不充分的发展”是矛盾的主要方面。'},
  {id:'m116',type:'choice',q:'“五位一体”总体布局包括经济建设、政治建设、文化建设、社会建设和？',options:['生态文明建设','国防建设','党的建设','法治建设'],ans:0,tag:'政治理论',tip:'五位一体：经济、政治、文化、社会、生态文明建设。党的建设属于“四个全面”战略布局的内容。'},
  {id:'m117',type:'choice',q:'“四个全面”战略布局不包括？',options:['全面建设社会主义现代化国家','全面深化改革','全面依法治国','全面对外开放'],ans:3,tag:'政治理论',tip:'四个全面：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。'},
  {id:'m118',type:'choice',q:'党的思想路线的核心是？',options:['实事求是','群众路线','独立自主','艰苦奋斗'],ans:0,tag:'政治理论',tip:'实事求是是马克思主义中国化理论成果的精髓，也是党的思想路线的核心。群众路线是根本工作路线。'},
  {id:'m119',type:'choice',q:'“新发展格局”指的是？',options:['以国内大循环为主体、国内国际双循环相互促进','完全依赖出口','只发展内需','以进口为主'],ans:0,tag:'政治理论',tip:'新发展格局不是封闭的国内循环，而是开放的国内国际双循环。'},
  {id:'m120',type:'choice',q:'我国的根本宗旨是？',options:['全心全意为人民服务','发展生产力','维护社会稳定','实现共同富裕'],ans:0,tag:'政治理论',tip:'全心全意为人民服务是党的根本宗旨，也是区别于其他政党的显著标志。共同富裕是社会主义的本质要求。'},
  {id:'m121',type:'choice',q:'“人类命运共同体”理念的核心是？',options:['各国相互依存、共同发展','一国主导世界','各自为政','零和博弈'],ans:0,tag:'政治理论',tip:'人类命运共同体倡导相互尊重、公平正义、合作共赢，反对零和博弈和霸权主义。'},
  {id:'m122',type:'choice',q:'“全过程人民民主”强调的是？',options:['只有选举时才有民主','民主贯穿选举、协商、决策、管理、监督全过程','西方式多党竞争','只体现在人大会议'],ans:1,tag:'政治理论',tip:'全过程人民民主强调民主不仅体现在投票环节，而是覆盖民主选举、民主协商、民主决策、民主管理、民主监督各环节。'},
  {id:'m123',type:'choice',q:'辩证法中“两点论”与“重点论”的关系是？',options:['两者对立','两点论是有重点的两点论，重点论是两点中的重点','只讲重点','只讲全面'],ans:1,tag:'政治理论',tip:'看问题既要全面（两点论），又要抓住主要矛盾（重点论），二者是统一的。'},
  {id:'m124',type:'choice',q:'“共同富裕”在社会主义本质中的地位是？',options:['可有可无的目标','社会主义的本质要求','只是经济指标','与社会主义无关'],ans:1,tag:'政治理论',tip:'共同富裕是社会主义的本质要求，也是中国式现代化的重要特征。它不是同步富裕、平均主义。'},
  {id:'m125',type:'choice',q:'“以人民为中心”的发展思想，根本落脚点是？',options:['GDP 增长','增进民生福祉','扩大出口','提高税率'],ans:1,tag:'政治理论',tip:'以人民为中心的发展思想，强调发展为了人民、发展依靠人民、发展成果由人民共享，落脚点是增进民生福祉。'},
  {id:'m126',type:'choice',q:'我国刑法规定，完全负刑事责任的年龄是？',options:['14 周岁','16 周岁','18 周岁','20 周岁'],ans:1,tag:'法律',tip:'已满 16 周岁的人犯罪应当负刑事责任。14~16 周岁只对八类严重犯罪负责。'},
  {id:'m127',type:'choice',q:'行政诉讼中，举证责任主要由谁承担？',options:['原告','被告行政机关','法院','第三人'],ans:1,tag:'法律',tip:'行政诉讼中被告（行政机关）对作出的行政行为负举证责任，这是与民事诉讼“谁主张谁举证”最大的不同。'},
  {id:'m128',type:'choice',q:'下列属于要约的是？',options:['招标公告','拍卖公告','寄送的价目表','载明标的和价格并表明接受即成交的商品页面'],ans:3,tag:'法律',tip:'招标公告、拍卖公告、价目表一般属要约邀请；内容具体确定并表示受约束的，才是要约。'},
  {id:'m129',type:'choice',q:'我国民法典规定，限制民事行为能力人是？',options:['不满 8 周岁','8 周岁以上不满 18 周岁','14 周岁以上','16 周岁以上'],ans:1,tag:'法律',tip:'8 周岁以上不满 18 周岁为限制民事行为能力人，可独立实施纯获利益或与其年龄智力相适应的行为。'},
  {id:'m130',type:'choice',q:'劳动争议中，申请仲裁的时效期间一般是？',options:['6 个月','1 年','2 年','3 年'],ans:1,tag:'法律',tip:'劳动争议申请仲裁的时效为 1 年，从当事人知道或应当知道权利被侵害之日起算。'},
  {id:'m131',type:'choice',q:'下列不属于知识产权的是？',options:['专利权','商标权','著作权','所有权'],ans:3,tag:'法律',tip:'知识产权包括专利、商标、著作权（版权）、商业秘密等。所有权属于物权。'},

  {id:'m132',type:'choice',q:'LED 灯比白炽灯省电，主要因为？',options:['发光效率高，电能更多转化为光而非热','功率更小','电压更低','寿命更长'],ans:0,tag:'科技生活',tip:'白炽灯约 90% 电能变成热，LED 电光转换效率高得多。省电的本质是减少热损耗。'},

  {id:'m134',type:'choice',q:'关于疫苗，下列说法正确的是？',options:['接种后立刻产生免疫力','需要一定时间才能产生保护','所有人都必须接种','接种后终身免疫'],ans:1,tag:'科技生活',tip:'疫苗需要时间让免疫系统产生抗体和记忆细胞，通常数周。是否有终身免疫取决于疫苗种类。'},
  {id:'m135',type:'choice',q:'海水不能直接饮用，主要因为？',options:['含盐量过高，会加重脱水','温度太低','有细菌','含氧量低'],ans:0,tag:'科技生活',tip:'海水盐度约 3.5%，饮用后身体需消耗更多水分排盐，反而加重脱水。'},
  {id:'m136',type:'choice',q:'高压输电采用高压的原因主要是？',options:['减少线路上的电能损耗','提高安全性','降低成本','便于施工'],ans:0,tag:'科技生活',tip:'功率一定时，电压越高电流越小，线路损耗（I²R）随之大幅下降。'},
  {id:'m137',type:'choice',q:'下列关于人工智能的说法，正确的是？',options:['大模型能完全替代人类判断','AI 生成内容可能存在事实错误，需核实','AI 没有训练数据也能工作','AI 不会产生偏见'],ans:1,tag:'科技生活',tip:'大模型基于概率生成内容，可能出现“幻觉”，关键信息必须核实。'},

  {id:'m138',type:'choice',q:'“洛阳纸贵”与下列哪位人物有关？',options:['左思','曹植','司马相如','王羲之'],ans:0,tag:'人文',tip:'左思写《三都赋》，时人争相传抄，洛阳为之纸贵。形容作品风行一时。'},
  {id:'m139',type:'choice',q:'“二十四史”的体例是？',options:['编年体','纪传体','国别体','纪事本末体'],ans:1,tag:'人文',tip:'二十四史均为纪传体。《资治通鉴》是编年体，《国语》《战国策》是国别体。'},
  {id:'m140',type:'choice',q:'“唐宋八大家”中属于唐代的是？',options:['韩愈、柳宗元','欧阳修、苏轼','王安石、曾巩','苏洵、苏辙'],ans:0,tag:'人文',tip:'唐二家：韩愈、柳宗元；宋六家：欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。'},
  {id:'m141',type:'choice',q:'我国古代四大发明中，用于航海的是？',options:['造纸术','印刷术','指南针','火药'],ans:2,tag:'人文',tip:'指南针用于航海定向，火药用于军事，造纸术和印刷术用于文化传播。'},
  {id:'m142',type:'choice',q:'“四书”指的是？',options:['《诗》《书》《礼》《易》','《大学》《中庸》《论语》《孟子》','《史记》《汉书》《后汉书》《三国志》','《春秋》《左传》《公羊传》《谷梁传》'],ans:1,tag:'人文',tip:'四书：大学、中庸、论语、孟子。五经：诗、书、礼、易、春秋。'},
  {id:'m143',type:'choice',q:'我国现存最早的一部诗歌总集是？',options:['《楚辞》','《诗经》','《乐府诗集》','《唐诗三百首》'],ans:1,tag:'人文',tip:'《诗经》收录西周至春秋诗歌 305 篇，分风、雅、颂三部分。'},

  {id:'m144',type:'choice',q:'我国最长的内陆河是？',options:['塔里木河','黄河','黑龙江','雅鲁藏布江'],ans:0,tag:'地理',tip:'塔里木河全长约 2179 公里，是我国最长的内陆河，位于新疆。'},
  {id:'m145',type:'choice',q:'我国最大的岛屿是？',options:['海南岛','台湾岛','崇明岛','舟山岛'],ans:1,tag:'地理',tip:'台湾岛约 3.6 万平方公里，我国第一大岛；海南岛第二，崇明岛第三。'},
  {id:'m146',type:'choice',q:'我国跨经度最广的省级行政区是？',options:['新疆','内蒙古','西藏','黑龙江'],ans:1,tag:'地理',tip:'内蒙古东西跨度极大，跨经度最广；新疆面积最大。'},
  {id:'m147',type:'choice',q:'长江流经的省级行政区共有多少个？',options:['9 个','11 个','13 个','15 个'],ans:1,tag:'地理',tip:'长江流经 11 个省级行政区，自西向东注入东海。'},
  {id:'m148',type:'choice',q:'“梅雨”天气主要出现在我国？',options:['华北地区','江淮流域','东北地区','西北地区'],ans:1,tag:'地理',tip:'梅雨是 6—7 月江淮流域的连续阴雨天气，由准静止锋造成。'},
  {id:'m149',type:'choice',q:'世界上面积最大的沙漠是？',options:['塔克拉玛干','撒哈拉','戈比','阿拉伯沙漠'],ans:1,tag:'地理',tip:'撒哈拉沙漠约 900 万平方公里，世界最大。塔克拉玛干是我国最大沙漠。'},

  {id:'m150',type:'choice',q:'“边际效用递减”意味着？',options:['消费越多总效用越低','每增加一单位带来的满足感递减','价格越高需求越大','收入越高消费越少'],ans:1,tag:'经济',tip:'总效用仍在增加，只是增量越来越小。这是需求曲线向下倾斜的原因之一。'},
  {id:'m151',type:'choice',q:'通货膨胀时，一般不宜采取的措施是？',options:['提高利率','减少政府支出','增加货币供应','提高存款准备金率'],ans:2,tag:'经济',tip:'通胀应对应“收紧”：紧货币、紧财政。增加货币供应会加剧通胀。'},
  {id:'m152',type:'choice',q:'GDP 与 GNP 的区别在于？',options:['一个按国土算，一个按国民算','一个按年算，一个按月算','一个含价格因素，一个不含','没有区别'],ans:0,tag:'经济',tip:'GDP 按地域核算（国土内产出），GNP 按国民核算（本国国民产出），差额是要素净收入。'},
  {id:'m153',type:'choice',q:'“看不见的手”最早由谁提出？',options:['凯恩斯','亚当·斯密','马克思','马歇尔'],ans:1,tag:'经济',tip:'亚当·斯密在《国富论》中提出，指市场机制自发调节资源配置。'},
  {id:'m154',type:'choice',q:'下列属于紧缩性财政政策的是？',options:['增加政府投资','减少税收','减少政府支出','降低存款准备金率'],ans:2,tag:'经济',tip:'紧缩性财政 = 减支出、增税收。降低准备金率属于货币政策。'},

/* =======================================================================

   ======================================================================= */
const FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031,
                1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const F_DECAY = -0.5, F_FACTOR = 19 / 81, F_TARGET = 0.9;
const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
const fInitS = g => Math.max(FSRS_W[g - 1], 0.1);
const fInitD = g => clampN(FSRS_W[4] - (g - 3) * FSRS_W[5], 1, 10);
function fNextD(d, g) {
  let nd = d - FSRS_W[6] * (g - 3);
  nd = FSRS_W[7] * fInitD(4) + (1 - FSRS_W[7]) * nd;
  return clampN(nd, 1, 10);
}
const fRetr = (days, s) => Math.pow(1 + F_FACTOR * Math.max(0, days) / s, F_DECAY);
function fRecallS(d, s, r, g) {
  const hard = g === 2 ? FSRS_W[15] : 1;
  const easy = g === 4 ? FSRS_W[16] : 1;
  return s * (1 + Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) *
    (Math.exp((1 - r) * FSRS_W[10]) - 1) * hard * easy);
}
const fForgetS = (d, s, r) => FSRS_W[11] * Math.pow(d, -FSRS_W[12]) *
  (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp((1 - r) * FSRS_W[14]);
const fInterval = s => s / F_FACTOR * (Math.pow(F_TARGET, 1 / F_DECAY) - 1);

function loadDB() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(CARD_KEY)); } catch (e) {}

    if (raw.v >= 3 && Array.isArray(raw.cards)) {
      const d = Object.assign(defDB(), raw);

/* 四档评分：4 秒答 3 模糊 2 不会 1 完全不会 */
function rateCard(id, g, extra) {
  const now = Date.now();
  const st = CB.sched[id] || { S: 0, D: 0, state: 'new', reps: 0, lapses: 0, last: 0 };
  let S = st.S, D = st.D, ivl, state = st.state;
  if (state === 'new' || !st.S) {
    S = fInitS(g); D = fInitD(g);
    // 首轮：完全不会 10 分钟后再来；其余按初始稳定性给间隔，但封顶 10 天
    ivl = g === 1 ? 0.0069 : Math.max(1, Math.min(fInterval(S), 10));
    state = 'review';
  } else {
    const elapsed = Math.max(0, (now - st.last) / 86400000);
    const R = fRetr(elapsed, S);
    if (g === 1) {
      S = Math.min(fForgetS(D, S, R), S);
      D = fNextD(D, g);
      ivl = 0.0069;
      state = 'relearn';
    } else {
      S = Math.min(fRecallS(D, S, R, g), 3650);
      D = fNextD(D, g);
      // 单个间隔不超过上次的 3.5 倍，且最长 90 天，避免曲线过陡
      const cap = Math.max(1, (st.ivl || 1) * 3.5);
      ivl = Math.max(1, Math.min(fInterval(S), cap, 90));
      state = 'review';
    }
  }
  ivl = Math.min(ivl, 365);
  CB.sched[id] = {
    S, D, state, ivl,
    reps: (st.reps || 0) + 1,
    lapses: (st.lapses || 0) + (g === 1 ? 1 : 0),
    last: now, due: now + ivl * 86400000, g
  };
  // 统计与学习记录
  const td = dateKey();
  DB.stats.total++;
  if (g >= 3) DB.stats.right++;
  DB.stats.days[td] = (DB.stats.days[td] || 0) + 1;
  const card = allCards().find(c => c.id === id);
  DB.logs = DB.logs || [];
  DB.logs.push({
    t: now, id, deck: (card && card.deck) || '',
    g, ms: (extra && extra.ms) || 0,
    tag: (extra && extra.tag) || ''
  });
  if (DB.logs.length > 6000) DB.logs = DB.logs.slice(-5000);
  saveCB();
  return ivl;
}

/* 简易 LaTeX 渲染 */
const TEX_SYM = {
  '\\times': '×', '\\div': '÷', '\\approx': '≈', '\\le': '≤', '\\leq': '≤', '\\ge': '≥', '\\geq': '≥',
  '\\ne': '≠', '\\neq': '≠', '\\pm': '±', '\\rightarrow': '→', '\\to': '→', '\\Rightarrow': '⇒',
  '\\because': '∵', '\\therefore': '∴', '\\infty': '∞', '\\cdot': '·', '\\%': '%', '\\pi': 'π',
  '\\alpha': 'α', '\\beta': 'β', '\\gamma': 'γ', '\\Delta': 'Δ', '\\delta': 'δ', '\\theta': 'θ',
  '\\sqrt': '√', '\\angle': '∠', '\\perp': '⊥', '\\parallel': '∥'
};
function escHTML(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function tex(str) {
  let s = escHTML(str);
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, '$1').replace(/\$([^$\n]+?)\$/g, '$1');
  s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><b>$1</b><i>$2</i></span>');
  s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√<span style="border-top:1px solid currentColor;padding:0 2px">$1</span>');
  s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^(-?\w)/g, '<sup>$1</sup>');
  s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/_(\w)/g, '<sub>$1</sub>');
  Object.keys(TEX_SYM).forEach(k => { s = s.split(k).join(TEX_SYM[k]); });
  s = s.replace(/\\[a-zA-Z]+/g, '');
  s = s.replace(/&lt;(\/?)(b|i|em|br|strong)&gt;/g, '<$1$2>');
  return s;
}

function genCalc() {
  const r = Math.random();

  // 1. 分数 → 百分数
  if (r < 0.22) {
    const [n, d, pc] = pick(FRACS);
    return { id: 'g-fp-' + n + '-' + d, type: 'num', q: `${n}/${d} ≈ ？%`, ans: pc, tol: 0.16, unit: '%',
      tip: `百化分：${n}/${d} ≈ ${pc}%。分母 7、9、11、13 的分数要单独记牢。`, tag: '分数化百分数' };
  }
  // 2. 百分数 → 分数
  if (r < 0.36) {
    const [n, d, pc] = pick(FRACS.filter(x => x[2] >= 5));
    return { id: 'g-pf-' + n + '-' + d, type: 'num', q: `${pc}% 最接近 1/？`, headline: `${pc}% 最接近 1/?`,
      ans: d, tol: 0, unit: '', tip: `百化分反向：${pc}% ≈ ${n}/${d}。看到百分数先想能不能变成 1/n。`, tag: '百分数化分数' };
  }
  // 3. 求增长率
  if (r < 0.47) {
    const base = pick([120, 150, 180, 200, 240, 250, 300, 320, 400, 480, 500, 600, 750, 800]);
    const rate = pick([5, 8, 10, 12, 15, 20, 25]);
    const inc = +(base * rate / 100).toFixed(1);
    const now = +(base + inc).toFixed(1);
    return { id: 'g-rate-' + base + '-' + rate, type: 'num',
      q: `现期 ${now}，基期 ${base}，增长率约为 ？%`, ans: rate, tol: 0.3, unit: '%',
      tip: `增长率 =（现期 − 基期）÷ 基期 = ${inc} ÷ ${base} ≈ ${rate}%。分母永远是基期。`, tag: '增长率计算' };
  }
  // 4. 求基期
  if (r < 0.57) {
    const rate = pick([5, 8, 10, 12, 15, 20, 25]);
    const base = pick([200, 240, 300, 400, 500, 600, 800]);
    const now = +(base * (1 + rate / 100)).toFixed(1);
    return { id: 'g-base-' + base + '-' + rate, type: 'num',
      q: `现期 ${now}，同比增长 ${rate}%，基期为 ？`, ans: base, tol: 0.5, unit: '',
      tip: `基期 = 现期 ÷ (1+r) = ${now} ÷ ${(1 + rate / 100).toFixed(2)} = ${base}。`, tag: '基期量' };
  }
  // 5. 隔年增长率
  if (r < 0.64) {
    const a = pick([5, 8, 10, 12, 15]);
    const b = pick([4, 6, 8, 10, 14]);
    return { id: 'g-gap-' + a + '-' + b, type: 'num',
      q: `连续两年分别增长 ${a}% 和 ${b}%，隔年增长率约为 ？%`,
      ans: +(a + b + a * b / 100).toFixed(2), tol: 0.3, unit: '%',
      tip: `隔年增长率 = r₁+r₂+r₁r₂ ≈ ${(a + b + a * b / 100).toFixed(2)}%。第三项不能漏。`, tag: '隔年增长率' };
  }
  // 6. 求增长量
  if (r < 0.72) {
    const base = pick([200, 240, 300, 400, 500, 600, 800, 1000]);
    const rate = pick([5, 10, 12.5, 20, 25]);
    const inc = +(base * rate / 100).toFixed(1);
    const now = +(base + inc).toFixed(1);
    return { id: 'g-inc-' + base + '-' + rate, type: 'num',
      q: `现期 ${now}，同比增长 ${rate}%，增长量为 ？`, ans: inc, tol: 0.5, unit: '',
      tip: `增长量 = 现期 × r/(1+r) = ${now} × ${(rate / 100).toFixed(3)} ÷ ${(1 + rate / 100).toFixed(2)} ≈ ${inc}。也可先求基期再相减。`, tag: '增长量' };
  }
  // 7. 求部分量（比重）
  if (r < 0.79) {
    const total = pick([200, 400, 500, 800, 1000, 1200]);
    const pc = pick([15, 20, 25, 30, 35, 40, 45, 60]);
    const part = +(total * pc / 100).toFixed(1);
    return { id: 'g-bz-' + total + '-' + pc, type: 'num',
      q: `整体 ${total}，其中某一部分占 ${pc}%，该部分为 ？`, ans: part, tol: 0.5, unit: '',
      tip: `部分 = 整体 × 比重 = ${total} × ${pc}% = ${part}。比重题本质是乘法。`, tag: '比重' };
  }
  // 8. 判断比重升降
  if (r < 0.86) {
    const a = pick([3, 5, 8, 12, 15, 20]);
    const b = pick([4, 6, 10, 14, 18]);
    const up = a > b;
    return { id: 'g-bzchg-' + a + '-' + b, type: 'choice',
      q: `某部分增长 ${a}%，整体增长 ${b}%，该部分占整体的比重会？`,
      options: ['上升', '下降', '不变', '无法判断'], ans: up ? 0 : 1,
      tip: `部分增速 ${a}% ${up ? '大于' : '小于'} 整体增速 ${b}%，所以比重${up ? '上升' : '下降'}。只看两个增速，不用算。`, tag: '比重变化' };
  }
  // 9. 倍数换算
  if (r < 0.93) {
    const n = pick([1.2, 1.5, 2, 2.5, 3]);
    const correct = ((n - 1) * 100).toFixed(0) + '%';
    return { id: 'g-mul-' + n, type: 'choice',
      q: `A 是 B 的 ${n} 倍，则 A 比 B 多？`,
      options: [(n * 100).toFixed(0) + '%', correct, (n - 1).toFixed(1) + '%', (100 / n).toFixed(0) + '%'],
      ans: 1,
      tip: `“多几倍” = 倍数 − 1 = ${(n - 1).toFixed(1)}，即 ${correct}。“是几倍”和“多几倍”差 1，这是最常见的文字陷阱。`, tag: '倍数换算' };
  }
  // 10. 百分点
  const p1 = pick([35, 40, 45, 50, 60]);
  const dd = pick([2, 3, 5, 8]);
  return { id: 'g-pp-' + p1 + '-' + dd, type: 'choice',
    q: `某比重从 ${p1}% 上升到 ${p1 + dd}%，上升了几个百分点？`,
    options: [(dd / p1 * 100).toFixed(1) + ' 个百分点', dd + ' 个百分点', (p1 + dd) + ' 个百分点', (dd / (p1 + dd) * 100).toFixed(1) + ' 个百分点'],
    ans: 1,
    tip: `百分点就是两个百分数直接相减：${p1 + dd}% − ${p1}% = ${dd} 个百分点。不要去除以基数，那是求增长率。`, tag: '百分点' };
}

function buildPool(mode) {

      ...shuffle(sqBank).slice(0, 8),

      ...shuffle(judgeBank).slice(0, 6),
      ...shuffle(idiomBank).slice(0, 5),
      ...shuffle(politicalBank).slice(0, 6)
    ].map(c => ({ ...c, src: 'mix' }));
  }
  const all = [];
  if (mode === 'calc') {
    calcBank.forEach(c => all.push({ ...c, src: 'calc' }));
    for (let i = 0; i < 30; i++) all.push({ ...genCalc(), src: 'calc' });
  }
  if (mode === 'formula') formulaBank.forEach(c => all.push({ ...c, src: 'formula' }));
  if (mode === 'pct') pctBank.forEach(c => all.push({ ...c, src: 'pct' }));
  if (mode === 'judge') judgeBank.forEach(c => all.push({ ...c, src: 'judge' }));
  if (mode === 'idiom') idiomBank.forEach(c => all.push({ ...c, src: 'idiom' }));
  if (mode === 'political') politicalBank.forEach(c => all.push({ ...c, src: 'political' }));
  if (mode === 'sq') sqBank.forEach(c => all.push({ ...c, src: 'sq' }));
  if (mode === 'common') commonBank.forEach(c => all.push({ ...c, src: 'common' }));
  return all;
}

/* ---------------- 首页 ---------------- */
function dueCount() {
  const now = Date.now();
  return Object.values(store.cards).filter(c => c.next <= now && (c.r + c.w) > 0).length;
}
function wrongCount() {
  return Object.keys(store.cards).filter(k => store.cards[k].w > 0 && store.cards[k].box < 2).length;
}
function todayDone() {
  return store.stats.days[todayKey()] || 0;
}

function moduleDone(key) {
  const md = (DB.stats.moduleDays || {})[dateKey()] || {};
  return md[key] || 0;
}
function quotaOf(key) { return (DB.settings.quotas || {})[key] || 0; }
function cntHTML(key, fallback) {
  const q = quotaOf(key);
  const d = moduleDone(key);
  if (!q) return `<div class="cnt"><b>${fallback}</b>题</div>`;
  const ok = d >= q;
  return `<div class="cnt"><b style="${ok ? 'color:var(--green)' : ''}">${d}/${q}</b>${ok ? '完成' : '今日'}</div>`;
}

/* ---------------- 答题页 ---------------- */
function viewQuiz() {
  const c = S.cur;
  if (!c) return '';
  const pct = Math.round(S.i / S.queue.length * 100);
  const isNum = c.type === 'num';
  const qText = c.headline || c.q;
  const cls = (c.q && c.q.length > 24) || (c.headline && c.headline.length > 14) ? 'small' : '';

  let ansHTML = '';
  if (isNum) {
    ansHTML = `
      <div class="input-line" id="iline">
        <input id="ansInput" type="text" inputmode="decimal" placeholder="输入答案" autocomplete="off">
        <span class="unit">${c.unit || ''}</span>
      </div>
      <button class="btn-main" id="submitBtn">确认</button>`;
  } else {
    ansHTML = `<div class="options" id="opts">` + c.options.map((o, idx) =>
      `<button class="opt" data-opt="${idx}" ${S.answered ? 'disabled' : ''}>
        <span class="key">${'ABCD'[idx]}</span><span>${o}</span>
      </button>`).join('') + `</div>`;
  }

  let fbHTML = '';
  if (S.answered) {
    const ok = S.lastOk;
    fbHTML = `
      <div class="feedback ${ok ? 'ok' : 'no'}">
        <div class="fb-head">${ok ? '✓ 对了' : '✕ 偏了'}</div>
        ${c.type === 'num' && !ok && S.userAns ? `<div class="fb-ans" style="color:var(--sub)">你填的：${S.userAns}</div>` : ''}
        <div class="fb-ans">正确答案：<b>${c.type === 'num' ? c.ans + (c.unit || '') : 'ABCD'[c.ans] + '. ' + c.options[c.ans]}</b></div>
        <div class="fb-tip">${c.tip}</div>
      </div>
      <button class="btn-main green" id="nextBtn">继续 →</button>`;
  }

  return `
  <div class="qwrap">
    <div class="progress-bar"><i style="width:${pct}%"></i></div>
    <div class="qmeta">
      <span class="tag">${c.tag}</span>
      <span>${S.streak >= 3 ? `<span class="streak">🔥 ${S.streak}</span>` : `${S.session.right}/${S.session.total}`}</span>
    </div>
    <div class="qcard">
      <div class="qtext ${cls}">${qText}</div>
      <div class="answer-area">${ansHTML}${fbHTML}</div>
    </div>
  </div>`;
}

/* ---------------- 结算 ---------------- */
function viewResult() {
  const { total, right } = S.session;
  const acc = total ? Math.round(right / total * 100) : 0;
  let desc = '先把错的过一遍，比刷新的有用。';
  if (acc >= 90) desc = '这个正确率，考场上不会慌。';
  else if (acc >= 75) desc = '稳了，剩下的是速度。';
  else if (acc >= 60) desc = '有印象但没形成反射，再来一轮。';
  return `
  <div class="result">
    <div class="big">${acc}<small>%</small></div>
    <div class="desc">${desc}</div>
    <div class="result-stats">
      <div><div class="n">${total}</div><div class="l">本轮题数</div></div>
      <div><div class="n" style="color:var(--green)">${right}</div><div class="l">答对</div></div>
      <div><div class="n" style="color:var(--red)">${total - right}</div><div class="l">答错</div></div>
    </div>
    ${S.session.maxStreak >= 5 ? `<div class="streak-fire">🔥 最高连击 ${S.session.maxStreak}</div>` : ''}
    <div style="width:100%; margin-top:26px;">
      <button class="btn-main" id="againBtn">再来一轮</button>
      <button class="btn-main" id="homeBtn" style="background:transparent;color:var(--sub);margin-top:6px;">回首页</button>
    </div>
  </div>`;
}

/* ---------------- 错题本 ---------------- */
function viewWrong() {
  const ids = Object.keys(store.cards).filter(k => store.cards[k].w > 0);
  if (!ids.length) return `<div class="empty">还没有错题。<br>没刷过就没错题，去刷几道。</div>`;
  const items = ids.map(id => {
    const card = findCard(id);
    if (!card) return '';
    return `<div class="list-item">
      <div class="q">${card.headline || card.q}</div>
      <div class="a">✓ <b>${card.type === 'num' ? card.ans + (card.unit || '') : card.options[card.ans]}</b></div>
      <div class="t">${card.tip}</div>
      <div class="meta">
        <span class="chip">${card.tag}</span>
        <span class="chip r">错 ${store.cards[id].w} 次</span>
      </div>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:14px;color:var(--sub);font-size:13px;">共 ${ids.length} 道。答对 2 次后自动移出。</div>${items}
  <button class="btn-main" id="redoWrong">只刷这些错题</button>`;
}

function viewStats() {
  const days = store.stats.days || {};
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * DAY);
    const k = dateKey(d);
    last7.push({ k, n: days[k] || 0, label: '日一二三四五六'[d.getDay()] });
  }
  const max = Math.max(10, ...last7.map(x => x.n));
  const bar = last7.map(x => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:11px;color:var(--dim)">${x.n || ''}</div>
      <div style="width:100%;height:${Math.max(4, x.n / max * 90)}px;background:${x.n ? 'var(--blue)' : 'var(--line)'};border-radius:5px;opacity:${x.n ? 1 : .5}"></div>
      <div style="font-size:11px;color:var(--dim)">${x.label}</div>
    </div>`).join('');
  const total = store.stats.total, right = store.stats.right;
  return `
  <div class="sec-label">最近 7 天</div>
  <div style="display:flex;gap:7px;align-items:flex-end;height:140px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:18px;">${bar}</div>
  <div class="stat-row">
    <div class="stat-box"><div class="n">${total}</div><div class="l">累计答题</div></div>
    <div class="stat-box"><div class="n">${total ? Math.round(right / total * 100) : 0}%</div><div class="l">总正确率</div></div>
  </div>
  <div class="stat-row">
    <div class="stat-box"><div class="n">${Object.keys(store.cards).length}</div><div class="l">已见题目</div></div>
    <div class="stat-box"><div class="n">${wrongCount()}</div><div class="l">待消化错题</div></div>
  </div>`;
}

function deckList(includeArchived) {
  const now = Date.now();
  const m = {};
  allCards().forEach(c => {
    if (!m[c.deck]) m[c.deck] = { name: c.deck, total: 0, due: 0, learned: 0, archived: false };
    m[c.deck].total++;
    const s = DB.sched[c.id];
    if (!s) { m[c.deck].due++; }
    else {
      m[c.deck].learned++;
      if (s.due <= now) m[c.deck].due++;
    }
  });
  const order = {};
  DB.decks.forEach(d => { order[d.name] = d.order; if (m[d.name]) m[d.name].archived = !!d.archived; });
  return Object.values(m)
    .filter(d => includeArchived || !d.archived)
    .sort((a, b) => (order[a.name] ?? 99) - (order[b.name] ?? 99));
}

function masteryOf(deck) {
  const cards = allCards().filter(c => !deck || deck === '全部' || c.deck === deck);
  if (!cards.length) return 0;
  let sum = 0;
  cards.forEach(c => {
    const s = CB.sched[c.id];
    if (!s) return;
    // 稳定性折算成掌握度：S 越大越稳
    sum += Math.min(1, s.S / 21);
  });
  return Math.round(sum / cards.length * 100);
}

function heatCells(weeks) {
  const days = {};
  (DB.logs || []).forEach(l => {
    const k = dateKey(new Date(l.t));
    days[k] = (days[k] || 0) + 1;
  });
  const today = new Date();
  const start = new Date(today);
  start.setDate(today.getDate() - (weeks * 7 - 1));
  while (start.getDay() !== 1) start.setDate(start.getDate() - 1);
  const cells = [];
  const cur = new Date(start);
  while (cur <= today) {
    const k = dateKey(cur);
    const n = days[k] || 0;
    let lv = 0;
    if (n >= 1) lv = 1;
    if (n >= 10) lv = 2;
    if (n >= 25) lv = 3;
    if (n >= 50) lv = 4;
    cells.push(`<i class="${lv ? 'l' + lv : ''}" title="${k}：${n} 张"></i>`);
    cur.setDate(cur.getDate() + 1);
  }
  return cells.join('');
}

function trendData(days) {
  const arr = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dateKey(d);
    const logs = (DB.logs || []).filter(l => dateKey(new Date(l.t)) === k);
    arr.push({
      k, label: (d.getMonth() + 1) + '/' + d.getDate(),
      n: logs.length,
      ms: logs.reduce((a, b) => a + (b.ms || 0), 0)
    });
  }
  return arr;
}

function deckStats() {
  const m = {};
  (DB.logs || []).forEach(l => {
    if (!l.deck) return;
    if (!m[l.deck]) m[l.deck] = { name: l.deck, n: 0, right: 0, ms: 0, msN: 0 };
    m[l.deck].n++;
    if (l.g >= 3) m[l.deck].right++;
    if (l.ms) { m[l.deck].ms += l.ms; m[l.deck].msN++; }
  });
  return Object.values(m).map(v => ({
    name: v.name, n: v.n,
    acc: v.n ? Math.round(v.right / v.n * 100) : 0,
    avg: v.msN ? Math.round(v.ms / v.msN / 1000) : 0
  })).sort((a, b) => b.n - a.n);
}

function weekStats() {
  const now = Date.now();
  const w = (DB.logs || []).filter(l => now - l.t < 7 * 86400000);
  const m = (DB.logs || []).filter(l => {
    const d = new Date(l.t);
    const t = new Date();
    return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth();
  });
  const calc = arr => ({
    n: arr.length,
    acc: arr.length ? Math.round(arr.filter(l => l.g >= 3).length / arr.length * 100) : 0,
    min: Math.round(arr.reduce((a, b) => a + (b.ms || 0), 0) / 60000)
  });
  return { week: calc(w), month: calc(m) };
}

function toggleRemind() {
  if (DB.settings.remind) { DB.settings.remind = false; saveDB(); toast('已关闭提醒'); render(); return; }
  if (!('Notification' in window)) { toast('这个浏览器不支持通知'); return; }
  if (Notification.permission === 'granted') {
    DB.settings.remind = true; saveDB(); toast('已开启提醒'); render(); return;
  }
  Notification.requestPermission().then(p => {
    if (p === 'granted') { DB.settings.remind = true; saveDB(); toast('已开启提醒'); render(); }
    else { toast('没有授权，无法推送'); }
  });
}

function checkRemind() {
  if (!DB.settings.remind || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  if (now - (DB.settings.lastRemind || 0) < 4 * 3600 * 1000) return;
  const n = dueCards('全部').length;
  if (n <= 0) return;
  DB.settings.lastRemind = now;
  saveDB();
  new Notification('饼干 · 该复习了', { body: `有 ${n} 张卡片等着你`, icon: document.querySelector('link[rel="icon"]') ? document.querySelector('link[rel="icon"]').href : undefined });
}

    </div>
    <button class="btn-main ghost" id="mArchive" style="margin-top:8px;">${d.archived ? '取消归档' : '归档（隐藏，数据保留）'}</button>
    <button class="btn-main ghost" id="mReset" style="margin-top:8px;">重置本组复习进度</button>
    <button class="btn-main" id="mDel" style="margin-top:8px; background:var(--red);">删除卡组</button>
  `, (el, close) => {
    el.querySelector('#mRename').onclick = () => {
      close();
      sheet(`<h3>重命名</h3>
        <div class="field"><input id="rnVal" value="${escAttr(name)}"></div>
        <button class="btn-main" id="rnOk">保存</button>`, (e2, c2) => {
        e2.querySelector('#rnOk').onclick = () => {
          const v = e2.querySelector('#rnVal').value.trim();
          if (!v) { toast('名字不能为空'); return; }
          if (v !== name && deckExists(v)) { toast('重名了'); return; }
          allCards().forEach(c => { if (c.deck === name) c.deck = v; });
          const dd = DB.decks.find(x => x.name === name);
          if (dd) dd.name = v;
          saveDB(); c2(); toast('已重命名'); render();
        };
      });
    };
    el.querySelector('#mArchive').onclick = () => {
      d.archived = !d.archived; saveDB(); close();
      toast(d.archived ? '已归档，数据保留' : '已取消归档'); render();
    };
    const shift = dir => {
      const arr = DB.decks.slice().sort((a, b) => a.order - b.order);
      const i = arr.findIndex(x => x.name === name);
      const j = i + dir;
      if (j < 0 || j >= arr.length) { toast('到头了'); return; }
      [arr[i], arr[j]] = [arr[j], arr[i]];
      arr.forEach((x, k) => { x.order = k; });
      saveDB(); close(); render();
    };
    el.querySelector('#mUp').onclick = () => shift(-1);
    el.querySelector('#mDown').onclick = () => shift(1);
    el.querySelector('#mReset').onclick = () => {
      close();
      confirmSheet('重置本组进度', `「${name}」的 ${n} 张卡片会回到「新卡」状态，学习记录保留。`, '确定重置', () => {
        allCards().filter(c => c.deck === name).forEach(c => { delete DB.sched[c.id]; });
        saveDB(); toast('已重置'); render();
      });
    };
    el.querySelector('#mDel').onclick = () => {
      close();
      confirmSheet('删除卡组', `「${name}」的 ${n} 张卡片会一起删除，不可恢复。建议先导出备份。`, '删除', () => {
        DB.cards = allCards().filter(c => c.deck !== name);
        DB.decks = DB.decks.filter(x => x.name !== name);
        saveDB(); toast('已删除'); go('decks');
      });
    };
  });
}

function bulkMoveFlow() {
  const targets = DB.decks.map(d => d.name);
  sheet(`<h3>移动到</h3><div class="sdesc">已选 ${SEL.size} 张</div>
    <div class="list" style="gap:8px;">
      ${targets.map(t => `<button class="crow" data-mv="${escAttr(t)}"><span class="g"><b>${t}</b></span></button>`).join('')}
    </div>`, (el, close) => {
    el.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const t = b.dataset.mv;
      allCards().forEach(c => { if (SEL.has(c.id)) c.deck = t; });
      saveDB(); SEL.clear(); close(); toast('已移动'); render();
    });
  });
}

function bulkDelete() {
  const n = SEL.size;
  confirmSheet('删除卡片', `选中的 ${n} 张卡片会被删除，不可恢复。`, '删除', () => {
    DB.cards = allCards().filter(c => !SEL.has(c.id));
    SEL.forEach(id => { delete DB.sched[id]; });
    SEL.clear(); saveDB(); toast('已删除'); render();
  });
}

function paperFlow() {
  const decks = deckList(true).map(d => d.name);
  sheet(`<h3>生成试卷</h3>
    <div class="sdesc">从卡组里抽题，生成可打印的卷子。题目取卡片正面，答案取背面。</div>
    <div class="field"><label>卡组</label>
      <select id="pDeck"><option value="__all">全部卡组</option>${decks.map(d => `<option value="${escAttr(d)}">${d}</option>`).join('')}</select>
    </div>
    <div class="field"><label>题量</label>
      <select id="pNum"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
    </div>
    <div class="field"><label>版本</label>
      <select id="pVer">
        <option value="q">纯题目版</option>
        <option value="a">题目 + 答案版</option>
      </select>
    </div>
    <button class="btn-main" id="pOk">生成并打印</button>
  `, (el, close) => {
    el.querySelector('#pOk').onclick = () => {
      const deck = el.querySelector('#pDeck').value;
      const num = +el.querySelector('#pNum').value;
      const ver = el.querySelector('#pVer').value;
      const pool = allCards().filter(c => deck === '__all' || c.deck === deck);
      if (!pool.length) { toast('这个卡组没有卡片'); return; }
      const picked = shuffle(pool).slice(0, num);
      const html = buildPaper(picked, deck === '__all' ? '全部卡组' : deck, ver);
      close();
      const w = window.open('', '_blank');
      if (!w) { download('试卷_' + dateKey() + '.html', html, 'text/html;charset=utf-8'); toast('弹窗被拦截，已下载文件'); return; }
      w.document.write(html); w.document.close();
      setTimeout(() => { try { w.print(); } catch (e) {} }, 400);
    };
  });
}

function buildPaper(cards, title, ver) {
  const body = cards.map((c, i) => `
    <div class="q">
      <div class="qt"><b>${i + 1}.</b> ${tex(c.front)}</div>
      ${ver === 'a' ? `<div class="ans">答案：${tex(c.back)}${c.trap ? `<br><span class="trap">坑点：${tex(c.trap)}</span>` : ''}</div>` : ''}
    </div>`).join('');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title} 试卷</title>
  <style>
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:36px auto;padding:0 24px;color:#1a1a1a;line-height:1.9;}
    h1{font-size:22px;margin-bottom:6px;} .meta{color:#888;font-size:13px;margin-bottom:24px;}
    .q{margin-bottom:18px;page-break-inside:avoid;}
    .qt{font-size:15px;} b{font-weight:600;}
    .ans{margin-top:6px;color:#0a7d55;font-size:14px;}
    .trap{color:#a33;font-size:12.5px;}
    .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.86em;line-height:1.15;}
    .frac b{border-bottom:1px solid currentColor;padding:0 4px;font-weight:inherit;}
    .frac i{font-style:normal;padding:0 4px;}
    @media print{ body{margin:0;} .noprint{display:none;} }
  </style></head><body>
  <h1>${title} · 练习卷</h1>
  <div class="meta">共 ${cards.length} 题 · ${ver === 'a' ? '含答案版' : '纯题目版'} · 生成于 ${new Date().toLocaleString('zh-CN')}</div>
  ${body}
  </body></html>`;
}

function snapshotFlow() {
  const snaps = (DB.snapshots || []).slice().reverse();
  sheet(`<h3>本地快照</h3>
    <div class="sdesc">自动每 6 小时存一次，最多保留 5 份。恢复会覆盖当前数据。</div>
    <button class="btn-main" id="snapNow">立即存一份</button>
    <div class="list" style="gap:8px; margin-top:14px;">
      ${snaps.length ? snaps.map((s, i) => `
        <button class="crow" data-snap="${DB.snapshots.length - 1 - i}">
          <span class="dot" style="background:#ffd9a8;"></span>
          <span class="g"><b>${new Date(s.at).toLocaleString('zh-CN')}</b><span>${s.reason === 'auto' ? '自动' : '手动'}快照</span></span>
        </button>`).join('') : '<div class="empty" style="padding:20px;">还没有快照</div>'}
    </div>`, (el, close) => {
    el.querySelector('#snapNow').onclick = () => { takeSnapshot('manual'); close(); toast('已保存快照'); render(); };
    el.querySelectorAll('[data-snap]').forEach(b => b.onclick = () => {
      const idx = +b.dataset.snap;
      const s = DB.snapshots[idx];
      if (!s) return;
      if (!confirm('恢复这份快照？当前数据会被覆盖。')) return;
      try {
        const d = JSON.parse(s.data);
        DB.cards = d.cards; DB.decks = d.decks; DB.sched = d.sched;
        if (d.logs) DB.logs = d.logs;
        if (d.settings) DB.settings = Object.assign(DB.settings, d.settings);
        saveDB(); close(); toast('已恢复'); render();
      } catch (e) { toast('快照损坏'); }
    });
  });
}

function resetLogsFlow() {
  confirmSheet('清空学习记录', '所有作答日志、模考记录会被删除，卡片和复习进度保留。', '确定清空', () => {

function weakCards() {
  return allCards().filter(c => {
    const s = CB.sched[c.id];
    if (!s) return false;
    return (s.g && s.g <= 2) || (s.lapses || 0) >= 2;
  });
}

  if (!c) return '';

  const showTimer = CB.settings.timer && ST.mode !== 'exam';
  const cloze = DB.settings.mode === 'cloze';
  return `
  <div class="study">
    <div class="study-bar">
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="cnt">${ST.i + 1}/${ST.queue.length}</div>
      <button id="quitStudy" style="width:26px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:15px;line-height:1;flex-shrink:0;">×</button>
    </div>
    ${showTimer ? '<div class="timer"><i style="width:100%"></i></div>' : ''}
    <div class="stage">
      <div class="flip ${ST.flipped ? 'on' : ''}" id="flip">
        <div class="flip-inner">
          <div class="face front">
            <span class="ftag">${c.deck}${cloze ? ' · 挖空' : ''}</span>
            <div class="fq">${tex(c.front)}</div>
            ${cloze ? `<input id="clozeIn" placeholder="先写下你的答案（可留空）" value="${escAttr(ST.clozeAns || '')}"
              style="margin-top:16px; width:100%; border:none; border-bottom:2px solid var(--line); background:none;
              font-size:15px; padding:8px 2px; outline:none; color:var(--ink); user-select:text;">` : ''}
            <div class="fhint">${ST.timeout ? '⏱ 超时，记为完全不会' : '点击卡片，或点下方按钮翻面'}</div>
          </div>
          <div class="face back">
            <span class="ftag">${c.deck} · 答案</span>
            <div class="fa">${tex(c.back)}</div>
            ${cloze && ST.clozeAns ? `<div class="fnote" style="color:var(--dim);">你写的：${escHTML(ST.clozeAns)}</div>` : ''}
            ${c.note ? `<div class="fnote">${tex(c.note)}</div>` : ''}
            ${c.trap ? `<div class="ftrap">💡 ${tex(c.trap)}</div>` : ''}
            <div class="fsrc">上次：${lastSeen(c.id)}</div>
          </div>
        </div>
      </div>
    </div>
    ${ST.flipped
      ? (ST.awaitNext ? '<button class="btn-main" id="nextBtn" style="margin-top:12px;">下一张 →</button>' : ratesHTML())
      : '<button class="btn-main" id="flipBtn" style="margin-top:12px;">翻面看答案</button>'}
  </div>`;
}

function lastSeen(id) {
  const s = CB.sched[id];
  if (!s) return '第一次见';
  const d = Math.round(s.ivl);
  return `复习 ${s.reps} 次，当前间隔 ${d < 1 ? '10 分钟' : d + ' 天'}`;
}

function ratesHTML() {
  if (ST.timeout) return '<button class="btn-main" id="nextBtn" style="margin-top:12px;">继续 →</button>';
  const tags = ['记不清', '概念混淆', '没学过', '粗心'];
  return `
  <div style="display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap;">
    <span style="font-size:11px; color:var(--dim); flex-shrink:0;">错因</span>
    ${tags.map(t => `<button class="chip ${ST.wrongTag === t ? 'on' : ''}" data-tag="${t}" style="padding:5px 11px; font-size:12px;">${t}</button>`).join('')}
  </div>
  <div class="rates">
    <button class="rate" data-g="1"><b>完全不会</b><span>记不起来</span></button>
    <button class="rate" data-g="2"><b>不会</b><span>想很久</span></button>
    <button class="rate" data-g="3"><b>模糊</b><span>有点卡</span></button>
    <button class="rate" data-g="4"><b>秒答</b><span>秒出</span></button>
  </div>`;
}

function viewCardReport() {
  const r = ST.results;
  const total = r.length;
  const right = r.filter(x => x.g >= 3).length;
  const acc = total ? Math.round(right / total * 100) : 0;
  const totalMs = (ST.finishedAt || Date.now()) - ST.startedAt;
  const avg = total ? Math.round(r.reduce((a, b) => a + b.ms, 0) / total / 1000) : 0;
  const d1 = r.filter(x => x.g === 1).length;
  const d2 = r.filter(x => x.g === 2).length;
  const d3 = r.filter(x => x.g === 3).length;
  const d4 = r.filter(x => x.g === 4).length;
  let desc = '错的那几张，明天会自动再出现。';
  if (acc >= 90) desc = '记得很牢，间隔会自动拉长。';
  else if (acc >= 70) desc = '基本记住了，还有几张要再滚一遍。';
  else if (acc < 50) desc = '这张卡组对你还比较生，明天继续。';

  return `
  <div class="result">
    <div class="big">${acc}<small>%</small></div>
    <div class="desc">${desc}</div>
    <div class="result-stats">
      <div><div class="n">${total}</div><div class="l">本轮张数</div></div>
      <div><div class="n" style="color:var(--green)">${right}</div><div class="l">记住</div></div>
      <div><div class="n" style="color:var(--red)">${total - right}</div><div class="l">没记住</div></div>
    </div>
    <div style="display:flex; gap:22px; margin-top:22px; font-size:12.5px; color:var(--sub);">
      <span>总用时 ${Math.floor(totalMs / 60000)} 分 ${Math.round(totalMs % 60000 / 1000)} 秒</span>
      <span>平均 ${avg} 秒/张</span>
    </div>
    <div style="display:flex; gap:8px; width:100%; margin-top:26px;">
      <div class="rq"><b>${d4}</b><span>秒答</span></div>
      <div class="rq"><b>${d3}</b><span>模糊</span></div>
      <div class="rq"><b>${d2}</b><span>不会</span></div>
      <div class="rq"><b>${d1}</b><span>完全不会</span></div>
    </div>
    <div style="width:100%; margin-top:24px;">
      <button class="btn-main" id="againBtn">再来一组</button>
      <button class="btn-main" id="backCards" style="background:transparent; color:var(--sub); box-shadow:none; margin-top:6px;">回到卡片</button>
    </div>
  </div>`;
}

/* ---------------- 弹层 ---------------- */
function sheet(html, onMount) {
  const mask = document.createElement('div');
  mask.className = 'sheet-mask';
  mask.innerHTML = '<div class="sheet">' + html + '</div>';
  document.body.appendChild(mask);
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  if (onMount) onMount(mask, () => mask.remove());
  return mask;
}

function flipCard() {
  clearStudyTimer();
  const ci = $('#clozeIn');
  if (ci) ST.clozeAns = ci.value;
  ST.flipped = true;
  render();
}

function advance() {
  ST.i++;
  if (ST.i >= ST.queue.length) { finishStudy(); return; }
  ST.awaitNext = false;
  loadStudyCard();
  render();
}

/* ---------------- 学习流程 ---------------- */
function startCards(deck, mode, fixedList) {
  clearStudyTimer();
  const now = Date.now();
  let q;
  if (fixedList) {
    q = shuffle(fixedList.slice()).slice(0, CB.settings.goal || 20);
  } else {
    const pool = dueCards(deck);
    const dueArr = pool.filter(c => { const s = CB.sched[c.id]; return s && s.due <= now; });
    const fresh = pool.filter(c => !CB.sched[c.id]);
    q = [...shuffle(dueArr), ...shuffle(fresh)].slice(0, CB.settings.goal || 20);
  }
  if (!q.length) { toast('这个卡组暂时没有要复习的'); return; }
  ST = {
    deck, mode: mode || 'normal', queue: q, i: 0,
    flipped: false, timeout: false, wrongTag: '', results: [],
    startedAt: Date.now(), cardStart: Date.now(), finishedAt: 0
  };
  S.view = 'study';
  loadStudyCard();
  render();
}

function loadStudyCard() {
  ST.flipped = false;
  ST.timeout = false;
  ST.wrongTag = '';
  ST.cardStart = Date.now();
}

function startCardTimer() {
  clearStudyTimer();
  if (!ST || ST.mode === 'exam' || !CB.settings.timer) return;
  const total = CB.settings.timer * 1000;
  const deadline = Date.now() + total;
  studyTimer = setInterval(() => {
    const left = deadline - Date.now();
    const bar = document.querySelector('.timer i');
    if (bar) {
      bar.style.width = Math.max(0, left / total * 100) + '%';
      if (left < total * 0.35) bar.classList.add('low');
    }
    if (left <= 0) {
      clearStudyTimer();
      ST.timeout = true;
      ST.flipped = true;
      rateCard(ST.queue[ST.i].id, 1, { ms: total, tag: '超时' });
      ST.results.push({ id: ST.queue[ST.i].id, g: 1, ms: total });
      render();
    }
  }, 100);
}

function gradeCard(g) {
  clearStudyTimer();
  const c = ST.queue[ST.i];
  const ms = Date.now() - ST.cardStart;
  rateCard(c.id, g, { ms, tag: ST.wrongTag || '' });
  ST.results.push({ id: c.id, g, ms });
  ST.wrongTag = '';
  if (DB.settings.autoFlip === false) { ST.awaitNext = true; render(); return; }
  advance();
}

function finishStudy() {
  clearStudyTimer();
  ST.finishedAt = Date.now();
  const right = ST.results.filter(x => x.g >= 3).length;
  CB.sessions = CB.sessions || [];
  CB.sessions.push({
    at: ST.finishedAt, deck: ST.deck, mode: ST.mode,
    total: ST.results.length, right, ms: ST.finishedAt - ST.startedAt
  });
  if (CB.sessions.length > 200) CB.sessions = CB.sessions.slice(-200);
  CB.stats.timeMs = (CB.stats.timeMs || 0) + (ST.finishedAt - ST.startedAt);
  saveCB();
  S.view = 'creport';
  render();
}

/* ---------------- 导入导出 ---------------- */
function parseCSVLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ',' || ch === '\t') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { good: [], bad: [] };
  let start = 0;
  if (/正面|题目|front/i.test(lines[0])) start = 1;
  const good = [], bad = [];
  for (let i = start; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (!cols[0] || !cols[1]) { bad.push({ line: i + 1, text: lines[i].slice(0, 40) }); continue; }
    good.push({
      id: 'u' + Date.now().toString(36) + '_' + i,
      deck: (cols[4] || '').trim() || '我的卡片',
      front: cols[0], back: cols[1],
      note: cols[2] || '', trap: cols[3] || ''
    });
  }
  return { good, bad };
}

function importCSV(text) {
  const { good } = parseCSV(text);
  applyImport(good);
  return good.length;
}

function applyImport(list) {
  list.forEach(c => {
    if (!deckExists(c.deck)) DB.decks.push({ id: c.deck, name: c.deck, order: DB.decks.length, archived: false });
  });
  DB.cards = (DB.cards || []).concat(list);
  saveDB();
}

function download(name, content, type) {
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function exportCSV() {
  const rows = [['正面', '背面', '解析', '坑点', '分组']];
  allCards().forEach(c => {
    rows.push([c.front, c.back, c.note || '', c.trap || '', c.deck]);
  });
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  download('饼干卡片_' + dateKey() + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
  toast('已导出 CSV');
}

function exportBackup() {
  const pack = {
    app: '饼干', v: 3, at: Date.now(),
    data: { cards: DB.cards, decks: DB.decks, sched: DB.sched, logs: DB.logs, sessions: DB.sessions, settings: DB.settings, stats: DB.stats }
  };
  download('饼干备份_' + dateKey() + '.json', JSON.stringify(pack), 'application/json');
  toast('完整备份已下载');
}

function importBackup(text) {
  try {
    const raw = JSON.parse(text);
    const d = raw.data || raw;
    if (!d || !Array.isArray(d.cards)) throw 0;
    confirmSheet('恢复备份', `将覆盖当前全部数据（${d.cards.length} 张卡片）。`, '确定恢复', () => {
      DB = Object.assign(defDB(), d);
      DB.settings = Object.assign(defDB().settings, d.settings || {});
      CB = DB;
      saveDB(); applyTheme(); toast('已恢复'); go('home');
    });
  } catch (e) { toast('备份文件格式不对'); }
}

function findCard(id) {
  let c = calcBank.find(x => x.id === id) || pctBank.find(x => x.id === id)
        || sqBank.find(x => x.id === id) || formulaBank.find(x => x.id === id)
        || judgeBank.find(x => x.id === id) || idiomBank.find(x => x.id === id)
        || politicalBank.find(x => x.id === id)
        || commonBank.find(x => x.id === id);
  if (c) return c;
  // 生成题：按 id 还原
  const p = id.split('-');
  if (p[1] === 'fp' || p[1] === 'pf') {
    const n = +p[2], d = +p[3];
    const f = FRACS.find(x => x[0] === n && x[1] === d);
    if (!f) return null;
    if (p[1] === 'fp') return { id, type: 'num', q: `${n}/${d} ≈ ？%`, ans: f[2], unit: '%', tol: .16, tip: `百化分：${n}/${d} ≈ ${f[2]}%。分母为 7、9、11、13 的分数要单独记牢。`, tag: '分数化百分数' };
    return { id, type: 'num', q: `${f[2]}% 最接近 1/?`, headline: `${f[2]}% 最接近 1/?`, ans: d, unit: '', tol: 0, tip: `百化分反向：${f[2]}% ≈ ${n}/${d}`, tag: '百分数化分数' };
  }
  if (p[1] === 'rate') {
    const base = +p[2], inc = +p[3];
    const rate = +(inc / base * 100).toFixed(2);
    return { id, type: 'num', q: `现期 ${+(base + inc).toFixed(1)}，基期 ${base}，增长率约为 ？%`, ans: rate, unit: '%', tol: .3, tip: `增长率 =（现期 − 基期）÷ 基期 = ${inc} ÷ ${base} ≈ ${rate}%。分母永远是基期。`, tag: '增长率计算' };
  }
  if (p[1] === 'base') {
    const base = +p[2], rate = +p[3];
    const now = +(base * (1 + rate / 100)).toFixed(1);
    return { id, type: 'num', q: `现期 ${now}，同比增长 ${rate}%，则基期为 ？`, ans: base, unit: '', tol: .5, tip: `基期 = 现期 ÷ (1 + 增长率) = ${now} ÷ ${(1 + rate / 100).toFixed(2)} = ${base}。`, tag: '基期量' };
  }
  if (p[1] === 'gap') {
    const a = +p[2], b = +p[3];
    return { id, type: 'num', q: `连续两年分别增长 ${a}% 和 ${b}%，隔年增长率约为 ？%`, ans: +(a + b + a * b / 100).toFixed(2), unit: '%', tol: .3, tip: `隔年增长率 = r₁ + r₂ + r₁×r₂ ≈ ${(a + b + a * b / 100).toFixed(2)}%。第三项不能漏。`, tag: '隔年增长率' };
  }
  return null;
}

/* ---------------- 事件绑定 ---------------- */
function bind() {
  // 首页
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => startQuiz(b.dataset.mode));
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; render(); });
  const h1 = document.querySelector('.hero h1');
  if (h1) {
    let taps = 0, timer;
    h1.onclick = () => {
      taps++; clearTimeout(timer);
      timer = setTimeout(() => taps = 0, 1200);
      if (taps >= 5) { if (confirm('清空全部刷题记录？')) { localStorage.removeItem(STORE_KEY); store = loadStore(); render(); } }
    };
  }

  // 答题
  const input = $('#ansInput');
  if (input) {
    input.focus();
    input.addEventListener('focus', () => $('#iline').classList.add('focus'));
    input.addEventListener('blur', () => $('#iline').classList.remove('focus'));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitNum(); });
    $('#submitBtn').onclick = submitNum;
  }
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => submitChoice(+b.dataset.opt));
  const nb = $('#nextBtn');
  if (nb) nb.onclick = nextCard;

  // 结算
  const ab = $('#againBtn');
  if (ab) ab.onclick = () => startQuiz(S.mode);
  const hb = $('#homeBtn');
  if (hb) hb.onclick = () => go('home');

  // 错题本
  const rw = $('#redoWrong');
  if (rw) rw.onclick = redoWrong;

  // 返回按钮
  const bk = $('#backBtn');
  if (bk) bk.onclick = () => { if (S.view === 'quiz' && S.session.total > 0 && !confirm('退出本轮？')) return; go('home'); };

  // ---- 卡片首页 ----
  const sa = $('#startAll');
  if (sa) sa.onclick = () => startCards('全部', 'normal');
  document.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => startCards(b.dataset.deck, 'normal'));
  document.querySelectorAll('[data-timer]').forEach(b => b.onclick = () => { CB.settings.timer = +b.dataset.timer; saveCB(); render(); });
  document.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { CB.settings.goal = +b.dataset.goal; saveCB(); render(); });

/* ---------------- 出题流程 ---------------- */
function startQuiz(mode) {
  S.mode = mode;
  let pool = buildPool(mode);
  // 优先插入错题
  const wrongIds = Object.keys(store.cards).filter(k => store.cards[k].w > 0 && store.cards[k].box < 2);
  const n = 20;
  const selected = [];
  const now = Date.now();

  // 1) 到期复习题
  const dueIds = pool.filter(c => { const s = store.cards[c.id]; return s && s.next <= now && (s.r + s.w) > 0; }).map(c => c.id);
  const dueCards = shuffle(pool.filter(c => dueIds.includes(c.id))).slice(0, 12);
  selected.push(...dueCards);

  // 2) 新题补齐
  const seen = new Set(selected.map(c => c.id));
  const fresh = shuffle(pool.filter(c => !seen.has(c.id) && !store.cards[c.id]));
  const freshCards = fresh.slice(0, Math.max(0, n - selected.length));
  selected.push(...freshCards);

  // 3) 还不够就随便补
  while (selected.length < n) {
    const extra = pick(pool);
    if (!seen.has(extra.id)) { selected.push(extra); seen.add(extra.id); }
    else if (pool.length <= n) break;
    else if (selected.length >= pool.length) break;
  }

  S.queue = shuffle(selected).slice(0, n);
  S.i = 0; S.streak = 0;
  S.session = { total: 0, right: 0, start: Date.now() };
  S.view = 'quiz';
  loadCard();
  render();
}

function redoWrong() {
  const ids = Object.keys(store.cards).filter(k => store.cards[k].w > 0 && store.cards[k].box < 2);
  const pool = [];
  ids.forEach(id => { const c = findCard(id); if (c) pool.push({ ...c, src: 'wrong' }); });
  if (!pool.length) return;
  S.queue = shuffle(pool).slice(0, 20);
  S.i = 0; S.streak = 0;
  S.session = { total: 0, right: 0, start: Date.now() };
  S.view = 'quiz';
  loadCard(); render();
}

function loadCard() {
  S.cur = S.queue[S.i];
  // 选择题：每次出现都重新打乱选项，正确答案位置随机
  if (S.cur && S.cur.type !== 'num' && Array.isArray(S.cur.options)) {
    const right = S.cur.options[S.cur.ans];
    const opts = shuffle(S.cur.options.slice());
    S.cur.options = opts;
    S.cur.ans = opts.indexOf(right);
  }
  S.answered = false;
  S.picked = null;
  S.userAns = '';
  S.lastOk = false;
}

function submitNum() {
  const input = $('#ansInput');
  if (!input || S.answered) return;
  const shown = input.value.trim();
  const raw = shown.replace(/[%％,，\s]/g, '');
  if (raw === '') { input.focus(); return; }
  const v = parseFloat(raw);
  if (isNaN(v)) { input.focus(); return; }
  const c = S.cur;
  const ok = Math.abs(v - c.ans) <= (c.tol || 0.001);
  S.userAns = shown;
  judge(ok);
}

function submitChoice(idx) {
  if (S.answered) return;
  S.picked = idx;
  judge(idx === S.cur.ans);
}

function judge(ok) {
  S.answered = true;
  S.lastOk = ok;
  const c = S.cur;
  const card = getCard(c.id);
  const td = todayKey();

  // 记录
  store.stats.total++;
  store.stats.days[td] = (store.stats.days[td] || 0) + 1;
  // 练习模式的每日配额进度
  if (!DB.stats.moduleDays) DB.stats.moduleDays = {};
  const md = DB.stats.moduleDays[td] || (DB.stats.moduleDays[td] = {});
  const mk = S.mode === 'mix' ? null : S.mode;
  if (mk) md[mk] = (md[mk] || 0) + 1;
  saveDB();
  if (ok) {
    store.stats.right++;
    card.r++; card.box = Math.min(7, card.box + 1);
    S.streak++;
    S.session.right++;
  } else {
    card.w++; card.box = 0;
    S.streak = 0;
    // 本轮内再出现一次
    if (!S.session.requeued) S.session.requeued = 0;
    if (S.session.requeued < 6 && S.queue.length < 60) {
      S.queue.push({ ...c });
      S.session.requeued++;
    }
  }
  card.last = Date.now();
  card.next = Date.now() + INTERVALS[card.box] * DAY;
  S.session.total++;
  if (S.streak > (S.session.maxStreak || 0)) S.session.maxStreak = S.streak;
  if (S.streak > (store.stats.best || 0)) store.stats.best = S.streak;

  // 连续天数
  const last = store.stats.lastDay;
  if (last !== td) {
    const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
    store.stats.streakDays = (last === y) ? (store.stats.streakDays || 0) + 1 : 1;
    store.stats.lastDay = td;
  }
  save();
  render();
}

function nextCard() {
  S.i++;
  if (S.i >= S.queue.length) { S.view = 'result'; render(); return; }
  loadCard();
  render();
}

/* =======================================================================
   云同步（Supabase）
   ======================================================================= */
const CLOUD_CFG_KEY = 'binggan_cloud_cfg';
function cloudCfg() {
  try { return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)) || {}; } catch (e) { return {}; }
}
function saveCloudCfg(c) { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(c)); }
function ghConf() {
  const c = cloudCfg();
  if (!c.gUser || !c.gRepo || !c.gToken) return null;
  return { user: c.gUser, repo: c.gRepo, token: c.gToken, path: c.gPath || 'binggan-data.json' };
}
function ghApi() {
  const g = ghConf();
  return g ? 'https://api.github.com/repos/' + g.user + '/' + g.repo + '/contents/' + g.path : null;
}
function ghHeaders() {
  const g = ghConf();
  return {
    'Authorization': 'Bearer ' + g.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
const b64enc = str => btoa(unescape(encodeURIComponent(str)));
const b64dec = b64 => decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));

async function ghPush(silent) {
  const g = ghConf();
  if (!g) { if (!silent) toast('先配置同步'); return false; }
  try {
    let sha = null;
    const r0 = await fetch(ghApi(), { headers: ghHeaders() });
    if (r0.ok) { const j = await r0.json(); sha = j.sha; }
    const body = { message: 'sync ' + new Date().toISOString(), content: b64enc(JSON.stringify(DB)) };
    if (sha) body.sha = sha;
    const r = await fetch(ghApi(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    if (!r.ok) {
      const hint = r.status === 401 ? '（Token 不对或过期）'
        : r.status === 403 ? '（Token 没有写权限）'
        : r.status === 404 ? '（仓库不存在，或 Token 没有这个仓库的权限）'
        : '';
      throw new Error('HTTP ' + r.status + hint);
    }
    DB.settings.lastPush = Date.now();
    try { localStorage.setItem(CARD_KEY, JSON.stringify(DB)); } catch (e) {}
    if (!silent) toast('已上传到 GitHub');
    return true;
  } catch (e) {
    if (!silent) toast('上传失败：' + e.message);
    return false;
  }
}

async function ghPull(force) {
  const g = ghConf();
  if (!g) { toast('先配置同步'); return null; }
  try {
    const r = await fetch(ghApi(), { headers: ghHeaders() });
    if (r.status === 404) { if (force) toast('仓库里还没有同步文件'); return null; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return { payload: JSON.parse(b64dec(j.content)), at: (j.commit && j.commit.author && j.commit.author.date) || '' };
  } catch (e) {
    toast('拉取失败：' + e.message);
    return null;
  }
}

function sbConf() {
  const c = cloudCfg();
  if (!c.url || !c.key || !c.sync) return null;
  let u = String(c.url).trim().replace(/\/+$/, '');
  if (u.indexOf('/rest/v1') > 0) u = u.split('/rest/v1')[0];
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return { url: u, key: String(c.key).trim(), sync: String(c.sync).trim() };
}

function sbHeaders(key, extra) {
  const h = Object.assign({ 'apikey': key }, extra || {});
  if (key.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + key;
  return h;
}

async function sbPush(silent) {
  const b = sbConf();
  if (!b) return false;
  try {
    const r = await fetch(b.url + '/rest/v1/binggan_data?on_conflict=id', {
      method: 'POST',
      headers: sbHeaders(b.key, {
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      }),
      body: JSON.stringify([{
        id: b.sync,
        payload: JSON.stringify(DB),
        updated_at: new Date().toISOString(),
        device: (navigator.userAgent || 'web').slice(0, 40)
      }])
    });
    if (!r.ok) {
      const hint = r.status === 401 ? '（key 不对）' : r.status === 404 ? '（表不存在，SQL 没跑成功）' : r.status === 403 ? '（RLS 策略没配，重跑 SQL）' : '';
      throw new Error('HTTP ' + r.status + hint);
    }
    DB.settings.lastPush = Date.now();
    try { localStorage.setItem(CARD_KEY, JSON.stringify(DB)); } catch (e) {}
    if (!silent) toast('已上传到 Supabase');
    return true;
  } catch (e) {
    if (!silent) {
      toast('上传失败：' + e.message);
      console.warn('[sb] target =', b.url + '/rest/v1/binggan_data');
    }
    return false;
  }
}

async function sbPull(force) {
  const b = sbConf();
  if (!b) return null;
  try {
    const r = await fetch(b.url + '/rest/v1/binggan_data?id=eq.' + encodeURIComponent(b.sync) + '&select=payload,updated_at', {
      headers: sbHeaders(b.key)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    if (!arr.length) { if (force) toast('云端还没有数据'); return null; }
    return { payload: JSON.parse(arr[0].payload), at: arr[0].updated_at };
  } catch (e) {
    toast('拉取失败：' + e.message);
    return null;
  }
}

function geConf() {
  const c = cloudCfg();
  if (!c.gt || !c.sync) return null;
  return { token: String(c.gt).trim(), sync: String(c.sync).trim() };
}

const GE = 'https://gitee.com/api/v5';

async function geFind(token, sync) {
  const r = await fetch(GE + '/gists?access_token=' + encodeURIComponent(token) + '&per_page=100');
  if (r.status === 401) throw new Error('token 无效');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const list = await r.json();
  if (!Array.isArray(list)) throw new Error('token 或权限不对');
  return list.find(x => x.description === sync) || null;
}

async function gePush(silent) {
  const g = geConf();
  if (!g) return false;
  const files = { 'binggan.json': { content: JSON.stringify(DB) } };
  try {
    const hit = await geFind(g.token, g.sync);
    let url, method, body;
    if (hit) {
      url = GE + '/gists/' + hit.id + '?access_token=' + encodeURIComponent(g.token);
      method = 'PATCH';
      body = { files };
    } else {
      url = GE + '/gists?access_token=' + encodeURIComponent(g.token);
      method = 'POST';
      body = { description: g.sync, public: false, files };
    }
    const r = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!r.ok) {
      const t = await r.text().catch(() => '');
      throw new Error('HTTP ' + r.status + (t ? ' · ' + t.slice(0, 60) : ''));
    }
    DB.settings.lastPush = Date.now();
    try { localStorage.setItem(CARD_KEY, JSON.stringify(DB)); } catch (e) {}
    if (!silent) toast('已上传到 Gitee');
    return true;
  } catch (e) {
    if (!silent) toast('上传失败：' + e.message);
    return false;
  }
}

async function gePull(force) {
  const g = geConf();
  if (!g) return null;
  try {
    const hit = await geFind(g.token, g.sync);
    if (!hit) { if (force) toast('云端还没有数据'); return null; }
    const f = hit.files && hit.files['binggan.json'];
    if (!f) { if (force) toast('云端文件缺失'); return null; }
    let content = f.content;
    if (!content && f.raw_url) {
      const rr = await fetch(f.raw_url);
      content = await rr.text();
    }
    return { payload: JSON.parse(content), at: hit.updated_at };
  } catch (e) {
    toast('拉取失败：' + e.message);
    return null;
  }
}

async function cloudPush(silent) {
  if (geConf()) return gePush(silent);
  if (sbConf()) return sbPush(silent);
  if (ghConf()) return ghPush(silent);
  if (!silent) toast('先配置同步');
  return false;
}
async function cloudPull(force) {
  if (geConf()) return gePull(force);
  if (sbConf()) return sbPull(force);
  if (ghConf()) return ghPull(force);
  toast('先配置同步');
  return null;
}

    <button class="btn-main" id="cSave">保存并测试</button>
  `, (el, close) => {
    el.querySelector('#cSave').onclick = () => {
      const v = id => (el.querySelector('#' + id).value || '').trim();
      const sUrl = v('sUrl'), sKey = v('sKey'), sSync = v('sSync');
      const geToken = v('geToken'), geSync = v('geSync');
      const gUser = v('gUser'), gRepo = v('gRepo'), gToken = v('gToken');
      const auto = cloudCfg().auto || false;
      const blank = { url: '', key: '', gt: '', gUser: '', gRepo: '', gToken: '' };
      if (geToken && geSync) {
        saveCloudCfg(Object.assign({}, blank, { gt: geToken, sync: geSync, auto }));
      } else if (sUrl && sKey && sSync) {
        saveCloudCfg(Object.assign({}, blank, { url: sUrl, key: sKey, sync: sSync, auto }));
      } else if (gUser && gRepo && gToken) {
        saveCloudCfg(Object.assign({}, blank, { gUser, gRepo, gToken, auto }));
      } else {
        toast('至少把一组填完整'); return;
      }
      close();
      const hasProgress = DB.sched && Object.keys(DB.sched).length > 0;
      if (hasProgress) {
        toast('已保存，正在上传…');
        setTimeout(() => cloudPush(false), 300);
      } else {
        toast('已保存，正在拉取云端数据…');
        setTimeout(() => cloudRestore(), 400);
      }
    };
  });
}

bootCards();
autoSnapshot();
applyTheme();
render();
setTimeout(checkRemind, 3000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { autoSnapshot(); checkRemind(); }
});
window.addEventListener('beforeunload', () => { try { autoSnapshot(); } catch (e) {} });

/* Service Worker：让它可以真正离线打开 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
