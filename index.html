<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="饼干">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffeaf2">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>饼干 · 公式卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fff7f9; --card:#ffffff; --card2:#fff0f5; --line:#ffdce7;
  --txt:#4a3340; --sub:#9c7a89; --dim:#c5a7b4;
  --blue:#ff6fa5; --pink:#ff6fa5; --pink-d:#ea4a86; --pink-soft:#fff0f5;
  --green:#22b887; --red:#f0516d; --amber:#ff9f2e;
  --radius:20px;
}
html,body{height:100%;}
body{
  background:linear-gradient(180deg,#ffeaf2 0%,#fff7f9 34%,#fff7f9 100%);
  background-attachment:fixed;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  user-select:none;
}
#app{
  max-width:560px; margin:0 auto; min-height:100%;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(76px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; font-size:inherit;}
input{font-family:inherit;}

/* ---------- 顶栏 ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; min-height:32px;}
.topbar .back{display:flex; align-items:center; gap:6px; color:var(--sub); font-size:15px; padding:4px 2px;}
.topbar .back svg{width:18px;height:18px;}
.topbar .title{font-size:15px; font-weight:600; color:var(--sub); letter-spacing:.5px;}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);}
.icon-btn svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ---------- 首页 ---------- */
.brand{display:flex; align-items:center; gap:12px; margin:2px 0 20px;}
.brand img{width:54px; height:54px; border-radius:18px; object-fit:cover;
  box-shadow:0 6px 18px rgba(255,111,165,.28); border:2px solid #fff;}
.brand-name{font-size:18px; font-weight:700; letter-spacing:.5px;}
.brand-sub{font-size:11.5px; color:var(--dim); margin-top:3px; letter-spacing:.8px;}
.hero{padding:12px 0 22px;}
.hero h1{font-size:27px; font-weight:700; letter-spacing:-.5px; line-height:1.3;}
.hero h1 em{font-style:normal; color:var(--blue);}
.hero p{color:var(--sub); font-size:14px; margin-top:8px; line-height:1.6;}

.stat-row{display:flex; gap:10px; margin-bottom:18px;}
.stat-box{
  flex:1; background:var(--card); border-radius:var(--radius);
  padding:14px 12px; border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(255,111,165,.09);
}
.stat-box .n{font-size:23px; font-weight:700; letter-spacing:-.5px;}
.stat-box .l{font-size:11.5px; color:var(--dim); margin-top:4px; letter-spacing:.3px;}

.sec-label{font-size:12px; color:var(--dim); letter-spacing:1.5px; margin:6px 0 10px; font-weight:600;}

.mode-card{
  display:flex; align-items:center; gap:14px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px; margin-bottom:11px; width:100%; text-align:left;
  transition:.15s; position:relative; overflow:hidden;
  box-shadow:0 4px 16px rgba(255,111,165,.09);
}
.mode-card:active{transform:scale(.985); background:var(--pink-soft);}
.mode-card .ico{
  width:48px;height:48px;border-radius:15px;flex-shrink:0;overflow:hidden;
  background:var(--card); border:1.5px solid var(--line);
  box-shadow:0 3px 10px rgba(255,111,165,.16);
  display:grid; place-items:center;
}
.mode-card .ico img{width:100%; height:100%; object-fit:cover; display:block;}
.mode-card .ico.grid4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1px; background:var(--line);}
.mode-card .ico.grid4 img{border-radius:0;}
.mode-card .body{flex:1; min-width:0;}
.mode-card .body b{font-size:16px; font-weight:600; display:block;}
.mode-card .body span{font-size:12.5px; color:var(--sub); display:block; margin-top:3px;}
.mode-card .cnt{font-size:12px; color:var(--dim); text-align:right; flex-shrink:0;}
.mode-card .cnt b{display:block; font-size:17px; color:var(--txt); font-weight:600;}

.quick-row{display:flex; gap:10px; margin-top:16px;}
.quick-btn{
  flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:.15s;
}
.quick-btn:active{background:var(--card2); transform:scale(.97);}
.quick-btn svg{width:20px;height:20px;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.quick-btn span{font-size:12px; color:var(--sub);}
.tip{margin-top:auto; padding-top:22px; font-size:11.5px; color:var(--dim); line-height:1.7; text-align:center;}

/* ---------- 答题页 ---------- */
.qwrap{flex:1; display:flex; flex-direction:column;}
.progress-bar{height:6px; background:var(--trace); border-radius:3px; overflow:hidden; margin-bottom:16px;}
.progress-bar i{display:block; height:100%; background:linear-gradient(90deg,#ffa8cb,#ff5f9c); border-radius:3px; transition:width .3s;}

.qmeta{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:12.5px; color:var(--dim);}
.qmeta .tag{background:var(--card2); padding:4px 10px; border-radius:20px; color:var(--sub); font-size:11.5px; letter-spacing:.3px;}
.streak{color:var(--amber); font-weight:600;}

.qcard{flex:1; display:flex; flex-direction:column; justify-content:center; padding:10px 0 0;}
.qtext{
  font-size:clamp(24px,7vw,34px); font-weight:600; line-height:1.5;
  letter-spacing:-.3px; word-break:break-word;
}
.qtext.small{font-size:clamp(18px,4.6vw,21px); line-height:1.65; font-weight:500;}
.qtext .hl{color:var(--blue);}

/* 输入区 */
.answer-area{margin-top:auto; padding-top:28px;}
.input-line{display:flex; align-items:center; gap:10px; border-bottom:2px solid var(--line); padding-bottom:10px; transition:.2s;}
.input-line.focus{border-color:var(--blue);}
.input-line input{
  flex:1; background:none; border:none; outline:none; color:var(--txt);
  font-size:30px; font-weight:600; text-align:center; width:100%; padding:4px 0;
  letter-spacing:1px; user-select:text;
}
.input-line input::placeholder{color:var(--dim); font-weight:400; font-size:20px; letter-spacing:0;}
.input-line .unit{font-size:20px; color:var(--sub); font-weight:600; flex-shrink:0;}

.options{display:flex; flex-direction:column; gap:10px;}
.opt{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:var(--card); border:1.5px solid var(--line); border-radius:14px;
  padding:15px 16px; font-size:15.5px; line-height:1.5; transition:.16s;
}
.opt:active{background:var(--card2);}
.opt .key{
  width:24px;height:24px;border-radius:7px;background:var(--card2);color:var(--sub);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;flex-shrink:0;
}
.opt.correct{border-color:var(--green); background:#eefaf5;}
.opt.correct .key{background:var(--green); color:#fff;}
.opt.wrong{border-color:var(--red); background:#fff0f3;}
.opt.wrong .key{background:var(--red); color:#fff;}
.opt.locked{pointer-events:none;}

.btn-main{
  width:100%; height:52px; border-radius:16px;
  background:linear-gradient(135deg,#ff8ebc,#ff5f9c); color:#fff;
  font-size:16px; font-weight:600; margin-top:14px; transition:.15s;
  display:grid; place-items:center; letter-spacing:.5px;
  box-shadow:0 8px 20px rgba(255,95,156,.28);
}
.btn-main:active{transform:scale(.98); opacity:.92;}
.btn-main:disabled{background:var(--card2); color:var(--dim); box-shadow:none;}
.btn-main.green{background:linear-gradient(135deg,#4fd8a4,#22b887); box-shadow:0 8px 20px rgba(34,184,135,.24); color:#fff;}

/* 反馈卡 */
.feedback{
  margin-top:16px; border-radius:14px; padding:15px 16px;
  border:1px solid var(--line); background:var(--card);
  animation:pop .22s ease-out;
}
@keyframes pop{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}
.feedback.ok{border-color:rgba(34,184,135,.35); background:#eefaf5;}
.feedback.no{border-color:rgba(240,81,109,.3); background:#fff0f3;}
.fb-head{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin-bottom:8px;}
.feedback.ok .fb-head{color:var(--green);}
.feedback.no .fb-head{color:var(--red);}
.fb-ans{font-size:14px; color:var(--txt); margin-bottom:8px;}
.fb-ans b{color:var(--blue); font-size:16px;}
.fb-tip{font-size:13px; color:var(--sub); line-height:1.75;}

/* ---------- 列表页 ---------- */
.list-item{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 15px; margin-bottom:10px;
}
.list-item .q{font-size:15px; line-height:1.55; margin-bottom:8px;}
.list-item .a{font-size:13px; color:var(--green); line-height:1.6;}
.list-item .a b{color:var(--green);}
.list-item .t{font-size:12.5px; color:var(--dim); margin-top:7px; line-height:1.65;}
.list-item .meta{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
.chip{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--card2); color:var(--dim);}
.chip.r{background:rgba(255,95,109,.13); color:var(--red);}
.empty{text-align:center; color:var(--dim); font-size:14px; padding:60px 20px; line-height:1.8;}

/* ---------- 结算 ---------- */
.result{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;}
.result .big{font-size:64px; font-weight:700; letter-spacing:-2px; line-height:1;}
.result .big small{font-size:24px; color:var(--sub); font-weight:600; letter-spacing:0;}
.result .desc{color:var(--sub); font-size:14px; margin-top:8px;}
.result-stats{display:flex; gap:26px; margin:28px 0 6px;}
.result-stats div{text-align:center;}
.result-stats .n{font-size:21px; font-weight:700;}
.result-stats .l{font-size:11.5px; color:var(--dim); margin-top:4px;}

.streak-fire{font-size:15px; color:var(--amber); font-weight:600; margin-top:6px;}

/* ---------- 卡片学习 ---------- */
.study{flex:1; display:flex; flex-direction:column; min-height:calc(100vh - 150px);}
.study-bar{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.pbar{flex:1; height:5px; background:var(--trace); border-radius:3px; overflow:hidden;}
.pbar i{display:block; height:100%; background:linear-gradient(90deg,#ffa8cb,#ff5f9c); border-radius:3px; transition:width .3s;}
.study-bar .cnt{font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap;}
.timer{height:3px; background:var(--trace); border-radius:2px; overflow:hidden; margin-bottom:13px;}
.timer i{display:block; height:100%; background:#ffb9d3; border-radius:2px; transition:width .12s linear;}
.timer i.low{background:var(--red);}

.stage{flex:1; position:relative; perspective:1400px; min-height:320px;}
.flip{position:absolute; inset:0;}
.flip-inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .48s cubic-bezier(.22,.9,.25,1);}
.flip.on .flip-inner{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1px solid var(--line); border-radius:22px; padding:24px 20px;
  display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
  box-shadow:0 8px 28px rgba(255,111,165,.10);
}
.face.back{transform:rotateY(180deg);}
.face .ftag{
  display:inline-block; font-size:11px; color:var(--sub); background:var(--pink-soft);
  border:1px solid var(--line); padding:3px 9px; border-radius:20px; margin-bottom:16px; align-self:flex-start;
}
.face .fq{font-size:clamp(19px,5vw,23px); font-weight:600; line-height:1.6; letter-spacing:-.2px;}
.face .fhint{margin-top:auto; padding-top:18px; font-size:12px; color:var(--dim); text-align:center; letter-spacing:.6px;}
.face .fa{font-size:clamp(18px,4.8vw,22px); font-weight:700; line-height:1.65; color:var(--pink-d);}
.face .fnote{margin-top:14px; font-size:13.5px; color:var(--sub); line-height:1.85;}
.face .ftrap{
  margin-top:14px; padding:11px 13px; border-radius:12px; background:#fff5f7;
  border-left:3px solid var(--red); font-size:12.5px; color:#8a4a58; line-height:1.75;
}
.face .fsrc{margin-top:auto; padding-top:14px; font-size:11px; color:var(--dim);}

.rates{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;}
.rate{
  padding:11px 3px; border-radius:14px; background:var(--card); border:1.5px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:3px; transition:.12s;
}
.rate:active{transform:scale(.95);}
.rate b{font-size:13.5px; font-weight:700;}
.rate span{font-size:10px; color:var(--dim);}
.rate[data-g="1"]{border-color:#ffc9d4; color:#e0455f;}
.rate[data-g="2"]{border-color:#ffe0b8; color:#d98200;}
.rate[data-g="3"]{border-color:#ffd9e4; color:var(--sub);}
.rate[data-g="4"]{border-color:#b7e3d1; color:#0f9d6c;}

/* 卡片列表行 */
.crow{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:14px 15px; width:100%; text-align:left; transition:.15s;
  box-shadow:0 4px 14px rgba(255,111,165,.07);
}
.crow:active{background:var(--pink-soft); transform:scale(.99);}
.crow .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.crow .g{flex:1; min-width:0;}
.crow .g b{font-size:14.5px; font-weight:600; display:block;}
.crow .g span{font-size:11.5px; color:var(--dim); margin-top:3px; display:block;}
.crow .r{text-align:right; white-space:nowrap;}
.crow .r .n{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
.crow .r .l{font-size:10.5px; color:var(--dim); margin-top:2px;}

/* 弹层 */
.sheet-mask{position:fixed; inset:0; background:rgba(74,51,64,.34); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .18s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%; max-width:560px; background:var(--card); border-radius:22px 22px 0 0;
  padding:20px 18px calc(76px + env(safe-area-inset-bottom)); max-height:84vh; overflow-y:auto;
  animation:upIn .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes upIn{from{transform:translateY(30px); opacity:.5}to{transform:translateY(0); opacity:1}}
.sheet h3{font-size:17px; font-weight:700; margin-bottom:5px;}
.sheet .sdesc{font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:16px;}
.field{margin-bottom:13px;}
.field label{font-size:12px; color:var(--sub); display:block; margin-bottom:6px;}
.field input,.field textarea,.field select{
  width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px;
  font-size:14px; background:var(--pink-soft); outline:none; user-select:text;
}
.field input:focus,.field textarea:focus{border-color:var(--pink); background:var(--card);}
.field textarea{min-height:92px; resize:vertical; line-height:1.6; font-size:13px;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:7px 13px; border-radius:20px; border:1.5px solid var(--line); background:var(--card); font-size:13px; color:var(--sub);}
.chip.on{border-color:var(--pink); background:var(--pink-soft); color:var(--pink-d); font-weight:600;}

.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  background:rgba(74,51,64,.93); color:#fff; font-size:13.5px; padding:11px 18px;
  border-radius:12px; z-index:200; animation:fadeIn .18s; white-space:nowrap; max-width:86vw;
}

/* LaTeX */
.frac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 2px; font-size:.86em; line-height:1.16;}
.frac b{border-bottom:1.3px solid currentColor; padding:0 4px; font-weight:inherit;}
.frac i{font-style:normal; padding:0 4px;}
sup{font-size:.7em; vertical-align:super; line-height:0;}
sub{font-size:.7em; vertical-align:sub; line-height:0;}

.rq{flex:1; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:10px 4px; text-align:center;}
.rq b{display:block; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;}
.rq span{font-size:10.5px; color:var(--dim);}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 18px rgba(255,111,165,.07);
}
.tabbar .in{max-width:560px; margin:0 auto; display:flex; height:56px;}
.tabbar button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--dim); transition:.15s;
}
.tabbar button.on{color:var(--pink-d);}
.tabbar svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.tabbar span{font-size:10px; letter-spacing:.3px;}

/* ---------- 分段控件 ---------- */
.seg{display:flex; gap:6px; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:4px;}
.seg button{flex:1; padding:8px 6px; border-radius:9px; font-size:12.5px; color:var(--sub);}
.seg button.on{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.06);}

/* ---------- 搜索 ---------- */
.search{
  display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line);
  border-radius:13px; padding:11px 13px; margin-bottom:12px;
}
.search svg{width:17px; height:17px; stroke:var(--dim); fill:none; stroke-width:2; stroke-linecap:round;}
.search input{flex:1; border:none; outline:none; background:none; font-size:14px; color:var(--ink); user-select:text;}
.search input::placeholder{color:var(--dim);}

/* ---------- 卡片条目 ---------- */
.citem{
  background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 13px;
  margin-bottom:8px; display:flex; align-items:flex-start; gap:10px;
}
.citem .box{
  width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line);
  flex-shrink:0; margin-top:1px; display:grid; place-items:center; font-size:12px; color:#fff;
}
.citem .box.on{background:var(--pink); border-color:var(--pink);}
.citem .body{flex:1; min-width:0;}
.citem .f{font-size:13.5px; line-height:1.55; color:var(--ink);}
.citem .b{font-size:12px; color:var(--sub); margin-top:3px; line-height:1.5;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;}
.citem .m{font-size:10.5px; color:var(--dim); margin-top:5px;}

/* ---------- 柱状图 ---------- */
.chart{display:flex; align-items:flex-end; gap:4px; height:112px; padding:12px 10px 8px;
  background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
.chart .col{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  gap:3px; justify-content:flex-end; height:100%; overflow:hidden;}
.chart .col i{width:100%; border-radius:4px 4px 2px 2px; min-height:3px; transition:height .4s;}
.chart .col i.zero{background:var(--trace);}
.chart .col u{font-size:9px; color:var(--dim); text-decoration:none;
  white-space:nowrap; line-height:1; height:10px; overflow:hidden;}

/* ---------- 热力图 ---------- */
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 1fr); gap:3px;}
.heat i{width:100%; aspect-ratio:1; border-radius:2.5px; background:var(--trace);}
.heat i.l1{background:#ffdcea;}
.heat i.l2{background:#ffb0cd;}
.heat i.l3{background:#ff85ae;}
.heat i.l4{background:#f0558c;}
.legend{display:flex; align-items:center; gap:5px; justify-content:flex-end; margin-top:8px; font-size:10px; color:var(--dim);}
.legend i{width:10px; height:10px; border-radius:2px; display:block;}

/* ---------- 统计条 ---------- */
.statline{display:flex; align-items:center; gap:9px; margin-bottom:11px;}
.statline .nm{font-size:12.5px; color:var(--sub); width:66px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.statline .pb{flex:1; height:7px; background:var(--trace); border-radius:4px; overflow:hidden;}
.statline .pb i{display:block; height:100%; background:linear-gradient(90deg,#ffa8cb,#ff5f9c); border-radius:4px;}
.statline .vl{font-size:11px; color:var(--dim); width:44px; text-align:right; flex-shrink:0;}

/* ---------- 设置行 ---------- */
.setrow{
  display:flex; align-items:center; gap:12px; background:var(--card);
  border:1px solid var(--line); padding:13px 14px;
}
.setrow + .setrow{border-top:none;}
.setrow:first-child{border-radius:14px 14px 0 0;}
.setrow:last-child{border-radius:0 0 14px 14px;}
.setrow:only-child{border-radius:14px;}
.setrow .g{flex:1; min-width:0;}
.setrow .g b{font-size:14px; font-weight:600; display:block;}
.setrow .g span{font-size:11px; color:var(--dim); display:block; margin-top:2px;}
.switch{
  width:44px; height:26px; border-radius:13px; background:var(--trace); position:relative;
  transition:.2s; flex-shrink:0;
}
.switch i{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--card); transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.15);}
.switch.on{background:var(--pink);}
.switch.on i{left:21px;}
.qsel{
  background:var(--pink-soft); border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; font-size:13px; color:var(--ink); outline:none; flex-shrink:0;
}

/* ---------- 深色主题 ---------- */
[data-theme="dark"]{
  --bg:#111214; --card:#1a1c20; --card2:#212429; --line:#2b2f36;
  --txt:#e7e9ee; --sub:#9aa1ad; --dim:#6d7480;
  --blue:#ff7fae; --pink:#ff7fae; --pink-d:#ff9cc2; --pink-soft:#241b21;
  --green:#3ddc97; --red:#ff6b81; --amber:#ffb84d;
  --trace:#272b32;
}
[data-theme="dark"] body{background:#111214;}
[data-theme="dark"] .face, [data-theme="dark"] .crow, [data-theme="dark"] .citem,
[data-theme="dark"] .stat-box, [data-theme="dark"] .rq, [data-theme="dark"] .opt,
[data-theme="dark"] .search, [data-theme="dark"] .setrow{background:var(--card);}
[data-theme="dark"] .feedback.ok{background:#16251f; border-color:#26503f;}
[data-theme="dark"] .feedback.no{background:#271a1d; border-color:#5a2b32;}
[data-theme="dark"] .ftrap{background:#271a1d; color:#e0b4bc;}
[data-theme="dark"] .opt.correct{background:#16251f; border-color:#26503f;}
[data-theme="dark"] .opt.wrong{background:#271a1d; border-color:#5a2b32;}
[data-theme="dark"] .tabbar{box-shadow:0 -2px 18px rgba(0,0,0,.4);}
[data-theme="dark"] .switch i{background:#e7e9ee;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =======================================================================
   题库说明（想加题就改这里，格式照抄即可）
   -----------------------------------------------------------------------
   CALC  : 资料分析，type:'num' 表示填数字，ans 是数字，tol 是允许误差
   COMMON: 常识判断，options 四选一，ans 是正确项下标（0 开始）
   ======================================================================= */
/* ---------------- 资料分析 · 固定题库 ---------------- */
const calcBank = [
  // ===== 百化分必背 =====
  {id:'k01',type:'num',q:'1/6 ≈ ？%',ans:16.7,tol:.16,unit:'%',tag:'百化分',tip:'1/6 ≈ 16.7%，1/12 ≈ 8.3%，1/18 ≈ 5.6%，三个一起记。'},
  {id:'k02',type:'num',q:'1/7 ≈ ？%',ans:14.3,tol:.16,unit:'%',tag:'百化分',tip:'1/7 ≈ 14.3%。由此推：2/7≈28.6%，3/7≈42.9%，4/7≈57.1%，5/7≈71.4%，6/7≈85.7%（每次加 14.3%）。'},
  {id:'k03',type:'num',q:'1/8 = ？%',ans:12.5,tol:.01,unit:'%',tag:'百化分',tip:'1/8 = 12.5% 是精确值，1/16 = 6.25%，1/32 = 3.125%，一路除以 2 即可。'},
  {id:'k04',type:'num',q:'1/9 ≈ ？%',ans:11.1,tol:.16,unit:'%',tag:'百化分',tip:'1/9 ≈ 11.1%，1/11 ≈ 9.1%，注意别记反。'},
  {id:'k05',type:'num',q:'1/11 ≈ ？%',ans:9.1,tol:.16,unit:'%',tag:'百化分',tip:'1/11 ≈ 9.1%。推导：2/11≈18.2%，3/11≈27.3%，4/11≈36.4%，每次加 9.1%。'},
  {id:'k06',type:'num',q:'1/13 ≈ ？%',ans:7.7,tol:.16,unit:'%',tag:'百化分',tip:'1/13 ≈ 7.7%，1/14 ≈ 7.1%，1/15 ≈ 6.7%，1/16 = 6.25%，从 7.7 递减，记住这一个区间。'},
  {id:'k07',type:'num',q:'1/16 = ？%',ans:6.25,tol:.01,unit:'%',tag:'百化分',tip:'1/16 = 6.25% 是精确值。见到 6.25% 立刻换成 1/16。'},
  {id:'k08',type:'num',q:'1/17 ≈ ？%',ans:5.9,tol:.16,unit:'%',tag:'百化分',tip:'1/17 ≈ 5.9%，1/18 ≈ 5.6%，1/19 ≈ 5.3%，1/20 = 5%，这一串都在 5% 附近。'},
  {id:'k09',type:'num',q:'7/8 = ？%',ans:87.5,tol:.01,unit:'%',tag:'百化分',tip:'7/8 = 87.5%。常用：1/8=12.5%、3/8=37.5%、5/8=62.5%、7/8=87.5%，都是 12.5 的倍数。'},
  {id:'k10',type:'num',q:'2/3 ≈ ？%',ans:66.7,tol:.16,unit:'%',tag:'百化分',tip:'2/3 ≈ 66.7%，1/3 ≈ 33.3%。除不尽的三分之一族。'},
  {id:'k11',type:'num',q:'15% ≈ 1/？（保留两位小数）',ans:6.67,tol:.04,unit:'',tag:'百分数化分数',tip:'15% ≈ 1/6.67。实际考试中 14.3%≈1/7、16.7%≈1/6，15% 夹在中间，可近似取 1/6.5 估算。'},
  {id:'k12',type:'num',q:'12.5% ≈ 1/？',ans:8,tol:0,unit:'',tag:'百分数化分数',tip:'12.5% = 1/8。百分数化分数是速算的核心动作，看到百分数先想能不能变成 1/n。'},

  // ===== 平方数与常用近似 =====
  {id:'k13',type:'num',q:'13² = ？',ans:169,tol:0,unit:'',tag:'平方数',tip:'11²=121 12²=144 13²=169 14²=196 15²=225 16²=256 17²=289 18²=324 19²=361。'},
  {id:'k14',type:'num',q:'17² = ？',ans:289,tol:0,unit:'',tag:'平方数',tip:'17²=289，18²=324，19²=361。20 以内的平方要能秒答。'},
  {id:'k15',type:'num',q:'23² = ？',ans:529,tol:0,unit:'',tag:'平方数',tip:'23²=529，24²=576，25²=625，26²=676，27²=729，28²=784。'},
  {id:'k16',type:'num',q:'1.1² ≈ ？',ans:1.21,tol:.01,unit:'',tag:'平方数',tip:'1.1²=1.21，1.2²=1.44，1.3²=1.69。增长率连乘时经常用到。'},

  // ===== 核心公式 =====
  {id:'k17',type:'choice',q:'增长率的计算公式是？',options:['增长量 ÷ 基期量','增长量 ÷ 现期量','现期量 ÷ 基期量','现期量 − 基期量'],ans:0,tag:'公式',tip:'增长率 = 增长量 ÷ 基期量 =（现期 − 基期）÷ 基期。<b>分母是基期</b>，这是最高频的送分点也是最高频的送命点。'},
  {id:'k18',type:'choice',q:'已知现期量和增长率，求基期量，正确算式是？',options:['现期量 ÷（1 + 增长率）','现期量 ×（1 + 增长率）','现期量 ÷（1 − 增长率）','现期量 ×（1 − 增长率）'],ans:0,tag:'公式',tip:'基期 = 现期 ÷ (1+r)。增长用除不乘，这是"化除为乘"技巧的出发点：÷(1+r) 常可近似为 ×(1−r)。'},
  {id:'k19',type:'choice',q:'隔年增长率的正确算式是？（r₁、r₂ 为连续两年增长率）',options:['r₁ + r₂','r₁ + r₂ + r₁r₂','r₁ + r₂ − r₁r₂','(r₁ + r₂) ÷ 2'],ans:1,tag:'公式',tip:'隔年增长率 = r₁ + r₂ + r₁r₂。第三项 r₁r₂ 是小量但常考，两个 10% 就能贡献 1 个百分点。'},
  {id:'k20',type:'choice',q:'已知现期量 A 和增长率 r，求增长量，正确算式是？',options:['A × r','A × r ÷ (1 + r)','A ÷ (1 + r)','A × (1 + r)'],ans:1,tag:'公式',tip:'增长量 = 现期 × r/(1+r)。当 r 能化成 1/n 时：增长量 = 现期 ÷ (n+1)，一步出答案，这是百化分最实用的场景。'},
  {id:'k21',type:'choice',q:'某部分增长 12%，整体增长 8%，则该部分占整体的比重会？',options:['上升','下降','不变','无法判断'],ans:0,tag:'公式',tip:'<b>部分增速 > 整体增速 ⇒ 比重上升</b>；反之下降；相等则不变。判断比重升降根本不用算，比较两个增长率即可。'},
  {id:'k22',type:'choice',q:'平均数的增长率，与总量增长率 a、份数增长率 b 的关系是？',options:['a − b','a + b','(a − b) ÷ (1 + b)','(a + b) ÷ (1 + a)'],ans:2,tag:'公式',tip:'平均数增长率 =（a − b）÷（1 + b）。同理比重差 = 现期比重 ×（a−b）÷（1+a）。两个公式长得像，分母跟着"分子指标"走。'},
  {id:'k23',type:'choice',q:'某指标 2018 年为 100，2023 年为 161，年均增长率与下列哪一项最接近？',options:['约 10%','约 12%','约 15%','约 8%'],ans:0,tag:'公式',tip:'年均增长率 = （末期/初期）^(1/n) − 1，n 是<b>年份差</b>（2023−2018=5 年）。1.61 开 5 次方 ≈ 1.10，即年均约 10%。'},
  {id:'k24',type:'choice',q:'"A 比 B 高 20 个百分点"，正确理解是？',options:['A 的增长率比 B 高 20%','A、B 两个百分数直接相减得 20','A 是 B 的 1.2 倍','A 比 B 多 20%'],ans:1,tag:'公式',tip:'百分点就是两个百分数<b>直接相减</b>的结果，不涉及除法。例如 45% 与 25%，相差 20 个百分点；而"多 20%"是 25%×1.2=30%。'},
  {id:'k25',type:'choice',q:'A 是 B 的 1.5 倍，则 A 比 B 多多少？',options:['150%','50%','0.5%','33%'],ans:1,tag:'公式',tip:'"是 n 倍"对应增长率 (n−1)×100%。1.5 倍 ⇒ 多 50%；2 倍 ⇒ 多 100%。两者差一个字，结果差一倍。'},
  {id:'k26',type:'choice',q:'资料分析中"翻一番"指的是？',options:['增长 100%','增长 200%','变为原来 3 倍','增长 50%'],ans:0,tag:'公式',tip:'翻一番 = 变为原来的 2 倍 = 增长 100%。翻两番 = 原来的 4 倍 = 增长 300%。'},
  {id:'k27',type:'num',q:'现期 480，增长率 20%，增长量是 ？',ans:80,tol:0.5,unit:'',tag:'公式',tip:'增长量 = 现期 × r/(1+r) = 480 × 0.2/1.2 = 80。也可用基期：480÷1.2=400，480−400=80。'},
  {id:'k28',type:'num',q:'整体 500，部分占比 30%，部分量是 ？',ans:150,tol:0.5,unit:'',tag:'公式',tip:'部分量 = 整体 × 比重 = 500 × 30% = 150。比重题本质是乘法，别想复杂。'},
  {id:'k29',type:'choice',q:'下列哪种情况，比重的变化量一定为 0？',options:['部分和整体增速都为正','部分增速等于整体增速','部分增速小于整体增速','整体增速为正'],ans:1,tag:'公式',tip:'部分增速 = 整体增速时，比重不变，变化量为 0。这是比重题里最快的排除法。'},
  {id:'k30',type:'choice',q:'增长率 5% 时，基期 = 现期 ÷ 1.05，可近似为？',options:['现期 × 0.95','现期 × 1.05','现期 ÷ 0.95','现期 × 0.9'],ans:0,tag:'技巧',tip:'化除为乘：1/(1+r) ≈ 1−r（r 较小时）。r=5% 时 1/1.05≈0.952，用 0.95 误差约 0.2%，在选项差距大时完全够用。'},
  {id:'k31',type:'choice',q:'选项为 12.5%、13.1%、13.8%、14.6% 时，最稳妥的估算策略是？',options:['直接精算到小数点后两位','用百化分和首数法估到 0.5% 以内','随便蒙一个','四舍五入到整数'],ans:1,tag:'技巧',tip:'选项间距约 0.6~0.7 个百分点，属于"选项差距小"，需要估到 0.3% 以内。方法是百化分 + 首数法，避免全面精算浪费时间。'},
  {id:'k32',type:'num',q:'增长率从 8% 降到 5%，下降了 ？ 个百分点',ans:3,tol:0.01,unit:'',tag:'公式',tip:'百分数相减用"百分点"。8% − 5% = 3 个百分点，不能说"下降了 3%"。'},
  {id:'k33',type:'choice',q:'求"基期比重"时，正确算式是？',options:['现期比重 ×（1+b）÷（1+a）','现期比重 ×（1+a）÷（1+b）','现期比重 ×（1+a−b）','现期比重 ÷（1+a+b）'],ans:0,tag:'公式',tip:'基期比重 = 现期比重 ×（1 + 整体增长率 b）÷（1 + 部分增长率 a）。记住：<b>分子配整体，分母配部分</b>，反了就全错。'},
  {id:'k34',type:'choice',q:'两期比重差的绝对值，通常？',options:['一定大于 1 个百分点','一般很小，常小于 1 个百分点','等于两个增长率之差','一定是负数'],ans:1,tag:'技巧',tip:'比重差 = 现期比重 ×（a−b）/(1+a)，因为现期比重 ≤1 且 a−b 通常不大，所以结果往往不到 1 个百分点。选项里出现"上升 8 个百分点"这类，基本可以直接排除。'},

  // ===== 速算技巧 =====
  {id:'k35',type:'choice',q:'计算 437 × 1.23 最快的估算方式是？',options:['逐位精算','437 + 437×0.2 + 437×0.03','437×1.2','437÷1.23'],ans:1,tag:'技巧',tip:'拆分法：437×1.23 = 437 + 87.4 + 13.1 ≈ 537.5。把乘数拆成 1 + 整数部分 + 零头，比竖式快且不易错。'},
  {id:'k36',type:'choice',q:'比较 3/7 与 4/9 的大小，最快的方法是？',options:['都化成小数','交叉相乘：3×9 与 4×7','通分','估到百分数'],ans:1,tag:'技巧',tip:'交叉相乘：3×9=27，4×7=28，27<28，所以 3/7 < 4/9。分数比较首选交叉相乘，零误差。'},
  {id:'k37',type:'choice',q:'分数比较中，分子分母同时加同一个正数，分数值会？',options:['变大','变小','不变','无法确定'],ans:0,tag:'技巧',tip:'真分数（<1）分子分母同加一个正数会<b>变大</b>，假分数会变小，都朝 1 靠拢。这个性质常用来秒杀"增长率比较"。'},
  {id:'k38',type:'num',q:'1/13 + 2/13 + 3/13 ≈ ？%',ans:46.15,tol:.5,unit:'%',tag:'百化分',tip:'(1+2+3)/13 = 6/13 ≈ 46.2%。同分母先合并分子，一次百化分解决。'},
  {id:'k39',type:'num',q:'某数增长 25% 后又下降 20%，最终比原数 ？% （填变化，上升为正）',ans:0,tol:.2,unit:'%',tag:'技巧',tip:'1.25 × 0.8 = 1.00，回到原点。增长率不能直接相加减，必须用乘法连乘。'},
  {id:'k40',type:'num',q:'增长 10% 再增长 10%，累计增长约 ？%',ans:21,tol:.15,unit:'%',tag:'技巧',tip:'1.1×1.1=1.21，累计增长 21%，不是 20%。多出来的 1% 就是两个 10% 相乘。'}  ,
  {id:'k41',type:'choice',q:'2019 年某值 100，2024 年 161，年均增长率约为？',options:['10%','12%','15%','8%'],ans:0,tag:'年均增长',tip:'年均增长率 =（末期/初期）^(1/n) − 1，n 是<b>年份差</b>（2019→2024 是 5 年，不是 6）。1.61 开 5 次方 ≈ 1.10，即 10%。'},
  {id:'k42',type:'choice',q:'整体增速 8%，其中 A 部分增速 12%、B 部分增速 5%，则整体增速？',options:['一定等于 8.5%','介于 5% 和 12% 之间，偏向基期量大的','等于两者平均','大于 12%'],ans:1,tag:'混合增长',tip:'混合增长率永远介于两个部分之间，并且更靠近基期量大的那一方。这类题只比较、不计算。'},
  {id:'k43',type:'num',q:'某指标连续两年增长 10% 和 20%，两年后的量是原来的 ？ 倍（保留两位）',ans:1.32,tol:0.01,unit:'',tag:'间隔倍数',tip:'1.1 × 1.2 = 1.32 倍。间隔倍数 = 1 + 隔年增长率 = 1 + (10%+20%+2%) = 1.32。'},
  {id:'k44',type:'choice',q:'基期比重 = ？（a 为部分增速，b 为整体增速）',options:['现期比重 ×(1+b)/(1+a)','现期比重 ×(1+a)/(1+b)','现期比重 ×(a−b)','现期比重 ÷(1+a)'],ans:0,tag:'比重',tip:'基期比重 = 现期比重 × (1+b)/(1+a)。口诀：<b>分子配整体，分母配部分</b>。'},
  {id:'k45',type:'choice',q:'总量增长 10%，份数增长 6%，则平均数增长率？',options:['约 4%','约 3.8%','约 16%','约 10%'],ans:1,tag:'平均数',tip:'平均数增长率 =（a−b）÷（1+b）=（10%−6%）÷1.06 ≈ 3.8%。不是简单的 4%，分母要加 1。'},
  {id:'k46',type:'choice',q:'部分增速 15%，整体增速 8%，两期比重差通常？',options:['上升，且不到 1 个百分点','上升，超过 5 个百分点','下降','不变'],ans:0,tag:'比重',tip:'a>b 则比重上升；比重差 = 现期比重×(a−b)/(1+a)，结果通常不到 1 个百分点。选项里出现“上升 8 个百分点”可直接排除。'},
  {id:'k47',type:'choice',q:'“翻两番”相当于增长了多少？',options:['200%','300%','400%','100%'],ans:1,tag:'基础概念',tip:'翻一番 = 2 倍 = 增长 100%；翻两番 = 4 倍 = 增长 300%。每翻一番再乘 2，1→2→4→8。'},
  {id:'k48',type:'choice',q:'比较两个指标“增长得多不多”，应该比较？',options:['增长率','增长量','现期量','基期量'],ans:1,tag:'基础概念',tip:'“增长最多”看增长量（绝对量），“增长最快”看增长率（相对量）。基数大的容易增长多，基数小的容易增长快。'},
  {id:'k49',type:'choice',q:'计算 3876 ÷ 1.23，最省时的做法是？',options:['列竖式精算','截位：3876 取 3900，1.23 取 1.2，估 3250','算到小数后两位','先乘后除'],ans:1,tag:'技巧',tip:'选项差距大时，分子分母各截两位有效数字再算：3900÷1.2 = 3250。资料分析考的是速度，不是精确度。'},
  {id:'k50',type:'choice',q:'首位法的核心是？',options:['只算第一位有效数字，比较选项首位','四舍五入到整数','先算小数点后一位','取最大数'],ans:0,tag:'技巧',tip:'选项首位数字不同时，只算结果的第一位就能选出答案。例：选项 3xxx、4xxx、5xxx，算出首位是 4 即可。'},
  {id:'k51',type:'num',q:'整体 800，部分占 35%，该部分为 ？',ans:280,tol:0.5,unit:'',tag:'比重',tip:'800 × 35% = 280。比重题就是乘法，35% 可拆成 1/3 附近快速估算。'},
  {id:'k52',type:'choice',q:'A 增速 8%，B 增速 8%，A 的基期量大于 B，则现期量？',options:['A 仍大于 B','B 反超 A','相等','无法判断'],ans:0,tag:'增长率',tip:'两者增速相同，倍数关系不变。基期大的，现期仍然大。同比例增长不会改变排序。'},
  {id:'k53',type:'num',q:'从 32% 上升到 37%，上升了 ？ 个百分点',ans:5,tol:0.01,unit:'',tag:'百分点',tip:'37% − 32% = 5 个百分点。注意不是上升 15.6%（那是用 5÷32 算的增长率）。'},
  {id:'k54',type:'choice',q:'名义增长率 6%，CPI 上涨 2%，实际增长率约为？',options:['4%','8%','3.9%','12%'],ans:2,tag:'名义增长',tip:'名义 = 实际 + CPI + 两者乘积，所以实际 ≈（1+6%）÷（1+2%）− 1 ≈ 3.9%，不是简单相减的 4%。'},
  {id:'k55',type:'num',q:'5 年间从 200 增长到 300，年均增长量是 ？',ans:20,tol:0.5,unit:'',tag:'年均增长',tip:'年均增长量 = 总增长量 ÷ 年份差 =（300−200）÷5 = 20。增长量能直接除，增长率不能。'},
  {id:'k56',type:'num',q:'连续两年分别增长 10%、10%，两年后是原来的 ？ 倍（两位小数）',ans:1.21,tol:0.01,unit:'',tag:'间隔倍数',tip:'1.1×1.1 = 1.21。累计增长 21%，不是 20%，多出的 1% 是两个 10% 相乘。'},
  {id:'k57',type:'choice',q:'部分增速小于整体增速时，该部分比重？',options:['上升','下降','不变','先升后降'],ans:1,tag:'比重',tip:'a < b ⇒ 比重下降；a > b ⇒ 上升；a = b ⇒ 不变。这是判断比重变化最快的口诀。'},
  {id:'k58',type:'num',q:'总量 600，份数 40，平均数是 ？',ans:15,tol:0.1,unit:'',tag:'平均数',tip:'平均数 = 总量 ÷ 份数 = 600÷40 = 15。平均数、比重、倍数三者算式结构相同。'},
  {id:'k59',type:'choice',q:'A 是 B 的 2.5 倍，A 比 B 多？',options:['250%','150%','125%','50%'],ans:1,tag:'倍数',tip:'多出的比例 = 倍数 − 1 = 1.5，即 150%。“是 2.5 倍”和“多 2.5 倍”差一个 100%。'},
  {id:'k60',type:'choice',q:'现期倍数 3，分子增速 10%，分母增速 4%，基期倍数约为？',options:['约 3.17','约 2.84','约 3.00','约 3.60'],ans:1,tag:'倍数',tip:'基期倍数 = 现期倍数 × (1+b)/(1+a) = 3 × 1.04/1.10 ≈ 2.84。分子涨得更快，说明是后来追上的，倒推基期时倍数要变小。'},
  {id:'k61',type:'num',q:'某值从 80 增长到 100，增长率是 ？%',ans:25,tol:0.3,unit:'%',tag:'增长率',tip:'（100−80）÷80 = 25%。分母是基期 80，不是现期 100。'},
  {id:'k62',type:'num',q:'某值下降 20%，现期为 80，基期为 ？',ans:100,tol:0.5,unit:'',tag:'基期量',tip:'基期 = 现期 ÷（1−20%）= 80 ÷ 0.8 = 100。下降时括号里是 1−r。'},
  {id:'k63',type:'choice',q:'增长率为 −15%，则现期与基期的关系是？',options:['现期 = 基期 × 0.85','现期 = 基期 × 1.15','现期 = 基期 ÷ 0.85','现期 = 基期 − 15'],ans:0,tag:'增长率',tip:'负增长时 1+r = 1−0.15 = 0.85。别写成减 15（那是减 15 个单位，不是 15%）。'},
  {id:'k64',type:'num',q:'某地 2020 年产量 500 万吨，2023 年 665.5 万吨，年均增长率约 ？% （保留一位）',ans:10,tol:0.5,unit:'%',tag:'年均增长',tip:'665.5÷500 = 1.331，开 3 次方 ≈ 1.10，年均增长约 10%。1.1³ = 1.331，正好。'},
  {id:'k65',type:'choice',q:'下列说法正确的是？',options:['增长率越大，增长量一定越大','基期量越大，增长率一定越高','增长量 = 现期 × 增长率 ÷(1+增长率)','增长率可以直接相加减'],ans:2,tag:'综合',tip:'增长量取决于基期大小和增长率两个因素，单看增长率不能判断增长量。增长率之间也不能直接加减，要用连乘。'},
  {id:'k66',type:'choice',q:'尾数法能用的前提是什么？',options:['选项差距大','必须精确计算，选项尾数不同','有除法','数字不超过两位'],ans:1,tag:'速算·尾数',tip:'尾数法本质是硬算，只适用于“必须精确”的场景：选项与材料精确到同一数位，且各选项尾数不同。差距大反而该估算，不是尾数法的条件。'},
  {id:'k67',type:'choice',q:'下列哪种运算不建议用尾数法？',options:['加法','减法','乘法','除法'],ans:3,tag:'速算·尾数',tip:'加减乘都可以用尾数，除法不行——商的末位受前面所有位影响，不是被除数末位除出来的。'},
  {id:'k68',type:'choice',q:'加减法中判断“选项差距大”，看的是？',options:['最大选项减最小选项','两个最接近选项的差 vs 列式数值的 10%','选项的位数','有没有百分号'],ans:1,tag:'速算·判断',tip:'取两个最接近的选项做差，和列式结果（首个式子的数）的 10% 比。差大于 10% 算大，可估算；小于则差距小，必须精算。'},
  {id:'k69',type:'choice',q:'乘除法判断“选项差距大”，标准是？',options:['两个接近选项相差超过 10%','两个接近选项的倍数超过 1.1 倍','选项位数不同','选项都是整数'],ans:1,tag:'速算·判断',tip:'乘除法看倍数不看差：接近选项之间超过 1.1 倍就算差距大，可以放开截两位；刚好 1.1 倍要准一点；远小于 1.1 倍只能硬算。'},
  {id:'k70',type:'choice',q:'削峰填谷法最适合什么场景？',options:['两个数相除','多个数求和或在基准值附近浮动时求平均','比较两个分数','算百分数'],ans:1,tag:'速算·基准',tip:'先选一个好算的整数当基准（别选 1740 这种难算的），各数与基准做差求和，最后加减回去。求平均时，修正值也要除以个数。'},
  {id:'k71',type:'choice',q:'直除法中，分母怎么处理？',options:['四舍五入截前两位','全部保留','截三位','取整数部分'],ans:0,tag:'速算·直除',tip:'分母四舍五入截前两位，分子截不截随意。除到几位由选项决定：首位不同只除首位，首位相同再除第二位。'},
  {id:'k72',type:'choice',q:'选项有效数字很接近（如 0.16% 与 0.2%），最该做的是？',options:['直接估算','用点点法确认数量级和单位','取平均','放弃'],ans:1,tag:'速算·点点法',tip:'有效数字接近时，差的是数量级。点点法：分子不够除分母就借 0，借 2 位是百分位、借 3 位是千分位，据此定出小数点位置。'},
  {id:'k73',type:'choice',q:'拆分法拆的是？',options:['分母','分子','两个都拆','拆选项'],ans:1,tag:'速算·拆分',tip:'拆分母没用。把分子拆成“接近分母的数 + 余数”，如 122÷129 = 100% − 7÷129 ≈ 94%。配合点点法估余数的量级。'},
  {id:'k74',type:'choice',q:'截位估算法里，分子分母都有一堆数相加，正确做法是？',options:['统一划掉后两位','分别找最大的数保留两位，其余同去同样位数','全部保留两位','只算前两个'],ans:1,tag:'速算·截位',tip:'分子、分母各自找“老大”，老大四舍五入留两位，其他数跟着老大舍掉同样的位数——关键是<b>数量级一致</b>，不是人人都留两位。'},
  {id:'k75',type:'choice',q:'特殊值法可以用在哪三类题？',options:['乘法、除法、求增长量','加法、减法、比较','任何计算','只有除法'],ans:0,tag:'速算·特殊值',tip:'乘法把百分数换成 1/N 变成除法；除法把分母换成 1/N 变成乘法；求增长量用 现期÷(N+1)。<b>加减法不能用</b>，因为有加减时整体不再是缩放关系。'},
  {id:'k76',type:'choice',q:'增长率 1.43% 求增长量，应该按哪个特殊值算？',options:['1/7','1/70，现期÷71','1/14','1/143'],ans:1,tag:'速算·特殊值',tip:'这是最容易错的地方：求增长量时<b>不能忽略百分号只看有效数字</b>。1.43% 是 1/70 量级，增长量 = 现期÷71；只有当它是 14.3% 时才是 1/7。'},
  {id:'k77',type:'choice',q:'增长率 −24.9% 求增长量，公式是？',options:['现期÷4','现期÷(−3)','现期÷5','现期×(1−0.249)'],ans:1,tag:'速算·特殊值',tip:'−24.9% ≈ −1/4，代入 现期÷(N+1)，N=−4，所以是 现期÷(−3)。N 正负通用，不用背额外公式。'},
  {id:'k78',type:'choice',q:'画圈法（化除为乘）要求增长率在什么范围？',options:['任意','绝对值 10% 以内','大于 20%','必须是正数'],ans:1,tag:'速算·画圈',tip:'原理是 1/(1+r) ≈ 1−r，误差约 r²。|r|≤10% 才敢用，超过 10% 误差会大到选错。正负都行。'},
  {id:'k79',type:'choice',q:'画圈法里，分母是 (1−r) 时，现期应该怎么处理？',options:['减去 现期×r','加上 现期×r','除以 r','乘以 r'],ans:1,tag:'速算·画圈',tip:'口诀“下有正上减，下有负上加”：分母是 1−r 时，基期 = 现期×(1+r)，所以要<b>加</b>。符号跟着分母走。'},
  {id:'k80',type:'choice',q:'画圈法去百分号后，小数点怎么移？',options:['不动','往前移一位','往前移两位','往后移两位'],ans:2,tag:'速算·画圈',tip:'去掉百分号等于乘 100，为保持数值不变，小数点要往左移两位。移错一位，整个数量级就错了。'},
  {id:'k81',type:'choice',q:'8896 × 2.3% 用画圈法算，正确写法是？',options:['8896 − 180 ≈ 8716','88.96 − 180','8896 − 18','8896 + 180'],ans:0,tag:'速算·画圈',tip:'2.3% 去掉百分号是 0.023，8896×0.023 ≈ 180。必须用<b>原数</b>减：8896−180，不能拿缩小后的 88.96 去减。'},
  {id:'k82',type:'choice',q:'估算时“一大一小”指的是？',options:['分子分母都放大','乘数一个略大、一个略小，误差相互抵消','都取整','取最大值和最小值'],ans:1,tag:'速算·估算',tip:'乘法时把一个数往上取、另一个往下取，误差抵消；除法是“同大同小”，分子分母朝同一方向变。反过来就会放大误差。'},
  {id:'k83',type:'choice',q:'选项差距极小时，最稳的做法是？',options:['继续估算','长除硬算','取中间值','按 1.1 倍判断'],ans:1,tag:'速算·判断',tip:'估算都有误差，选项差距远小于 1.1 倍时只能硬算。考场上该硬算就硬算，省下的时间不够赔一个错题。'},
  {id:'k84',type:'choice',q:'等比例放缩法怎么用？',options:['分子分母同时加减一个数','分子分母按相同倍数放大缩小','只放大分母','四舍五入'],ans:1,tag:'速算·估算',tip:'先估一个倍数，让分母变成整数，分子按同样的倍数跟着变。倍数是关键，估不准就会跑偏。'},
  {id:'k85',type:'choice',q:'尾数法、拆分法、直除法三者的精度关系是？',options:['直除最准','尾数法=拆分法=直除','尾数法是精确计算，拆分较精，直除最普适但可能损精度','拆分最准'],ans:2,tag:'速算·判断',tip:'尾数法是精确硬算；拆分法精度较高；直除法最通用，但截位之后有精度损失。按选项差距选：差距大直除，差距小拆分或尾数。'},
  {id:'k86',type:'num',q:'现期 1200，增长率 20%，增长量为 ？',ans:200,tol:0.5,unit:'',tag:'增长量',tip:'增长量 = 现期×r/(1+r) = 1200×0.2/1.2 = 200。也可先求基期 1000，再相减。'},
  {id:'k87',type:'num',q:'现期 880，同比增长 10%，基期为 ？',ans:800,tol:0.5,unit:'',tag:'基期量',tip:'880÷1.1 = 800。增速 10% 时，除以 1.1 等价于乘以 10/11。'},
  {id:'k88',type:'num',q:'某地 2019 年 GDP 5000 亿，2024 年 8052 亿，年均增长率约 ？% （保留整数）',ans:10,tol:1,unit:'%',tag:'年均增长',tip:'8052÷5000 = 1.6104，开 5 次方 ≈ 1.10，年均约 10%。1.1⁵ = 1.61051，正好对上。'},
  {id:'k89',type:'choice',q:'基期比重 30%，部分增速 15%，整体增速 8%，则现期比重约为？',options:['约 31.5%','约 32%','约 28%','约 30%'],ans:1,tag:'比重',tip:'现期比重 = 基期比重 ×(1+a)/(1+b) = 30% × 1.15/1.08 ≈ 30%×1.0648 ≈ 31.9%，取最近的 32%。部分增速快于整体，比重上升。'},
  {id:'k90',type:'num',q:'整体 500，部分 175，比重是 ？%',ans:35,tol:0.1,unit:'%',tag:'比重',tip:'175÷500 = 35%。比重题先看能不能约分：175/500 = 7/20 = 35%。'},
  {id:'k91',type:'choice',q:'某指标连续两年分别增长 8% 和 −5%，两年累计增长率约为？',options:['约 2.6%','约 3%','约 −13%','约 13%'],ans:0,tag:'间隔增长',tip:'1.08 × 0.95 = 1.026，累计增长约 2.6%。一正一负不能直接相加。'},
  {id:'k92',type:'num',q:'基期 400，增长率 −20%，现期为 ？',ans:320,tol:0.5,unit:'',tag:'基期与现期',tip:'现期 = 基期×(1−20%) = 400×0.8 = 320。负增长时是乘以 0.8，不是减 20。'},
  {id:'k93',type:'choice',q:'材料给的是“2023 年 1—11 月累计值”，问“2023 年 12 月单月值”应该？',options:['直接用累计值','用全年值减 1—11 月累计值','用累计值除以 11','无法计算'],ans:1,tag:'材料陷阱',tip:'累计口径的时间陷阱：单月值 = 全年累计 − 前期累计。直接用累计值或除以月份数都是错的。'},
  {id:'k94',type:'choice',q:'材料单位是“亿元”，选项是“万亿元”，最容易犯的错是？',options:['把亿当万','小数点位置错一位','把百分数当小数','看错年份'],ans:1,tag:'材料陷阱',tip:'1 万亿 = 10000 亿。单位换算错一位，整道题全废。做题前先圈出单位。'},
  {id:'k95',type:'choice',q:'材料说“同比增长 8%，环比增长 3%”，问今年 5 月比去年同期增长多少，应看？',options:['8%','3%','11%','5%'],ans:0,tag:'材料陷阱',tip:'同比 = 与去年同期比（8%）；环比 = 与上月比（3%）。问“比去年同期”就是同比。'},
  {id:'k96',type:'num',q:'比重从 24% 提高到 30%，提高了 ？ 个百分点',ans:6,tol:0.01,unit:'',tag:'百分点',tip:'30% − 24% = 6 个百分点。若问“涨幅”，则是 6÷24 = 25%。'},
  {id:'k97',type:'choice',q:'A 的增速 12%，B 的增速 8%，两者基期相同，则现期？',options:['A 比 B 高 4 个百分点','A 是 B 的 1.037 倍','A 比 B 多 4%','无法比较'],ans:1,tag:'增长率',tip:'基期相同时，现期倍数 = 1.12÷1.08 ≈ 1.037。增速差 4 个百分点，但现期只差约 3.7%。'},
  {id:'k98',type:'num',q:'某值增长 50% 后又下降 50%，最终是原值的 ？%',ans:75,tol:0.2,unit:'%',tag:'易错',tip:'1.5×0.5 = 0.75，只剩 75%。涨跌百分比不能相互抵消。'},
  {id:'k99',type:'choice',q:'“增长了 2 倍”和“增长到 2 倍”的区别是？',options:['完全一样','前者是原来的 3 倍，后者是 2 倍','前者是 2 倍，后者是 3 倍','都不对'],ans:1,tag:'易错',tip:'增长了 2 倍 = 增加量是原来的 2 倍 = 现在是 3 倍；增长到 2 倍 = 现在是原来的 2 倍。'},
  {id:'k100',type:'num',q:'整体 2.4 万亿，部分占 12.5%，部分为 ？ 万亿',ans:0.3,tol:0.01,unit:'',tag:'比重',tip:'2.4×12.5% = 2.4×1/8 = 0.3。12.5% 化成 1/8，除法变口算。'},
  {id:'k101',type:'choice',q:'求“基期两个量的和”，正确做法是？',options:['先求和再除以(1+r)','分别求两个基期再相加','用现期和乘以(1+r)','直接相减'],ans:1,tag:'基期与现期',tip:'两个量增速不同，必须分别除以各自的 (1+r) 再相加。只有增速相同时才能先加后除。'},
  {id:'k102',type:'num',q:'增长 20% 后再增长 25%，累计增长 ？%',ans:50,tol:0.2,unit:'%',tag:'间隔增长',tip:'1.2×1.25 = 1.5，累计增长 50%。20%+25%=45% 是错的，漏了乘积 5%。'},
  {id:'k103',type:'choice',q:'四个选项中，判断“增长最快”应该看？',options:['增长量','增长率','现期量','基期量'],ans:1,tag:'基础概念',tip:'“最快”看增长率，“最多”看增长量。这是综合分析题最常设的文字陷阱。'},
  {id:'k104',type:'num',q:'现期 660，比基期增长 10%，则基期是 ？',ans:600,tol:0.5,unit:'',tag:'基期量',tip:'660÷1.1 = 600。也可用化除为乘：660×(1−10%) = 594，误差 1%，选项差距大时可用。'},
  {id:'k105',type:'choice',q:'材料中出现“占全国的比重比上年提高 0.3 个百分点”，说明？',options:['该地区增速高于全国','该地区增速低于全国','两者增速相同','无法判断'],ans:0,tag:'比重',tip:'比重上升 ⇒ 部分增速 > 整体增速。看到“比重提高”就等价于“比全国快”。'},

  {id:'f44',type:'choice',q:'“A 比 B 高 3 个百分点”，等价于？',options:['A 比 B 高 3%','A、B 两个百分数相减等于 3','A 是 B 的 1.03 倍','B 比 A 低 3%'],ans:1,tag:'易错辨析',tip:'百分点 = 百分数直接相减；百分比 = 相对变化率。42% 与 39% 差 3 个百分点，而相对涨幅是 3/39≈7.7%。'},
  {id:'f45',type:'choice',q:'错位相加主要用于计算？',options:['×1.1、×1.2 这类','÷1.1','平方','开方'],ans:0,tag:'速算技巧',tip:'一个数×1.1 = 原数 + 原数右移一位；×1.2 加两位；×0.9 是错位相减。乘 1.x 都能这么拆。'},
  {id:'f46',type:'choice',q:'分数比较时，分子分母同加一个正数，真分数会？',options:['变大、朝 1 靠拢','变小','不变','先大后小'],ans:0,tag:'速算技巧',tip:'真分数分子分母同加正数会变大，假分数会变小，都朝 1 靠拢。这个性质能秒杀一批增长率比较题。'},
  {id:'f47',type:'choice',q:'“基期和差”指的是？',options:['两个基期量相加或相减','两个现期量差','增长率之差','比重之差'],ans:0,tag:'基期与现期',tip:'先分别求两个基期（各自÷(1+r)），再加减。不能先把现期加减再除，除非两者增速相同。'},
  {id:'f48',type:'choice',q:'“小追大、问几年追上”用哪个公式？',options:['差距 ÷ 增长量之差','差距 ÷ 增长率之差','差距 × 增速','差距 ÷ 现期'],ans:0,tag:'基期与现期',tip:'每年缩小的是“增长量之差”（绝对量），所以年数 = 现差距 ÷ 增长量之差。增长率之差不能直接用。'},
  {id:'f49',type:'choice',q:'两集合容斥中，A、B 都满足的最小值是？',options:['|A|+|B|−总数','|A|+|B|','总数−|A|','|A|−|B|'],ans:0,tag:'数量关系',tip:'要让重叠部分最小，就得让并集取满。都满足的最小值 = |A|+|B|−总数，若为负则取 0。'},
  {id:'f50',type:'choice',q:'比较两个指标的增长率大小，最稳妥的做法是？',options:['分别算出精确值','用分数比较法比较 增长量/基期','比较增长量','比较现期量'],ans:1,tag:'增长率',tip:'增长率 = 增长量 ÷ 基期，本质是分数比较。交叉相乘比精算快得多，还不容易错。'},
  {id:'f51',type:'choice',q:'现期量相同、增长率不同的两项，增长率高的意味着？',options:['基期更大','基期更小','增长量更小','没有关系'],ans:1,tag:'增长率',tip:'现期 = 基期×(1+r)，现期固定时 r 越大，基期越小。这是“现期相同比增速”题的突破口。'},
  {id:'f52',type:'choice',q:'增长率从 12% 降到 9%，可以说？',options:['下降了 3%','下降了 3 个百分点','下降了 25 个百分点','下降了 25%'],ans:1,tag:'易错辨析',tip:'百分数之间的差用“百分点”：12%−9% = 3 个百分点。若说“下降 25%”，那是相对变化（3÷12），意思完全不同。'},
  {id:'f53',type:'choice',q:'间隔增长率中，什么条件下乘积项可忽略？',options:['任一年增速绝对值 ≤10%','两年都大于 10%','只有一年为正','任何情况'],ans:0,tag:'增长率',tip:'|r|≤10% 时，r₁×r₂ 小于 1 个百分点，通常不影响选项判断，直接相加即可。'},
  {id:'f54',type:'choice',q:'“比重差一定小于 1 个百分点”这个说法？',options:['永远成立','大多数情况成立，可用于排除离谱选项','永远不成立','只在负增长时成立'],ans:1,tag:'比重',tip:'比重差 = 现期比重×(a−b)/(1+a)，因为现期比重≤1，通常很小。但 a−b 极大时也可能超过 1，所以是“大多数情况”，用来快速排除。'},
  {id:'f55',type:'choice',q:'综合分析题中，判断四个选项正误最快的顺序是？',options:['从 A 开始逐个精算','先看能靠常识和量级排除的','随机选','全部重新计算'],ans:1,tag:'综合',tip:'先用“量级、单位、正负号、是否超过 100%”这类硬伤排除，往往能干掉两三个选项，剩下的再算。'},
  {id:'f56',type:'choice',q:'平均数增长量的公式是？',options:['现期平均数 ×(a−b)/(1+b)','现期平均数 ×(a−b)','(a−b)/(1+b)','现期平均数 ×(1+b)/(1+a)'],ans:0,tag:'平均数',tip:'平均数增长量 = 现期平均数 ×(a−b)/(1+b)。去掉“现期平均数”这个因子，剩下 (a−b)/(1+b) 就是平均数<b>增长率</b>。'},
  {id:'f57',type:'choice',q:'“比重增长率”怎么求？',options:['现期比重 ÷ 基期比重 − 1','(a−b)/(1+a)','现期比重 − 基期比重','a − b'],ans:0,tag:'比重',tip:'比重增长率 = 现期比重 ÷ 该比重的基期比重 − 1。注意“比重增长量”是相减，“比重增长率”是相除再减 1，两个概念别混。'},
  {id:'f58',type:'choice',q:'“比重倍数”与“比重增长率”的关系是？',options:['相等','比重倍数 = 比重增长率 + 1','比重倍数 = 比重增长率 − 1','没有关系'],ans:1,tag:'比重',tip:'倍数 = 增长率 + 1。同一条规律在倍数、间隔倍数、比重倍数上都成立。'},
  {id:'f59',type:'choice',q:'A 对 B 的贡献率怎么算？',options:['A 的增量 ÷ B 的增量','A 的量 ÷ B 的量','A 的增速 ÷ B 的增速','A 增量 ÷ A 基期'],ans:0,tag:'基础概念',tip:'贡献率 = 部分增量 ÷ 整体增量，衡量的是“整体增长里有多少是它贡献的”。和占比（部分量÷整体量）不是一回事。'},
  {id:'f60',type:'choice',q:'增量比较中“大大则大”指的是？',options:['现期大、增长率大，则增量一定大','基期大、增长率大，则增量大','两个都大就相加','都一样'],ans:0,tag:'增长量',tip:'现期和增长率<b>同时</b>更大，增量必然更大（因为增量 = 现期×r/(1+r)，两项都占优）。一大一小时才需要百化分精算。'},
  {id:'f61',type:'choice',q:'两个指标增量相等，需要满足什么条件？',options:['现期相等即可','如果我的现期是你的 N 倍，你的增长率要在我 N 倍以上','增长率相等即可','基期相等即可'],ans:1,tag:'增长量',tip:'增量 = 现期×r/(1+r)。现期差 N 倍时，只有对方增长率大到能弥补这个差距，两者增量才可能相等。所以别看到现期大就断定增量大。'},
  {id:'f62',type:'choice',q:'“现期追赶”的公式是？',options:['现期 = 基期 ×(1+r)^t','现期 = 基期 ×(1+r)','现期 = 基期 + r×t','现期 = 基期 ÷(1+r)^t'],ans:0,tag:'基期与现期',tip:'保持年均增长率追赶，t 年后 = 基期×(1+r)^t。如果保持的是增长量，则是 基期 + 增长量×t，两种追法别混。'},
  {id:'f63',type:'choice',q:'1kg 浓度 50% 与 2kg 浓度 20% 混合，混合后浓度是？',options:['35%','30%','40%','25%'],ans:1,tag:'混合增长',tip:'混合增长率同浓度混合：总溶质 0.5+0.4=0.9，总质量 3，浓度 30%。交叉相减 (50−X)/(X−20)=2/1 也能解出 X=30。距离与质量成反比。'},
  {id:'f64',type:'choice',q:'百化分里，“6 和 16 互换”指的是？',options:['6.25% = 1/16，16.7% = 1/6','6% = 1/16','16% = 1/6','6 与 16 相加为 22'],ans:0,tag:'百化分',tip:'6.25%=1/16，16.7%=1/6，数字 6 与 16 互为分母。同理“7 和 14 互换”：14.3%=1/7，7.1%=1/14。'},
  {id:'f65',type:'choice',q:'百化分的一个记忆规律是“百分数整数部分与分母加和为”？',options:['10','20','100','不一定'],ans:1,tag:'百化分',tip:'如 10% 对应分母 10，10+10=20；9.1%≈1/11，9+11=20；7.7%≈1/13，7.7 取整 7，7+13=20。这个规律能帮你反推分母。'},
  {id:'f66',type:'choice',q:'分数比较的口诀是？',options:['分子大、分母小，分数大','分子大、分母大，分数大','分母小就一定小','交叉相乘总成立'],ans:0,tag:'速算',tip:'分子大、分母小，分数必然大。这个口诀只能定“一眼就能看出”的情况，两个方向不一致时还得交叉相乘或直除。'},
  {id:'f67',type:'choice',q:'两个分数“纵向接近”时，通常怎么比？',options:['直接直除','分母同时加减分子，不改变大小关系，可化简后比较','取倒数','相乘'],ans:1,tag:'速算',tip:'纵向接近：分母与分子数值接近，可给两边分母同加同减同一个数，大小关系不变。注意：若减出来是负数，结论要反过来。'},
  {id:'f68',type:'choice',q:'两期比重、平均数、倍数三个公式的共同点是？',options:['都是相减','分母都跟着“分母指标”的增速走','都用 (1+a)','都不需要增速'],ans:1,tag:'易混辨析',tip:'基期比重、基期平均数、基期倍数三个式子结构完全一样：(1+b)/(1+a)，b 是分母指标的增速，a 是分子指标的增速。记住“分子配分母的增速”。'},
  {id:'f69',type:'choice',q:'“乘积增长率”与“隔年增长率”的公式？',options:['都是 r₁+r₂+r₁r₂','前者是相加，后者是相乘','都等于 r₁×r₂','都等于平均'],ans:0,tag:'增长率',tip:'两个量相乘后的增长率，与连续两期增长的展开式完全一样：r = r₁+r₂+r₁r₂。比如单价×销量=总额，总额增速就是这两个增速的组合。'},
  {id:'f70',type:'choice',q:'隔年增长率里，若某一项能百化分，好处是？',options:['可以直接相加','把乘法变成好算的数，r₁×r₂ 能口算','不用管第三项','误差为零'],ans:1,tag:'百化分',tip:'如 r₁=16.7%≈1/6，那 r₁×r₂ 就变成 r₂÷6，心算即可。这是把乘积项“落地”的常用手法。'},
  {id:'f71',type:'choice',q:'“超过 3 倍”的正确表达式是？',options:['A/B > 3','A/B = 3','A−B > 3','A/B − 1 > 3'],ans:0,tag:'倍数',tip:'超过 N 倍 = A > B×N，即 A/B > N。如果是“多 3 倍”，那才是 A/B − 1 > 3，即 A > 4B。三个表述差得很远。'},
  {id:'f72',type:'choice',q:'年均增量与年均增长率的区别是？',options:['都能直接相除','年均增量能除，年均增长率要开方','都要开方','没有区别'],ans:1,tag:'增长率',tip:'年均增量 =（末期−初期）÷年份差，可以直接除；年均增长率必须开 n 次方再减 1。把增长率当增量平均，是高频错法。'},
  {id:'f73',type:'choice',q:'两期比重差和平均数增长率，公式的差别在？',options:['分子不同','一个除 (1+a)，一个除 (1+b)','一个带百分号','没有差别'],ans:1,tag:'易混辨析',tip:'比重差 = 现期比重×(a−b)/(1+a)；平均数增长率 = (a−b)/(1+b)。分子都是 a−b，分母跟着各自的分母指标走，这是最容易张冠李戴的一对。'},
  {id:'f74',type:'choice',q:'资料分析中，“增长率”和“增长量”最容易混的是？',options:['前者是绝对量，后者是比率','前者是比率（相对量），后者是绝对量','两者都是比率','两者都是绝对量'],ans:1,tag:'易错辨析',tip:'增长率 = 增长量÷基期，是相对量；增长量 = 现期−基期，是绝对量。“增长最快”比增长率，“增长最多”比增长量。'},
  {id:'f75',type:'choice',q:'材料给出“同比”和“环比”，区别在于？',options:['同比对比去年同期，环比对比上一个统计周期','完全一样','同比是月度，环比是年度','同比只用于 GDP'],ans:0,tag:'基础概念',tip:'同比 = 与去年同期比（消除季节影响）；环比 = 与紧邻的上一个周期比（月比月、季比季）。看错这两个字，整道题全废。'},
  {id:'f76',type:'choice',q:'现期比重与基期比重的关系取决于？',options:['两个增速的大小','两个量的绝对大小','现期量大小','基期量大小'],ans:0,tag:'比重',tip:'a>b 则现期比重高于基期；a<b 则低于。绝对量大小不影响比值的变化方向。'},
  {id:'f77',type:'choice',q:'两期平均数比较，判断升降看？',options:['总量增速 a 与份数增速 b','平均数的大小','总量的大小','份数的大小'],ans:0,tag:'平均数',tip:'a>b 则平均数上升。和比重升降判断的规则完全一样，只看两个增速。'},
  {id:'f78',type:'choice',q:'增长量比较时，“大大则大”的完整含义是？',options:['现期和增长率都更大，则增长量更大','现期更大即可','增长率更大即可','基期更大即可'],ans:0,tag:'增长量',tip:'增量 = 现期×r/(1+r)，现期和 r 同时更大时，两项都占优，增量必然更大。'},
  {id:'f79',type:'choice',q:'比较两个指标增长率大小，最规范的做法是？',options:['比较增长量','用 增长量/基期 做分数比较','比较现期量','比较增速的绝对值'],ans:1,tag:'增长率',tip:'增长率 = 增长量÷基期，本质是分数。用交叉相乘或直除比较，比先算百分数再比快得多。'},
  {id:'f80',type:'choice',q:'求“两个基期量的差”，正确做法是？',options:['现期差除以 (1+r)','分别求两个基期再相减','现期差乘以 (1+r)','直接用现期相减'],ans:1,tag:'基期与现期',tip:'两者增速不同时必须分别除以各自的 (1+r)，再相减。只有当两个增速相同时，才能先做差再除以 (1+r)。'},
  {id:'f81',type:'choice',q:'年均增长量的公式是？',options:['(末期−初期)÷年份差','末期÷年份差','(末期/初期)^(1/n)−1','末期−初期'],ans:0,tag:'增长率',tip:'年均增长量可以直接除；年均增长率必须开方。这是最容易混的一对。'},
  {id:'f82',type:'choice',q:'“隔年基期量”指的是？',options:['两年前的量','去年的量','明年的量','前年的增长率'],ans:0,tag:'增长率',tip:'隔年基期 = 现期 ÷ (1+隔年增长率)。常用于“2023 年比 2021 年”这类题干。'},
  {id:'f83',type:'choice',q:'用交叉相减法求混合增长率，正确的做法是？',options:['两部分增速相减','距离与对应部分的基期量成反比','两部分增速相加','取平均'],ans:1,tag:'混合增长',tip:'画十字交叉，两个增速的差被拆分，距离之比等于对应基期量之比的倒数。基期量大的那侧，整体增速更靠近它。'},
  {id:'f84',type:'choice',q:'资料分析中，读材料的第一步应该是？',options:['先看题目再回头找数','先通读材料记数据','先算第一题','先看选项'],ans:0,tag:'做题策略',tip:'先看题干问什么，带着问题回材料定位，比通读一遍再做题快得多。'},
  {id:'f85',type:'choice',q:'题干中出现“万户”“亿美元”“万吨”，最先要检查的是？',options:['单位是否统一','数据是否准确','年份是否正确','有没有百分号'],ans:0,tag:'材料陷阱',tip:'单位不一致是最高频的低级错误，尤其“亿/万”“元/美元”。做题前先圈出题干和选项的单位。'},
  {id:'f86',type:'choice',q:'材料给“1—10 月累计”，问“10 月单月”，应该？',options:['累计值除以 10','1—10 月累计 减 1—9 月累计','用全年值','用 10 月的同比'],ans:1,tag:'材料陷阱',tip:'单月值 = 本期累计 − 上期累计。这类题材料里一定同时给了两个累计值。'},
  {id:'f87',type:'choice',q:'“同比增长”与“环比增长”的区别是？',options:['同比比去年同期，环比比上一统计周期','两者相同','同比是年度，环比是月度','同比是环比的两倍'],ans:0,tag:'基础概念',tip:'同比消除季节因素影响，环比反映短期变化。看错这两个字，整题方向就反了。'},
  {id:'f88',type:'choice',q:'资料分析中的“增长贡献率”是？',options:['部分增量 ÷ 整体增量','部分量 ÷ 整体量','部分增速 ÷ 整体增速','部分基期 ÷ 整体基期'],ans:0,tag:'基础概念',tip:'贡献率用的是<b>增量</b>之比，不是量之比。占比用的是量之比。'},
  {id:'f89',type:'choice',q:'分数比较时，“横向接近”指的是？',options:['分子与分子接近、分母与分母接近','分子分母都接近','两个分数值接近','分母都很小'],ans:0,tag:'速算',tip:'横向接近时，比较分子分母各自的变化幅度。纵向接近时，可以给分母同加同减。'},
  {id:'f90',type:'choice',q:'什么时候优先用直除法而不是拆分法？',options:['选项差距大、分母好截位时','选项极接近时','有加减法时','分子很大时'],ans:0,tag:'速算',tip:'差距大用直除（快）；差距小用拆分（准）；有加减运算时特殊值法失效，要回到直除或精算。'},
  {id:'f91',type:'choice',q:'特殊值法在使用时，最需要注意的限制是？',options:['只能用于乘除和求增长量','只能用于加法','只能用于比较','没有任何限制'],ans:0,tag:'速算',tip:'特殊值法只适用于乘法、除法、求增长量三类。有加减运算时不能缩放，否则误差不可控。'},
  {id:'f92',type:'choice',q:'估算误差主要来自哪里？',options:['取整时的舍入方向不一致','计算器精度','题目数据不准','抄错数字'],ans:0,tag:'速算',tip:'乘法“一大一小”、除法“同大同小”，让误差互相抵消。全都往一个方向取整，误差会叠加。'},
  {id:'f93',type:'choice',q:'判断“选项差距大”对加减法的标准是？',options:['最接近两选项之差 > 列式值的 10%','选项相差超过 1','选项位数不同','最大减最小大于 100'],ans:0,tag:'速算',tip:'加减法看差是否超过列式数值的 10%；乘除法看接近选项的倍数是否超过 1.1 倍。两套标准不能混用。'},
  {id:'f94',type:'choice',q:'“基期比重”估算的常用技巧是？',options:['先估基期比重，再乘增速差修正','直接精算','取两个比重的平均','忽略增速'],ans:0,tag:'比重',tip:'基期比重 = 现期比重 ×(1+b)/(1+a)，可先估出大致值，再用 (b−a) 做小幅修正，避免完整除法。'},

  {id:'j20',type:'choice',q:'“脸盆∶代步车”这组词体现的构词关系是？',options:['都是偏正结构，前词修饰后词的功能或属性','都是并列结构','都是主谓结构','没有关系'],ans:0,tag:'类比·构词',tip:'洗脸盆（功能：洗脸）、代步车（功能：代步），都是“功能+中心词”的偏正结构。节能灯（属性）、蚕食/牛饮/鲸吞（动物+动作）也是偏正。'},

  // ===== 逻辑判断 =====
  {id:'j21',type:'choice',q:'“如果下雨，那么地湿”，以下等价的是？',options:['地湿说明下雨了','地不湿说明没下雨','没下雨地就不湿','下雨地一定不湿'],ans:1,tag:'逻辑·翻译',tip:'A→B 的逆否命题是 ¬B→¬A。“地不湿”即 ¬B，可推出 ¬A“没下雨”。肯定后件（地湿→下雨）是错误推理。'},
  {id:'j22',type:'choice',q:'“只有努力，才能成功”翻译为？',options:['努力→成功','成功→努力','不努力→不成功','成功→不努力'],ans:1,tag:'逻辑·翻译',tip:'“只有 A 才 B”翻译为 B→A（B 是 A 的必要条件，成功必然意味着努力过）。但努力了不一定成功，所以 A→B 是错的。'},
  {id:'j23',type:'choice',q:'“除非你道歉，否则我不原谅你”翻译为？',options:['道歉→原谅','不道歉→不原谅','原谅→道歉','不原谅→道歉'],ans:1,tag:'逻辑·翻译',tip:'“除非 A 否则 B”= ¬A→B。所以“除非你道歉否则不原谅”= 不道歉→不原谅。它等价于“原谅→道歉”。'},
  {id:'j24',type:'choice',q:'已知“所有天鹅都是白的”为假，可以推出？',options:['所有天鹅都不是白的','有的天鹅不是白的','有的天鹅是白的','天鹅都是黑的'],ans:1,tag:'逻辑·矛盾',tip:'“所有 S 都是 P”的矛盾命题是“有的 S 不是 P”。全称命题为假，只需存在一个反例，不能推出全称否定。'},
  {id:'j25',type:'choice',q:'“甲和乙都去了”的矛盾命题是？',options:['甲和乙都没去','甲或乙没去','甲去了乙没去','甲没去乙去了'],ans:1,tag:'逻辑·矛盾',tip:'“A 且 B”的矛盾是“¬A 或 ¬B”，即至少有一个没去。不是“两个都没去”，那是更强的表述。'},
  {id:'j26',type:'choice',q:'加强型题目中，“搭桥”指的是？',options:['补充一个新论据','在论据和论点之间建立联系','重复题干结论','举一个例子'],ans:1,tag:'逻辑·加强',tip:'题干论据和论点之间如果有概念跳跃，最有力的加强就是把这个跳跃补上（搭桥）。比单纯增加论据更直接。'},
  {id:'j27',type:'choice',q:'削弱型题目中，最能削弱的是？',options:['指出论据和论点话题不一致','提出一个反例','质疑数据的来源','补充一个无关事实'],ans:0,tag:'逻辑·削弱',tip:'切断论据与论点的联系（拆桥）是最强的削弱，因为它直接摧毁论证结构。单个反例只是“存在例外”，力度较弱。'},
  {id:'j28',type:'choice',q:'“科研人员发现久坐青少年抑郁评分更高，因此久坐导致抑郁”，最能质疑的是？',options:['久坐的青少年大多沉迷恐怖游戏，精神受影响','有些久坐的人没有抑郁','抑郁评分是自评的','久坐还会导致肥胖'],ans:0,tag:'逻辑·削弱',tip:'这是典型的“因果倒置/另有他因”。指出抑郁可能是游戏导致的，切断了“久坐→抑郁”的因果链，比举反例更有力。'},
  {id:'j29',type:'choice',q:'前提假设类题目，正确答案通常是？',options:['题干已经明说的内容','论证成立所必需但未明说的条件','与题干无关的背景','一个具体案例'],ans:1,tag:'逻辑·前提',tip:'前提假设是论证成立的“必要条件”：没有它，论证就垮了。可以用“否定代入法”验证——否定选项后论证不成立，就是它。'},
  {id:'j30',type:'choice',q:'“所有 A 是 B，有的 C 是 A”，可以推出？',options:['有的 C 是 B','所有 C 是 B','有的 B 不是 A','所有 B 是 C'],ans:0,tag:'逻辑·三段论',tip:'有的 C 是 A，而所有 A 都是 B，所以这些 C 一定是 B，即“有的 C 是 B”。'},
  {id:'j31',type:'choice',q:'“并非所有人都是诚实的”等价于？',options:['所有人都不诚实','有的人不诚实','有的人诚实','没有人诚实'],ans:1,tag:'逻辑·矛盾',tip:'“并非所有 S 都是 P”= “有的 S 不是 P”。注意“有的人不诚实”不等于“所有人都不诚实”。'},
  {id:'j32',type:'choice',q:'甲说“乙在说谎”，乙说“丙在说谎”，丙说“甲乙都在说谎”。若只有一人说真话，是谁？',options:['甲','乙','丙','无法确定'],ans:1,tag:'逻辑·真假话',tip:'假设乙说真话，则丙说谎；丙说谎意味着“甲乙都在说谎”为假，即至少一人说真话——与“只有一人说真话”不冲突（甲说谎、乙真）。验证：甲说“乙说谎”为假，符合。所以乙真。'},
  {id:'j33',type:'choice',q:'“如果小张去，那么小李也去”，现在小李没去，可推出？',options:['小张去了','小张没去','小张可能去','无法判断'],ans:1,tag:'逻辑·翻译',tip:'A→B，已知 ¬B（小李没去），根据逆否得 ¬A（小张没去）。否定后件可以否定前件，这是有效推理。'},
  {id:'j34',type:'choice',q:'以下哪项是“A 或 B”的等价表述？',options:['要么 A 要么 B','A、B 至少一个成立','A、B 都成立','A、B 都不成立'],ans:1,tag:'逻辑·选言',tip:'“或”是相容选言，至少一个成立即可，两个都成立也符合。“要么…要么…”是不相容选言，只能有一个。'},
  {id:'j35',type:'choice',q:'定义判断中，最需要警惕的是？',options:['定义太长','选项超出定义的主体、条件或结果范围','有多个选项相似','题干有数字'],ans:1,tag:'逻辑·定义',tip:'定义判断的关键是逐条抠“主体、目的、方式、条件、结果”，选项往往在某一个要件上偷换或缺失。'},
  {id:'j36',type:'choice',q:'“某地新能源车着火事故中乘用车占 69.6%，说明乘用车安全性低于专用车”，最能质疑的是？',options:['乘用车利润最高','专用车和公交车保有量不到总量 10%','乘用车伤亡人数少','专用车司机驾龄长'],ans:1,tag:'逻辑·削弱',tip:'这是“比例基数”陷阱：着火占比高，可能是因为保有量本身大。指出专用车保有量极低，直接击穿结论。'},
  {id:'j37',type:'choice',q:'归因论证中，削弱“A 导致 B”的常见方式是？',options:['指出 B 导致了 A','重复 A 和 B 同时发生','说明 A 很重要','举出 A 的例子'],ans:0,tag:'逻辑·削弱',tip:'因果倒置（B 导致 A）是归因论证最有力的削弱方式之一，另有他因、切断因果链也是常用手段。'},
  {id:'j38',type:'choice',q:'“绝大多数人支持该政策，所以政策是对的”，这个论证的问题在于？',options:['人数不够多','把“多数人支持”等同于“正确”','没有给出数据','政策太复杂'],ans:1,tag:'逻辑·谬误',tip:'这是“诉诸众数”谬误：支持率高不代表结论正确，属于论据与论点之间缺少必然联系。'},
  {id:'j39',type:'choice',q:'“虎山长城遗址除一号台址外均未发现城砖，附近也没人拆砖盖房，因此长城用砖极少”，该推测需要的假设是？',options:['附近没有发现古砖窑','此地山高坡陡，砖难以运进运出','当地县志记载是夯土筑成','长城修建于明代'],ans:1,tag:'逻辑·前提',tip:'题干排除了“砖被拆走”，还需排除“砖根本运不进来”。若砖难以运入，则用砖少就与“被拆”无关，论证才成立。'},
  {id:'j40',type:'choice',q:'“所有科学家都严谨，小王严谨”，可以推出？',options:['小王是科学家','小王不是科学家','无法确定小王是不是科学家','严谨的人都是科学家'],ans:2,tag:'逻辑·三段论',tip:'肯定后件不能肯定前件。严谨只是科学家的必要条件，不是充分条件，所以推不出小王是科学家。'},
  {id:'j41',type:'choice',q:'桑梓∶家乡 相当于？',options:['社稷∶国家','杨柳∶离别','松柏∶坚贞','汗青∶史册'],ans:0,tag:'类比·借代',tip:'桑梓借代家乡，社稷借代国家，都是“用相关事物代指本体”。汗青∶史册也是借代，但要选与“乡土”同类的对应更需看二级辨析。'},
  {id:'j42',type:'choice',q:'破釜沉舟∶决心 相当于？',options:['背水一战∶绝境','卧薪尝胆∶励志','纸上谈兵∶空谈','守株待兔∶侥幸'],ans:1,tag:'类比·典故',tip:'破釜沉舟体现决心，卧薪尝胆体现励志，都是“典故→精神品质”。'},
  {id:'j43',type:'choice',q:'蚍蜉撼树∶自不量力 相当于？',options:['杯水车薪∶无济于事','画蛇添足∶多此一举','掩耳盗铃∶自欺欺人','以上都可以'],ans:3,tag:'类比·寓意',tip:'三组都是“行为→成语寓意”的同义关系，没有唯一性，这种题要看题干更具体的二级辨析（如是否含贬义、是否含比喻）。'},
  {id:'j44',type:'choice',q:'医生∶手术刀 相当于？',options:['农民∶土地','教师∶粉笔','学生∶书本','工人∶工厂'],ans:1,tag:'类比·工具',tip:'手术刀是医生使用的工具，粉笔是教师使用的工具。土地、工厂是场所，书本是对象。'},
  {id:'j45',type:'choice',q:'“望梅止渴”与“画饼充饥”的关系是？',options:['反义','近义（都是空想自慰）','无关','因果'],ans:1,tag:'类比·语义',tip:'两个成语都是用空想安慰自己，属近义关系。'},
  {id:'j46',type:'choice',q:'“如果所有 A 都是 B，有的 B 是 C”，能否推出“有的 A 是 C”？',options:['能推出','不能推出','一定能推出“所有 A 是 C”','能推出“没有 A 是 C”'],ans:1,tag:'逻辑·三段论',tip:'“有的 B 是 C”中的那部分 B 未必是 A，所以推不出 A 与 C 的关系。中项不周延，是典型的三段论陷阱。'},
  {id:'j47',type:'choice',q:'“甲、乙、丙三人中只有一人说真话。甲说：乙在说谎；乙说：丙在说谎；丙说：甲和乙都在说谎。”谁说真话？',options:['甲','乙','丙','无法确定'],ans:1,tag:'逻辑·真假话',tip:'假设乙真，则丙假；丙假意味着“甲乙都在说谎”为假，至少一人真——与“只有一人真”相容（乙真、甲假）。再验甲：甲说“乙说谎”为假，成立。'},
  {id:'j48',type:'choice',q:'削弱“多吃维生素 C 能预防感冒”最有力的方式是？',options:['有人吃了没预防住','指出实验未设对照组，且吃维 C 的人本身更注重健康','维 C 很便宜','维 C 是水溶性的'],ans:1,tag:'逻辑·削弱',tip:'指出“另有他因”并质疑实验设计，直接摧毁因果链，比举单个反例有力。'},
  {id:'j49',type:'choice',q:'“不可能所有的错误都能避免”，等价于？',options:['所有错误都能避免','必然有的错误不能避免','可能所有错误都不能避免','有的错误能避免'],ans:1,tag:'逻辑·模态',tip:'“不可能所有 S 都 P”= “必然有的 S 不 P”。否定词与量词、模态词的转换要一步步来。'},
  {id:'j50',type:'choice',q:'加强“某政策有效”的论证，最直接的是？',options:['说明政策制定过程严谨','对比实施前后，指标显著改善且无其他变量影响','引用专家好评','说明政策成本低'],ans:1,tag:'逻辑·加强',tip:'控制变量下的前后对比，直接建立了“政策→效果”的因果联系，比诉诸权威有力。'},
  {id:'j51',type:'choice',q:'苹果∶水果 相当于？',options:['长江∶河流','中国∶亚洲','车轮∶汽车','老师∶学生'],ans:0,tag:'类比·种属',tip:'苹果是水果的一种，长江是河流的一条，都是泛指种属。中国∶亚洲是组成关系。'},
  {id:'j52',type:'choice',q:'轮胎∶汽车 相当于？',options:['苹果∶水果','树叶∶大树','长江∶河流','医生∶职业'],ans:1,tag:'类比·组成',tip:'轮胎是汽车的组成部分，树叶是大树的组成部分。'},
  {id:'j53',type:'choice',q:'马铃薯∶土豆 相当于？',options:['西红柿∶番茄','苹果∶水果','钢笔∶文具','白天∶黑夜'],ans:0,tag:'类比·全同',tip:'马铃薯和土豆是同一种东西的不同叫法，西红柿和番茄也是。'},
  {id:'j54',type:'choice',q:'教师∶党员 相当于？',options:['律师∶作家','苹果∶水果','车轮∶汽车','白天∶黑夜'],ans:0,tag:'类比·交叉',tip:'有的教师是党员，有的不是；有的律师是作家，有的不是。都是交叉关系。'},
  {id:'j55',type:'choice',q:'有∶无 相当于？',options:['红∶白','生∶死','苹果∶水果','钢笔∶铅笔'],ans:1,tag:'类比·矛盾',tip:'有与无是矛盾关系（非此即彼），生与死同理。红与白是反对关系。'},
  {id:'j56',type:'choice',q:'春天∶夏天 相当于？',options:['生∶死','苹果∶水果','红∶蓝','合法∶非法'],ans:2,tag:'类比·反对',tip:'春夏都是季节，但季节不止两个，属反对关系。红与蓝同属颜色，也是反对。'},
  {id:'j57',type:'choice',q:'空调∶降温 相当于？',options:['洗衣机∶洗涤','苹果∶水果','车轮∶汽车','教师∶学生'],ans:0,tag:'类比·功能',tip:'空调的主要功能是降温，洗衣机的主要功能是洗涤。'},
  {id:'j58',type:'choice',q:'面粉∶面包 相当于？',options:['木材∶桌子','苹果∶水果','车轮∶汽车','老师∶学生'],ans:0,tag:'类比·原材料',tip:'面粉是面包的原材料，木材是桌子的原材料，都是物理加工。'},
  {id:'j59',type:'choice',q:'下雨∶地湿 相当于？',options:['锻炼∶健康','苹果∶水果','车轮∶汽车','红∶白'],ans:0,tag:'类比·因果',tip:'下雨导致地湿，锻炼导致健康，都是因果关系。'},
    {id:'j60',type:'choice',q:'刻舟求剑∶不知变通 相当于？',options:['守株待兔∶心存侥幸','画蛇添足∶多此一举','掩耳盗铃∶自欺欺人','亡羊补牢∶及时补救'],ans:0,tag:'类比·寓意',tip:'刻舟求剑讽刺不知变通，守株待兔讽刺心存侥幸，都是“成语→被讽刺的错误心态”。画蛇添足、掩耳盗铃的寓意结构不同，亡羊补牢是褒义。'},
  {id:'j61',type:'choice',q:'书信∶电子邮件 相当于？',options:['马车∶高铁','苹果∶水果','车轮∶汽车','红∶白'],ans:0,tag:'类比·功能相同',tip:'书信与电子邮件功能相同，是不同时代的替代品；马车与高铁同理。'},
  {id:'j62',type:'choice',q:'医生∶病人 相当于？',options:['教师∶学生','苹果∶水果','车轮∶汽车','红∶白'],ans:0,tag:'类比·对应',tip:'医生服务病人，教师服务学生，都是职业与服务对象的对应关系。'},
  {id:'j63',type:'choice',q:'心脏∶人体 相当于？',options:['发动机∶汽车','苹果∶水果','长江∶河流','老师∶学生'],ans:0,tag:'类比·组成+功能',tip:'心脏是人体的核心器官，发动机是汽车的核心部件，都是关键组成部分。'},
  {id:'j64',type:'choice',q:'“春夏秋冬”这组词的构词关系是？',options:['并列','偏正','主谓','动宾'],ans:0,tag:'类比·构词',tip:'四个季节并列堆叠，没有修饰关系，属并列结构。'},
  {id:'j65',type:'choice',q:'“雪白∶火红”这组词的构词关系是？',options:['并列（比喻式偏正）','主谓','动宾','补充'],ans:0,tag:'类比·构词',tip:'“雪白”“火红”都是“像雪一样白”“像火一样红”的比喻式偏正结构，两词并列。'},
  {id:'j66',type:'choice',q:'“如果甲当选，那么乙落选”，已知乙没有落选，可推出？',options:['甲当选','甲没有当选','乙当选','无法判断'],ans:1,tag:'逻辑·翻译',tip:'A→B，¬B ⇒ ¬A。否定后件可以否定前件，这是有效推理。'},
  {id:'j67',type:'choice',q:'“只有年满 18 周岁，才有选举权”，可推出？',options:['年满 18 就有选举权','没有选举权说明未满 18','有选举权说明年满 18','未满 18 也可能有选举权'],ans:2,tag:'逻辑·翻译',tip:'“只有 A 才 B”翻译为 B→A。有选举权⇒年满 18。但年满 18 不一定有选举权（还可能有其他条件）。'},
  {id:'j68',type:'choice',q:'“并非所有学生都及格”等价于？',options:['所有学生都不及格','有的学生不及格','有的学生及格','没有人及格'],ans:1,tag:'逻辑·矛盾',tip:'“并非所有 S 都 P”= “有的 S 不 P”。'},
  {id:'j69',type:'choice',q:'“甲不去或乙不去”的矛盾命题是？',options:['甲和乙都不去','甲和乙都去','甲去乙不去','甲不去乙去'],ans:1,tag:'逻辑·矛盾',tip:'“¬A 或 ¬B”的矛盾是“A 且 B”，即两人都去。'},
    {id:'j70',type:'choice',q:'三人中只有一人说真话。甲：我没做；乙：甲做的；丙：我没做。是谁做的？',options:['甲','乙','丙','无法判断'],ans:2,tag:'逻辑·真假话',tip:'甲和乙的话互相矛盾，必有一真一假，所以丙一定说假话——即“我没做”为假，是丙做的。验证：甲真、乙假、丙假，只有一人说真话，成立。'},
  {id:'j71',type:'choice',q:'削弱“喝咖啡导致失眠”最有力的是？',options:['有人喝咖啡也睡得香','喝咖啡的人往往本身压力大、作息乱','咖啡很苦','咖啡销量在上升'],ans:1,tag:'逻辑·削弱',tip:'指出“另有他因”（压力大、作息乱），直接切断咖啡与失眠的因果链。'},
  {id:'j72',type:'choice',q:'加强“某药有效”最直接的是？',options:['专家推荐','随机双盲对照试验显示显著优于安慰剂','价格便宜','服用方便'],ans:1,tag:'逻辑·加强',tip:'随机双盲对照是验证疗效的金标准，直接建立因果关系。'},
  {id:'j73',type:'choice',q:'“某城市犯罪率下降，是因为加强了巡逻”，这一论证需要的假设是？',options:['巡逻成本不高','同期没有其他导致犯罪率下降的重大因素','警察人数增加','居民满意'],ans:1,tag:'逻辑·前提',tip:'排除其他可能原因，是因果论证成立的必要条件。否则无法确定是巡逻起的作用。'},
  {id:'j74',type:'choice',q:'定义判断：行政许可是指行政机关根据申请，经依法审查准予从事特定活动的行为。下列属于行政许可的是？',options:['工商局对某企业的处罚','交管局颁发驾驶证','法院判决离婚','消费者投诉'],ans:1,tag:'逻辑·定义',tip:'颁发驾驶证是“依申请—审查—准予从事特定活动（驾驶）”，完全符合定义。处罚、判决、投诉都不符合。'},
  {id:'j75',type:'choice',q:'“所有 A 都是 B，所有 B 都是 C”，可以推出？',options:['所有 A 都是 C','有的 A 不是 C','所有 C 都是 A','无法推出'],ans:0,tag:'逻辑·三段论',tip:'A⊆B，B⊆C ⇒ A⊆C。这是最基础的三段论传递。'},
  {id:'j76',type:'choice',q:'“有的 A 是 B，所有 B 都是 C”，可以推出？',options:['所有 A 都是 C','有的 A 是 C','有的 C 不是 A','无法推出'],ans:1,tag:'逻辑·三段论',tip:'那些“是 B 的 A”一定也是 C，所以至少有的 A 是 C。'},
  {id:'j77',type:'choice',q:'排序题：小李比小王高，小王比小张高，小张比小赵高。谁最矮？',options:['小李','小王','小张','小赵'],ans:3,tag:'逻辑·排序',tip:'李>王>张>赵，所以小赵最矮。这类题画个链条就不容易错。'},
  {id:'j78',type:'choice',q:'“A 和 B 至少有一个去”与“A 和 B 都不去”是什么关系？',options:['等价','矛盾','推出','无关'],ans:1,tag:'逻辑·矛盾',tip:'“A 或 B”与“¬A 且 ¬B”互为矛盾命题，必有一真一假。'},
  {id:'j79',type:'choice',q:'“除非努力，否则不能成功”可推出？',options:['努力就能成功','成功说明努力过','不努力也可能成功','努力与成功无关'],ans:1,tag:'逻辑·翻译',tip:'“除非 A 否则 B”= ¬A→B。所以“不努力→不成功”，逆否即“成功→努力”。'},
  {id:'j80',type:'choice',q:'削弱“某地长寿是因为水质好”，最有力的是？',options:['水质确实好','该地居民普遍有良好的饮食和运动习惯，且外来人口寿命同样长','有人不喜欢喝当地水','水质检测达标'],ans:1,tag:'逻辑·削弱',tip:'指出当地人和外来人口都长寿，说明与本地水质无关，同时给出他因，双重削弱。'}

const idiomBank = [
  {id:'i01',type:'choice',q:'“这次比赛他发挥得差强人意”，意思是？',options:['表现很差，令人失望','大体上还能让人满意','完全超出预期','勉强及格'],ans:1,tag:'成语·易错',tip:'差强人意 = 大体上还能使人满意（差：稍微）。不是“不满意”，这是公考最高频的望文生义陷阱。'},
  {id:'i02',type:'choice',q:'“他的建议不孚众望，被大家否决了”，用法是否正确？',options:['正确，指辜负了大家的期望','错误，应改为“不负众望”','正确，指与众不同','错误，应改为“不负重望”'],ans:0,tag:'成语·易错',tip:'不孚众望 = 不能使大家信服，辜负期望（孚：信服）。不负众望 = 没有辜负期望。两个字颠倒，意思相反。'},
  {id:'i03',type:'choice',q:'“七月流火”的正确含义是？',options:['天气炎热','天气转凉','战火纷飞','流星划过'],ans:1,tag:'成语·易错',tip:'七月流火出自《诗经》，“火”指心宿二，农历七月它向西下沉，标志天气转凉，不是形容热。'},
  {id:'i04',type:'choice',q:'“空穴来风”现在的规范用法是？',options:['消息毫无根据','消息不是完全没有根据的','风很大','房子漏风'],ans:1,tag:'成语·易错',tip:'原意“有了洞穴才有风”，比喻消息不是完全没有原因的。现在常被误用为“毫无根据”，公考按原意考。'},
  {id:'i05',type:'choice',q:'“明日黄花”比喻？',options:['未来的希望','过时的事物','明天的事','黄色的花'],ans:1,tag:'成语·易错',tip:'明日黄花指重阳节后的菊花，比喻过时的事物。常被误写成“昨日黄花”，那是错的。'},
  {id:'i06',type:'choice',q:'“万人空巷”形容？',options:['街巷空无一人，很冷清','家家户户都出来，场面热闹','道路堵塞','人口流失'],ans:1,tag:'成语·易错',tip:'万人空巷指家家户户的人都从巷子里出来了，形容庆祝、欢迎的盛况，不是“空无一人”。'},
  {id:'i07',type:'choice',q:'“首当其冲”的意思是？',options:['第一个冲上前','最先受到攻击或遭遇灾难','首先承担责任','冲在最前面带头'],ans:1,tag:'成语·易错',tip:'首当其冲 = 最先受到攻击或遭遇灾难，含被动意味，不是“带头冲锋”。'},
  {id:'i08',type:'choice',q:'“炙手可热”形容？',options:['东西很烫手','权势大、气焰盛','非常受欢迎的商品','天气炎热'],ans:1,tag:'成语·易错',tip:'炙手可热原指手一靠近就觉得热，比喻权势大、气焰盛，含贬义。不能用来形容商品热销。'},
  {id:'i09',type:'choice',q:'“罄竹难书”形容？',options:['书写材料不够用','罪行极多，写都写不完','文章很长','竹子很多'],ans:1,tag:'成语·易错',tip:'罄竹难书专用于形容罪行多得写不完，不能用来形容功劳或好事多。'},
  {id:'i10',type:'choice',q:'“目无全牛”比喻？',options:['目中无人','技艺纯熟，得心应手','看不清整体','眼光狭隘'],ans:1,tag:'成语·易错',tip:'出自《庖丁解牛》，指眼里没有完整的牛，形容技艺高超纯熟，是褒义，不是“目中无人”。'},
  {id:'i11',type:'choice',q:'“不刊之论”指？',options:['不能刊登的言论','不能改动或不可磨灭的言论','没有价值的观点','刊物的评论'],ans:1,tag:'成语·易错',tip:'“刊”是削除、修改的意思，不刊之论指正确的、不可修改的言论，是褒义。'},
  {id:'i12',type:'choice',q:'“屡试不爽”的意思是？',options:['多次尝试都不成功','多次试验都没有差错','试了很多次很爽','次次失败'],ans:1,tag:'成语·易错',tip:'“爽”是差错的意思。屡试不爽 = 屡次试验都没有差错，不是“不爽快”。'},
  {id:'i13',type:'choice',q:'“耳提面命”形容？',options:['当面批评','恳切地教导','贴在耳边说话','严厉责骂'],ans:1,tag:'成语·易错',tip:'耳提面命指不但当面告诉他，而且揪着他的耳朵叮嘱，形容教诲殷切，是褒义。'},
  {id:'i14',type:'choice',q:'“无所不至”与“无微不至”的区别是？',options:['前者褒义，后者贬义','前者贬义（什么坏事都干得出来），后者褒义（关怀细致）','完全同义','前者指空间，后者指时间'],ans:1,tag:'成语·辨析',tip:'无所不至 = 没有达不到的地方，多指坏事做绝；无微不至 = 关怀照顾非常细致。一字之差，褒贬相反。'},
  {id:'i15',type:'choice',q:'“鱼龙混杂”与“鱼目混珠”的区别是？',options:['前者指好坏掺杂，后者指以假乱真','两者完全一样','前者指人多，后者指货多','前者贬义，后者褒义'],ans:0,tag:'成语·辨析',tip:'鱼龙混杂强调好的坏的混在一起（指人）；鱼目混珠强调用假的冒充真的（指物）。'},
  {id:'i16',type:'choice',q:'“振振有词”的感情色彩是？',options:['褒义，形容理由充分','贬义，形容自以为有理地强辩','中性','没有色彩'],ans:1,tag:'成语·辨析',tip:'振振有词多含贬义，指自以为理由充分而强辩。形容理由正当应用“理直气壮”。'},
  {id:'i17',type:'choice',q:'“曾几何时”的正确用法是？',options:['表示时间过去没多久','表示很久以前','表示将来','表示任何时候'],ans:0,tag:'成语·易错',tip:'曾几何时 = 才过了没多少时候，指时间过去不久。常被误用为“曾经”。'},
  {id:'i18',type:'choice',q:'“不负众望”的意思是？',options:['辜负了大家的期望','没有辜负大家的期望','和大家期望不同','超出期望'],ans:1,tag:'成语·辨析',tip:'负 = 辜负。不负众望 = 没辜负期望（褒义）；不孚众望 = 不能使人信服（贬义）。'},
  {id:'i19',type:'choice',q:'“相濡以沫”原指？',options:['互相吐口水','在困境中互相扶持','感情淡薄','互相埋怨'],ans:1,tag:'成语·释义',tip:'出自《庄子》，泉水干涸时鱼用唾沫互相湿润，比喻同处困境、以微薄之力互相帮助。'},
  {id:'i20',type:'choice',q:'“危言危行”的意思是？',options:['危险的言论和行为','讲正直的话，做正直的事','危言耸听','言行不一'],ans:1,tag:'成语·易错',tip:'“危”是正直的意思。危言危行 = 说正直的话、做正直的事，是褒义。'},
  {id:'i21',type:'choice',q:'“七月流火，九月授衣”中“授衣”指？',options:['发放衣服','准备寒衣','赠送礼物','缝制新衣'],ans:1,tag:'成语·文化',tip:'出自《诗经·豳风·七月》，九月天气转凉，该准备寒衣了。与“七月流火”同源，都指季节转凉。'},
  {id:'i22',type:'choice',q:'“不以为然”与“不以为意”的区别是？',options:['前者不认为对，后者不放在心上','两者相同','前者不重视，后者不同意','都是贬义'],ans:0,tag:'成语·辨析',tip:'不以为然 = 不认为是对的（表反对）；不以为意 = 不把它放在心上（表轻视）。'},
  {id:'i23',type:'choice',q:'“望其项背”通常用于？',options:['表示赶得上','表示赶不上，前面要加“难以”','表示回头看','表示仰慕'],ans:1,tag:'成语·易错',tip:'“望其项背”指能赶得上，但公考中多以“难以望其项背”出现表示赶不上。单独用“望其项背”表示赶不上是误用。'},
  {id:'i24',type:'choice',q:'“三人成虎”比喻？',options:['人多力量大','谣言重复多次就会让人信以为真','三人合作','老虎很凶猛'],ans:1,tag:'成语·释义',tip:'出自《战国策》，三个人都说市上有虎，听者就信了，比喻谣言反复传播就会被当成事实。'},
  {id:'i25',type:'choice',q:'“弹冠相庆”的感情色彩是？',options:['褒义，庆祝好消息','贬义，指坏人得意','中性','多用于节日'],ans:1,tag:'成语·辨析',tip:'弹冠相庆指一人做了官，同伙互相庆贺将有官可做，多含贬义，用于坏人。'},
  {id:'i26',type:'choice',q:'“屡见不鲜”中“鲜”的意思是？',options:['新鲜','少','鲜艳','鲜美'],ans:1,tag:'成语·释义',tip:'鲜 = 新奇、少。屡见不鲜 = 经常见到，并不新奇。'},
  {id:'i27',type:'choice',q:'“火中取栗”比喻？',options:['勇敢无畏','受人利用，冒险为别人出力而自己吃亏','趁火打劫','解决难题'],ans:1,tag:'成语·释义',tip:'出自拉封丹寓言，猴子骗猫从火中取栗子，猫烧伤了爪子，栗子却被猴子吃了。'},
  {id:'i28',type:'choice',q:'“别无长物”形容？',options:['没有特长','生活穷困，一无所有','没有长处','很谦虚'],ans:1,tag:'成语·易错',tip:'“长物”指多余的东西。别无长物 = 除一身之外再没有多余的东西，形容贫穷，不是“没有特长”。'},
  {id:'i29',type:'choice',q:'“不胫而走”形容？',options:['没有腿却能跑，指消息传得快','偷偷溜走','走路不稳','突然消失'],ans:0,tag:'成语·释义',tip:'胫 = 小腿。不胫而走 = 没有腿却能跑，形容消息传播迅速。注意与“不翼而飞”（东西丢失）区分。'},
  {id:'i30',type:'choice',q:'“七月流火”与“八月未央”中的季节指向？',options:['都指盛夏','七月流火指夏末转凉，未央指未尽','都指深秋','没有季节含义'],ans:1,tag:'成语·文化',tip:'《诗经》中的月份多用农历，七月流火标志暑气渐退，“未央”意为未尽。理解这类成语要回到历法背景。'},
  {id:'i31',type:'choice',q:'“首屈一指”的意思是？',options:['第一个手指','位居第一','勉强及格','首当其冲'],ans:1,tag:'成语·释义',tip:'首屈一指 = 扳指头计数时首先弯下大拇指，表示居第一位，是褒义。'},
  {id:'i32',type:'choice',q:'“不落窠臼”形容？',options:['不落俗套，有独创性','掉进坑里','没有归宿','不守规矩'],ans:0,tag:'成语·释义',tip:'窠臼指老套子。不落窠臼 = 有独创风格，不落俗套，褒义。'},
  {id:'i33',type:'choice',q:'“亦步亦趋”的感情色彩是？',options:['褒义，形容紧跟','贬义，形容缺乏主见、盲目模仿','中性','多用于褒扬'],ans:1,tag:'成语·辨析',tip:'亦步亦趋原指跟着走，现多含贬义，形容事事模仿、缺乏主见。'},
  {id:'i34',type:'choice',q:'“方兴未艾”形容？',options:['刚刚兴起，正在发展','即将衰亡','已经结束','从未开始'],ans:0,tag:'成语·释义',tip:'方：正在；艾：停止。方兴未艾 = 正在兴起，尚未停止，多形容新生事物。'},
  {id:'i35',type:'choice',q:'“空谷足音”比喻？',options:['声音好听','极难得的音信或言论','空无一人','回声'],ans:1,tag:'成语·释义',tip:'空谷足音指在空旷山谷中听到脚步声，比喻极难得的音信、言论或来访。'},
  {id:'i36',type:'choice',q:'“一蹴而就”通常用于？',options:['肯定句，表示容易成功','否定句，表示不能轻易成功','形容跑得快','形容速度快'],ans:1,tag:'成语·辨析',tip:'一蹴而就多用于否定（“不可能一蹴而就”），形容事情不能轻易成功。'},
  {id:'i37',type:'choice',q:'“讳莫如深”指？',options:['隐瞒得很紧，不肯透露','研究得很深','感情很深','说话很深奥'],ans:0,tag:'成语·释义',tip:'讳：隐瞒。讳莫如深 = 隐瞒得没有比这更深的了，指把事情瞒得很紧。'},
  {id:'i38',type:'choice',q:'“长此以往”通常用于？',options:['好的发展趋势','不好的结果（含担忧）','中性描述','过去的事'],ans:1,tag:'成语·辨析',tip:'长此以往多用于假设不好的情况持续下去，含担忧意味，不宜用于积极语境。'},
  {id:'i39',type:'choice',q:'“痛心疾首”形容？',options:['头痛','痛恨、悲痛到极点','身体不适','非常生气地骂人'],ans:1,tag:'成语·释义',tip:'痛心疾首形容痛恨、悲痛到极点，也可形容悔恨。'},
  {id:'i40',type:'choice',q:'“蔚然成风”的感情色彩是？',options:['褒义，形容良好风气形成','贬义，形容歪风','中性','只能用于自然现象'],ans:0,tag:'成语·辨析',tip:'蔚然成风指一件事情逐渐发展流行，形成风气，多用于好的事情。'},
  {id:'i41',type:'choice',q:'“安土重迁”的意思是？',options:['重视搬迁','安于故土，不愿轻易迁移','搬迁很重','重新安置'],ans:1,tag:'成语·释义',tip:'安土重迁指留恋故乡，不愿轻易迁居。重：看重。'},
  {id:'i42',type:'choice',q:'“白驹过隙”比喻？',options:['白色的马','时间过得极快','缝隙很小','道路崎岖'],ans:1,tag:'成语·释义',tip:'像白马从缝隙前一闪而过，形容时间飞逝。'},
